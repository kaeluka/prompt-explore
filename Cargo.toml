[package]
name = "prompt-explore"
version = "0.1.0"
edition = "2024"

[dependencies]
async-openai = { version = "0.41.3", features = ["chat-completion", "rustls"] }
async-trait = "0.1.91"
jsonschema = "0.49.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
