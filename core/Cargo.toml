[package]
name = "prompt-explore"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Property-based testing for agent behavior: state a behavioral question, get reproducible witness traces and unverified fix proposals."

[dependencies]
async-trait = "0.1.91"
# AWS Bedrock control-plane listing (ListFoundationModels /
# ListInferenceProfiles) for GET /api/models — reads the same default
# credential chain (env/profile/SSO/aws-login/IMDS) that genai's
# bedrock-sigv4 adapter signs generation requests with. `credentials-login`
# lets the SDK consume temporary credentials created by AWS CLI `aws login`.
# aws-config is already a transitive dep of genai's bedrock-sigv4 feature;
# making it direct also unifies this feature into that dependency.
aws-config = { version = "1", features = ["credentials-login"] }
aws-sdk-bedrock = "1"
# Multi-provider LLM client (OpenAI-format: z.ai/OpenRouter; native: Bedrock
# Converse+SigV4). `bedrock-sigv4` pulls aws-config (heavy) for the default
# AWS credential chain (env/profile/SSO/IMDS).
# Temporary pin for model-specific Bedrock OpenAI reasoning fields.
# Return to crates.io once an upstream release includes this fix:
# https://github.com/kaeluka/rust-genai/issues/1
genai = { git = "https://github.com/kaeluka/rust-genai.git", rev = "849d657347429fe04753a487422ab06ab4e098db", features = ["bedrock-sigv4"] }
# GCP Application Default Credentials for the Vertex AI (Gemini) provider —
# the GCP analog of aws-config: reads the ADC file written by
# `gcloud auth application-default login`, caches + refreshes OAuth2 tokens.
gcp_auth = "0.12"
# Consume genai's chat event stream (`StreamExt::next`) in the streaming
# completion wrapper that presents a streamed reply in the blocking call's shape.
futures-util = "0.3"
# Parse provider Retry-After HTTP-date headers (already a transitive dependency).
httpdate = "1"
jsonschema = "0.49.3"
# Sandboxed Lua 5.4 runtime for optional deterministic tool handlers.
mlua = { version = "0.10", features = ["lua54", "vendored"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
similar = { version = "3.1.1", default-features = false, features = ["text", "unicode"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
utoipa = { version = "5.5.0", features = ["macros"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
