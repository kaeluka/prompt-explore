[package]
name = "prompt-explore"
version.workspace = true
edition.workspace = true
description = "Property-based testing for agent behavior: state a behavioral question, get reproducible witness traces and unverified fix proposals."

[dependencies]
async-trait = "0.1.91"
# Multi-provider LLM client (OpenAI-format: z.ai/OpenRouter; native: Bedrock
# Converse+SigV4). `bedrock-sigv4` pulls aws-config (heavy) for the default
# AWS credential chain (env/profile/SSO/IMDS).
genai = { version = "0.7.0-beta", features = ["bedrock-sigv4"] }
jsonschema = "0.49.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = { version = "3.1.1", default-features = false, features = ["text", "unicode"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
utoipa = { version = "5.5.0", features = ["macros"] }
