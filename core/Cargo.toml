[package]
name = "prompt-explore"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Property-based testing for agent behavior: state a behavioral question, get reproducible witness traces and unverified fix proposals."

[dependencies]
async-trait = "0.1.91"
# AWS Bedrock control-plane listing (ListFoundationModels /
# ListInferenceProfiles) for GET /api/models — reads the same default
# credential chain (env/profile/SSO/IMDS) that genai's bedrock-sigv4
# adapter signs generation requests with. aws-config is already a
# transitive dep of genai's bedrock-sigv4 feature; making it direct
# adds no new crates to the build beyond aws-sdk-bedrock.
aws-config = "1"
aws-sdk-bedrock = "1"
# Multi-provider LLM client (OpenAI-format: z.ai/OpenRouter; native: Bedrock
# Converse+SigV4). `bedrock-sigv4` pulls aws-config (heavy) for the default
# AWS credential chain (env/profile/SSO/IMDS).
genai = { version = "0.7.0-beta", features = ["bedrock-sigv4"] }
# GCP Application Default Credentials for the Vertex AI (Gemini) provider —
# the GCP analog of aws-config: reads the ADC file written by
# `gcloud auth application-default login`, caches + refreshes OAuth2 tokens.
gcp_auth = "0.12"
jsonschema = "0.49.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = { version = "3.1.1", default-features = false, features = ["text", "unicode"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
utoipa = { version = "5.5.0", features = ["macros"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
