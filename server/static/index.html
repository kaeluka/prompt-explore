<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prompt-explore · jobs</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1d212b; --border: #2a2f3b;
    --text: #e6e8ec; --text-dim: #9aa3b2; --accent: #7c6cff; --accent-2: #5a4bd6;
    --red: #ff6b6b; --green: #51cf8a; --amber: #f5b556;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.55; }
  .wrap { max-width: 940px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  header { display: flex; align-items: baseline; gap: 0.7rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
  header h1 { font-size: 1.15rem; margin: 0; }
  header .sub { color: var(--text-dim); font-size: 0.85rem; }
  header .auto { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }
  .meta { color: var(--text-dim); font-size: 0.85rem; }
  .card { background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 1rem 1.1rem; margin: 0.7rem 0; }
  .card h2 { font-size: 0.92rem; margin: 0; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .mono { font-family: var(--mono); }
  .badge { display: inline-block; font-size: 0.74rem; font-weight: 700;
    padding: 0.16rem 0.55rem; border-radius: 999px; letter-spacing: 0.02em; }
  .badge.running { background: rgba(124,108,255,0.16); color: #b7aaff; border: 1px solid rgba(124,108,255,0.4); }
  .badge.done { background: rgba(81,207,138,0.12); color: var(--green); border: 1px solid rgba(81,207,138,0.35); }
  .badge.failed { background: rgba(255,107,107,0.12); color: var(--red); border: 1px solid rgba(255,107,107,0.35); }
  .badge.witness_found { background: rgba(255,107,107,0.14); color: var(--red); border: 1px solid rgba(255,107,107,0.4); }
  .badge.no_witness_within_budget { background: rgba(81,207,138,0.12); color: var(--green); border: 1px solid rgba(81,207,138,0.35); }
  .badge.partial { background: rgba(245,181,86,0.14); color: var(--amber); border: 1px solid rgba(245,181,86,0.35); }
  .badge.error { background: rgba(255,107,107,0.14); color: var(--red); border: 1px solid rgba(255,107,107,0.4); }
  .spinner { width: 13px; height: 13px; border-radius: 50%; display: inline-block;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { color: var(--text-dim); text-align: center; padding: 3rem 0; }
  details { margin-top: 0.4rem; }
  summary { cursor: pointer; color: var(--text-dim); font-size: 0.84rem; user-select: none; }
  summary:hover { color: var(--text); }
  .scen { border-left: 2px solid var(--border); padding-left: 0.8rem; margin: 0.6rem 0; }
  .scen-head { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .scen-id { font-family: var(--mono); font-size: 0.82rem; }
  .step { font-family: var(--mono); font-size: 0.76rem; color: var(--text-dim);
    margin: 0.25rem 0; padding: 0.3rem 0.45rem; background: var(--panel-2);
    border-radius: 5px; border-left: 2px solid var(--border); white-space: pre-wrap; word-break: break-word; max-height: 10em; overflow: auto; }
  .chat { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.4rem; }
  .bubble { max-width: 82%; padding: 0.4rem 0.6rem; border-radius: 9px; font-size: 0.8rem; }
  .bubble.put { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--border); }
  .bubble.sim { align-self: flex-end; background: rgba(124,108,255,0.10); border: 1px solid rgba(124,108,255,0.30); }
  .bubble .role { font-size: 0.66rem; color: var(--text-dim); margin-bottom: 0.18rem; letter-spacing: 0.04em; }
  .bubble .body { white-space: pre-wrap; word-break: break-word; }
  .bubble .body.tool { font-family: var(--mono); font-size: 0.76rem; }
  .note { color: var(--amber); font-size: 0.82rem; }
  button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.3rem 0.7rem; cursor: pointer; font-size: 0.8rem; }
  button:hover { border-color: var(--accent); }
  .toggle { font-size: 0.78rem; }
</style>
</head>
<body>
<div class="wrap"><div id="root"></div></div>

<script type="importmap">
{ "imports": {
  "preact": "/vendor/preact.mjs",
  "preact/hooks": "/vendor/hooks.mjs",
  "htm": "/vendor/htm.mjs"
} }
</script>
<script type="module">
import { h, render } from 'preact';
import { useState, useEffect } from 'preact/hooks';
import htm from 'htm';
const html = htm.bind(h);

const API = id => `/api/investigations${id ? '/'+id : ''}`;
const fmtUsage = u => u ? `${u.input_tokens.toLocaleString()} in${u.cache_read_tokens?` (${u.cache_read_tokens.toLocaleString()} cached)`:''} / ${u.output_tokens.toLocaleString()} out · ${u.llm_calls} llm · ${u.tool_calls} tool calls` : '';
const pretty = v => { try { return JSON.stringify(v, null, 2); } catch { return String(v); } };
const relTime = ms => { const s=(Date.now()-ms)/1000; if(s<60) return `${Math.floor(s)}s ago`; if(s<3600) return `${Math.floor(s/60)}m ago`; return `${Math.floor(s/3600)}h ago`; };

function ScenBadge({ s }) {
  const st = s.state || {}, kind = st.kind || 'running';
  if (kind === 'running') return html`<span class="badge running"><span class="spinner"></span> running</span>`;
  if (kind === 'done') return html`<span class="badge ${st.matched ? 'witness_found':'no_witness_within_budget'}">${st.matched ? 'witness':'no match'}</span>`;
  if (kind === 'failed') return html`<span class="badge error">failed: ${st.stage}</span>`;
  return null;
}

function Bubble({ side, role, body, tool }) {
  return html`<div class=${`bubble ${side}`}><div class="role">${role}</div><div class=${`body${tool ? ' tool':''}`}>${body}</div></div>`;
}

function Chat({ s }) {
  const out = [];
  if (s.user_message && s.user_message.trim()) out.push(html`<${Bubble} key="u" side="sim" role="USER" body=${s.user_message} />`);
  (s.steps || []).forEach((st, i) => {
    if (st.model_output && st.model_output.trim())
      out.push(html`<${Bubble} key=${'o'+i} side="put" role="PUT" body=${st.model_output} />`);
    if (st.tool_call) {
      const a = st.tool_call.args;
      const args = typeof a === 'string' ? a : JSON.stringify(a);
      out.push(html`<${Bubble} key=${'t'+i} side="put" role="PUT · tool" tool=${true} body=${`🔧 ${st.tool_call.name}(${args})`} />`);
    }
    if (st.tool_response != null) {
      const t = typeof st.tool_response === 'string' ? st.tool_response : JSON.stringify(st.tool_response, null, 2);
      out.push(html`<${Bubble} key=${'r'+i} side="sim" role="SIM" body=${t} />`);
    }
  });
  return html`<div class="chat">${out.length ? out : html`<span class="meta">(no messages yet)</span>`}</div>`;
}

function ScenarioPanel({ prog, input }) {
  const st = prog.state || {}, kind = st.kind || 'running';
  return html`
    <div class="scen" key=${prog.scenario_id}>
      <div class="scen-head">
        <span class="scen-id">${prog.scenario_id}</span>
        <${ScenBadge} s=${prog} />
        <span class="meta">${(prog.steps||[]).length} turn(s)</span>
      </div>
      ${kind === 'failed' ? html`<div class="note" style="margin:0.3rem 0">${st.error}</div>` : null}
      ${input ? html`
        <details>
          <summary>scenario spec (narrative)</summary>
          <div class="body" style="white-space:pre-wrap;word-break:break-word;padding:0.3rem 0">${input.narrative || '(no narrative)'}</div>
          ${input.simulator_notes ? html`<div class="meta" style="margin-top:0.4rem"><b>simulator notes:</b> ${input.simulator_notes}</div>` : null}
          ${input.world_state && Object.keys(input.world_state).length ? html`<details><summary class="meta">world state</summary><pre class="step">${pretty(input.world_state)}</pre></details>` : null}
        </details>` : null}
      <details>
        <summary>conversation</summary>
        <${Chat} s=${prog} />
      </details>
    </div>`;
}

function PutPanel({ put }) {
  if (!put) return null;
  const tools = (put.tools || []).map(t => t.name);
  return html`
    <details style="margin-top:0.4rem">
      <summary class="meta">prompt under test</summary>
      <div class="meta" style="margin:0.3rem 0"><b>design goals:</b> ${put.design_goals || ''}</div>
      ${tools.length ? html`<div class="meta" style="margin:0.3rem 0"><b>tools:</b> ${tools.join(', ')}</div>` : null}
      <details style="margin-top:0.3rem"><summary class="meta">template</summary><div class="body" style="white-space:pre-wrap;word-break:break-word;padding:0.3rem 0;font-size:0.78rem">${put.template || ''}</div></details>
    </details>`;
}

function ResultLine({ j }) {
  const r = j.result; if (!r) return null;
  const rr = r.result;
  return html`
    <div style="margin-top:0.5rem">
      <span class="badge ${rr.status}">${rr.status}</span>
      <span class="meta"> ${rr.scenarios_tried} scenario(s) · ${r.attempts.length} judged${(rr.failures&&rr.failures.length)?' · '+rr.failures.length+' failed':''}</span>
      ${r.usage ? html`<div class="meta" style="margin-top:0.2rem">${fmtUsage(r.usage)}</div>` : null}
      ${rr.failures && rr.failures.length ? html`<details style="margin-top:0.3rem"><summary class="note">failures</summary><div>${rr.failures.map(f => html`<div class="step"><b>${f.scenario_id}</b> (${f.stage}): ${f.error}</div>`)}</div></details>` : null}
    </div>`;
}

function JobCard({ j }) {
  const inputById = {}; (j.scenarios || []).forEach(s => { inputById[s.id] = s; });
  const progs = (j.progress && j.progress.scenarios) || [];
  return html`
    <div class="card" key=${j.id}>
      <h2>
        <span class="badge ${j.status}">${j.status}</span>
        <span class="mono meta">${(j.id || '').slice(0,8)}</span>
        <span class="meta">${'· ' + relTime(j.started_at)}</span>
      </h2>
      <div class="meta" style="margin:0.4rem 0"><b>question:</b> ${j.question || ''}</div>
      <${PutPanel} put=${j.put} />
      <${ResultLine} j=${j} />
      <div class="scens" style="margin-top:0.5rem">
        ${progs.map(p => html`<${ScenarioPanel} key=${p.scenario_id} prog=${p} input=${inputById[p.scenario_id]} />`)}
      </div>
    </div>`;
}

function App() {
  const [jobs, setJobs] = useState(null); // null = loading
  const [auto, setAuto] = useState(true);

  useEffect(() => {
    if (!auto) return;
    let stop = false;
    const poll = async () => {
      try {
        const list = await fetch(API()).then(r => r.json());
        if (!list.length) { if (!stop) setJobs([]); return; }
        const views = await Promise.all(list.map(s => fetch(API(s.id)).then(r => r.json())));
        if (!stop) setJobs(views);
      } catch (e) { console.error(e); }
    };
    poll();
    const id = setInterval(poll, 2500);
    return () => { stop = true; clearInterval(id); };
  }, [auto]);

  const expandAll = () => {
    const all = [...document.querySelectorAll('#root details')];
    const anyClosed = all.some(d => !d.hasAttribute('open'));
    all.forEach(d => { if (anyClosed) d.setAttribute('open', ''); else d.removeAttribute('open'); });
  };

  return html`
    <header>
      <h1>prompt-explore</h1>
      <span class="sub">job overview</span>
      <span class="auto">
        <label class="meta"><input type="checkbox" checked=${auto} onClick=${() => setAuto(!auto)} /> auto-refresh</label>
        <button class="toggle" onClick=${expandAll}>expand all logs</button>
      </span>
    </header>
    <div id="jobs">
      ${jobs === null ? html`<div class="empty">loading…</div>`
       : jobs.length === 0 ? html`<div class="empty">No jobs. Start one via <span class="mono">POST /api/investigations</span>.</div>`
       : jobs.map(j => html`<${JobCard} key=${j.id} j=${j} />`)}
    </div>`;
}

render(html`<${App} />`, document.getElementById('root'));
</script>
</body>
</html>
