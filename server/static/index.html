<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Service description: the OpenAPI spec. RFC 8631 rel="service-desc",
     also surfaced via a Link header on every response. -->
<link rel="service-desc" href="/openapi.json" title="OpenAPI spec">
<link rel="service-doc" href="/" title="Web UI">
<title>prompt-explore · jobs</title>
<style>
  :root {
    color-scheme: light;
    /* Solarized: role/difference hues have matched perceptual lightness;
       red/green/yellow are reserved for outcome labels. */
    --bg: #fdf6e3; --panel: #eee8d5; --panel-2: #fdf6e3; --border: #93a1a1;
    --text: #586e75; --text-dim: #657b83; --accent: #268bd2; --accent-2: #2176b5;
    --accent-text: #268bd2; --accent-soft: rgba(38,139,210,0.10); --accent-border: rgba(38,139,210,0.38);
    --put: #268bd2; --put-soft: rgba(38,139,210,0.10); --put-border: rgba(38,139,210,0.38);
    --sim: #6c71c4; --sim-soft: rgba(108,113,196,0.10); --sim-border: rgba(108,113,196,0.38);
    --workspace: #2aa198; --workspace-soft: rgba(42,161,152,0.10); --workspace-border: rgba(42,161,152,0.38);
    --red: #dc322f; --red-soft: rgba(220,50,47,0.10); --red-border: rgba(220,50,47,0.38);
    --green: #859900; --green-soft: rgba(133,153,0,0.10); --green-border: rgba(133,153,0,0.38);
    --amber: #b58900; --amber-soft: rgba(181,137,0,0.10); --amber-border: rgba(181,137,0,0.38);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #002b36; --panel: #073642; --panel-2: #002b36; --border: #586e75;
    --text: #93a1a1; --text-dim: #839496; --accent: #268bd2; --accent-2: #2f9ee9;
    --accent-text: #268bd2; --accent-soft: rgba(38,139,210,0.14); --accent-border: rgba(38,139,210,0.45);
    --put: #268bd2; --put-soft: rgba(38,139,210,0.14); --put-border: rgba(38,139,210,0.45);
    --sim: #6c71c4; --sim-soft: rgba(108,113,196,0.14); --sim-border: rgba(108,113,196,0.45);
    --workspace: #2aa198; --workspace-soft: rgba(42,161,152,0.14); --workspace-border: rgba(42,161,152,0.45);
    --red: #dc322f; --red-soft: rgba(220,50,47,0.14); --red-border: rgba(220,50,47,0.45);
    --green: #859900; --green-soft: rgba(133,153,0,0.14); --green-border: rgba(133,153,0,0.45);
    --amber: #b58900; --amber-soft: rgba(181,137,0,0.14); --amber-border: rgba(181,137,0,0.45);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.55; }
  .wrap { max-width: 940px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  header { display: flex; align-items: baseline; gap: 0.7rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
  header h1 { font-size: 1.15rem; margin: 0; }
  header .sub { color: var(--text-dim); font-size: 0.85rem; }
  header .auto { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }
  .meta { color: var(--text-dim); font-size: 0.85rem; }
  .card { background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 1rem 1.1rem; margin: 0.7rem 0; }
  .card.enter { animation: card-in 0.24s ease-out; }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  .card.leaving { opacity: 0; transform: scale(0.97); transition: opacity 0.22s ease-in, transform 0.22s ease-in, margin 0.22s ease-in, padding 0.22s ease-in, border 0.22s ease-in; }
  .card.leaving > * { visibility: hidden; }
  .card h2 { font-size: 0.92rem; margin: 0; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .mono { font-family: var(--mono); overflow-wrap: anywhere; }
  .badge { display: inline-block; font-size: 0.74rem; font-weight: 700;
    padding: 0.16rem 0.55rem; border-radius: 999px; letter-spacing: 0.02em; }
  .badge.running { background: var(--accent-soft); color: var(--accent-text); border: 1px solid var(--accent-border); }
  .badge.phase { background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--border); font-weight: 500; }
  .badge.done { background: var(--green-soft); color: var(--green); border: 1px solid var(--green-border); }
  .badge.job-done { background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--border); }
  .badge.failed { background: var(--red-soft); color: var(--red); border: 1px solid var(--red-border); }
  .badge.completed { background: var(--green-soft); color: var(--green); border: 1px solid var(--green-border); }
  .badge.partial { background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber-border); }
  .badge.error { background: var(--red-soft); color: var(--red); border: 1px solid var(--red-border); }
  .spinner { width: 13px; height: 13px; border-radius: 50%; display: inline-block;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { color: var(--text-dim); text-align: center; padding: 3rem 0; }
  details { margin-top: 0.4rem; }
  summary { cursor: pointer; color: var(--text-dim); font-size: 0.84rem; user-select: none; }
  summary:hover { color: var(--text); }
  .scen { border-left: 2px solid var(--border); padding-left: 0.8rem; margin: 0.6rem 0; }
  .scen-head { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .scen-id { font-family: var(--mono); font-size: 0.82rem; }
  .step { font-family: var(--mono); font-size: 0.76rem; color: var(--text-dim);
    margin: 0.25rem 0; padding: 0.3rem 0.45rem; background: var(--panel-2);
    border-radius: 5px; border-left: 2px solid var(--border); white-space: pre-wrap; word-break: break-word; max-height: 10em; overflow: auto; }
  .chat { display: flex; flex-direction: column; gap: 0.55rem; margin-top: 0.4rem; }
  /* One bordered element is one PUT model completion. Tool exchanges nested
     inside it were requested together; the border makes that API boundary
     visible instead of presenting sibling calls as separate agent turns. */
  .turn { border: 1px solid var(--put-border); border-radius: 9px; padding: 0.5rem;
    background: var(--panel-2); display: flex; flex-direction: column; gap: 0.38rem; }
  .turn-head { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
  .exchange { border-top: 1px solid var(--border); padding-top: 0.42rem;
    display: flex; flex-direction: column; gap: 0.3rem; }
  .exchange-head { font-family: var(--mono); font-size: 0.68rem; color: var(--text-dim); }
  .bubble { max-width: 82%; padding: 0.4rem 0.6rem; border-radius: 9px; font-size: 0.8rem; }
  .bubble.put { align-self: flex-start; background: var(--put-soft); border: 1px solid var(--put-border); }
  .bubble.sim { align-self: flex-end; background: var(--sim-soft); border: 1px solid var(--sim-border); }
  .bubble .role { font-size: 0.66rem; color: var(--text-dim); margin-bottom: 0.18rem; letter-spacing: 0.04em; }
  .bubble .body { white-space: pre-wrap; word-break: break-word; }
  .bubble .body.tool { font-family: var(--mono); font-size: 0.76rem; }
  /* Lua is evidence from the simulator, not rendered HTML. Keep source
     bounded until opened, scrollable, and copyable without losing its shape. */
  .lua-program { margin: 0.15rem 0; align-self: flex-end; max-width: 100%; }
  .lua-program > summary { color: var(--sim); }
  .lua-current { margin: 0.45rem 0 0; }
  .lua-revision { margin: 0.35rem 0 0.35rem 0.5rem; }
  .lua-revision-meta, .lua-provenance { font-size: 0.75rem; color: var(--text-dim); }
  .lua-diagnostic { margin: 0.22rem 0; padding-left: 0.45rem; border-left: 2px solid var(--sim-border); color: var(--text-dim); font-size: 0.78rem; }
  .source-actions { display: flex; justify-content: flex-end; margin: 0.2rem 0; }
  .source-code { margin: 0; padding: 0.5rem; max-height: 24em; overflow: auto; white-space: pre;
    tab-size: 2; font: 0.76rem/1.45 var(--mono); background: var(--panel-2); border: 1px solid var(--sim-border); border-radius: 6px; }
  .lua-provenance { display: flex; align-items: baseline; gap: 0.35rem; flex-wrap: wrap; margin: 0.05rem 0; }
  /* Thinking (visible reasoning) renders italic + dimmed so it reads as
     the model's inner voice, distinct from spoken output. */
  .bubble .body.think { font-style: italic; color: var(--text-dim); }
  .note { color: var(--amber); font-size: 0.82rem; }
  button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.3rem 0.7rem; cursor: pointer; font-size: 0.8rem; }
  button:hover { border-color: var(--accent); }
  .toggle { font-size: 0.78rem; }
  /* Solarized role hues distinguish sources without implying preference. */
  .usage-line { margin-top: 0.15rem; }
  .utag { display: inline-block; font-size: 0.66rem; font-weight: 700; padding: 0.06rem 0.4rem;
    border-radius: 4px; letter-spacing: 0.04em; margin-right: 0.35rem; vertical-align: 1px; font-family: var(--mono); }
  .utag.put { background: var(--put-soft); color: var(--put); border: 1px solid var(--put-border); }
  .utag.sim { background: var(--sim-soft); color: var(--sim); border: 1px solid var(--sim-border); }
  .utag.ws { background: var(--workspace-soft); color: var(--workspace); border: 1px solid var(--workspace-border); }
  .wsops { margin: 0.15rem 0 0.15rem 1.4rem; border-left: 2px solid var(--workspace-border); padding-left: 0.5rem; }
  .wsops.rolled-back { border-left-style: dashed; }
  .wsop { margin: 0.2rem 0; }
  /* Grades editor + frontier panel */
  input[type=text], input[type=number], select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.22rem 0.5rem; font-size: 0.8rem; font-family: var(--mono); }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .grow { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .grade-row { display: flex; gap: 0.4rem; align-items: center; margin: 0.22rem 0; }
  .grade-row .name { font-family: var(--mono); font-size: 0.78rem; color: var(--text); min-width: 11em; }
  .grade-row input { width: 7em; }
  .tag-row { display: grid; grid-template-columns: minmax(9em, 1fr) minmax(12em, 2fr) auto; gap: 0.4rem; align-items: center; margin: 0.22rem 0; }
  .tag-row input { min-width: 0; width: 100%; }
  .system-tag { font-family: var(--mono); font-size: 0.76rem; overflow-wrap: anywhere; }
  .display-name { color: var(--text); font-size: 1rem; font-weight: 700; overflow-wrap: anywhere; }
  .group-counts { display: flex; gap: 0.3rem; flex-wrap: wrap; margin: 0.25rem 0; }
  .group-count { font: 0.7rem var(--mono); padding: 0.08rem 0.35rem; border: 1px solid var(--border); border-radius: 4px; }
  .pending { color: var(--amber); }
  .unavailable { color: var(--red); }
  .del { color: var(--text-dim); cursor: pointer; border: none; background: none; padding: 0 0.2rem; font-size: 0.9rem; }
  .del:hover { color: var(--accent); }
  .axis-grid { display: grid; grid-template-columns: 1fr auto auto auto; gap: 0.4rem 0.6rem; align-items: center; }
  .frontier-err { border-left: 2px solid var(--red); padding-left: 0.6rem; margin: 0.4rem 0; }
  .frontier-err .reason { font-family: var(--mono); font-size: 0.74rem; color: var(--red); }
  .ptable { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 0.78rem; margin-top: 0.5rem; }
  .ptable th, .ptable td { text-align: left; padding: 0.25rem 0.5rem; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; word-break: break-word; }
  .ptable .group-label { min-width: 14em; }
  .ptable .dom { color: var(--text-dim); }
  .ptable .nd { color: var(--green); font-weight: 700; }
  .frontier-svg {
    /* Inherited by the inline SVG; no server request needed on theme changes.
       Keep point hues stable while adapting surfaces, text, grid and outlines. */
    --frontier-page: var(--panel); --frontier-panel: var(--panel-2);
    --frontier-label: var(--text); --frontier-tick: var(--text-dim);
    --frontier-dim-label: var(--text-dim); --frontier-grid: var(--border);
    margin-top: 0.6rem; border: 1px solid var(--border); border-radius: 8px; overflow: auto;
  }
  .frontier-svg svg { display: block; }
  /* Long failure texts (e.g. full provider error bodies) are clipped to one
     line-length; the "…" / "⌃" marker toggles the rest. */
  .clip-toggle { color: var(--accent); cursor: pointer; user-select: none; font-weight: 700; padding: 0 0.1rem; }
  .clip-toggle:hover { text-decoration: underline; }
  @media (max-width: 600px) {
    .wrap { padding-left: 0.7rem; padding-right: 0.7rem; }
    .axis-grid { grid-template-columns: 1fr; }
    .axis-grid > * { max-width: 100%; }
    .tag-row { grid-template-columns: minmax(0, 1fr) auto; }
    .tag-row > :nth-child(2) { grid-column: 1; }
    header .auto { margin-left: 0; }
  }
</style>
<script>
  // Light is the product default; remember an explicit dark-mode choice.
  document.documentElement.dataset.theme = localStorage.getItem('pe_theme') || 'light';
</script>

<body>
<div class="wrap"><div id="root"></div></div>

<script type="importmap">
{ "imports": {
  "preact": "/vendor/preact.mjs",
  "preact/hooks": "/vendor/hooks.mjs",
  "htm": "/vendor/htm.mjs"
} }
</script>
<script type="module">
import { h, render } from 'preact';
import { useState, useEffect, useRef } from 'preact/hooks';
import htm from 'htm';
const html = htm.bind(h);

const API = id => `/api/investigations${id ? '/'+id : ''}`;
const TOKEN_KEY = 'pe_api_token';
const THEME_KEY = 'pe_theme';
const authHeaders = token => token ? {'Authorization': 'Bearer '+token} : {};
// Format one role's UsageTotals. `tool_calls` is only the simulated PUT
// Estimated USD cost, only present for priced (e.g. OpenRouter) models.
// Scale precision to magnitude so sub-cent costs stay meaningful.
const fmtUsd = c => {
  if (c == null) return '';
  const s = c >= 1 ? c.toFixed(2) : c >= 0.0001 ? c.toPrecision(2) : c.toExponential(1);
  return ` · ~$${s}`;
};
// (the sim model has no tools), so it's hidden when zero to avoid noise.
const fmtUsage = u => u ? `${u.input_tokens.toLocaleString()} in${u.cache_read_tokens?` (${u.cache_read_tokens.toLocaleString()} cached)`:''} / ${u.output_tokens.toLocaleString()} out · ${u.llm_calls} llm${u.tool_calls?` · ${u.tool_calls} tool calls`:''}${fmtUsd(u.cost_usd)}` : '';
// One usage line: a colored role tag + the totals. Colors match the chat
// bubbles so `put`/`sim` are recognizable across the card.
const roleLine = (label, u, cls) => u ? html`<div class="meta usage-line"><span class=${`utag ${cls}`}>${label}</span>${fmtUsage(u)}</div>` : null;
const pretty = v => { try { return JSON.stringify(v, null, 2); } catch { return String(v); } };
const fmtAxisVal = v => v == null ? '—' : Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : +v.toFixed(3);
const relTime = ms => { const s=(Date.now()-ms)/1000; if(s<60) return `${Math.floor(s)}s ago`; if(s<3600) return `${Math.floor(s/60)}m ago`; return `${Math.floor(s/3600)}h ago`; };
const phaseLabel = p => ({scenarios:'simulating scenarios'})[p] || p;
const scenarioPhaseLabel = p => ({
  resolving_inputs: 'resolving input variables',
  preparing_tools: 'preparing tool simulation',
  put_loop: 'running PUT tool loop',
})[p] || p;

// Failure texts (e.g. "simulator call failed: …" plus the whole provider
// body) can run several screens long. Clip to the first `limit` chars and
// make the marker itself the toggle: click "…" to expand, "⌃" to collapse.
function ClipText({ text, limit = 150 }) {
  const [open, setOpen] = useState(false);
  const s = text == null ? '' : String(text);
  if (s.length <= limit) return html`<span>${s}</span>`;
  return html`<span>${open ? s : s.slice(0, limit)}<span class="clip-toggle" onClick=${() => setOpen(!open)} title=${open ? 'collapse' : 'expand full error'}>${open ? ' ⌃' : '…'}</span></span>`;
}

function ScenBadge({ s }) {
  const st = s.state || {}, kind = st.kind || 'running';
  if (kind === 'running') return html`<span class="badge running"><span class="spinner"></span> running</span>`;
  if (kind === 'done') return html`<span class="badge done">done</span>`;
  if (kind === 'failed') return html`<span class="badge error">failed: ${st.stage}</span>`;
  return null;
}

function Bubble({ side, role, body, tool, think }) {
  return html`<div class=${`bubble ${side}`}><div class="role">${role}</div><div class=${`body${tool ? ' tool':''}${think ? ' think':''}`}>${body}</div></div>`;
}

// A thinking bubble: collapsible when long (reasoning can run screens),
// italic always. Same chat side as its owner's other bubbles.
function Thinking({ side, role, text }) {
  const [open, setOpen] = useState(false);
  const LIMIT = 300;
  const s = String(text);
  const long = s.length > LIMIT;
  const shown = open || !long ? s : s.slice(0, LIMIT);
  return html`<div class=${`bubble ${side}`}>
    <div class="role">${role} · thinking${long ? html` <span class="clip-toggle" style="cursor:pointer" onClick=${() => setOpen(!open)} title=${open ? 'collapse' : 'expand full thinking'}>${open ? '⌃' : '…'}</span>` : null}</div>
    <div class="body think">${shown}</div>
  </div>`;
}

function LuaExecutionProvenance({ execution }) {
  const outcome = execution.outcome || 'unknown';
  const detailLabel = outcome === 'fallback' ? 'fallback reason'
    : outcome === 'error' ? 'Lua error' : 'detail';
  return html`<div class="lua-provenance">
    <span class="utag sim">Lua revision ${execution.program_revision}</span>
    <span>${outcome}</span>
    ${execution.detail ? html`<span>· ${detailLabel}: ${execution.detail}</span>` : null}
  </div>`;
}

function ExchangeView({ exchange, index, total }) {
  const a = exchange.call && exchange.call.args;
  const args = typeof a === 'string' ? a : JSON.stringify(a);
  const response = typeof exchange.response === 'string'
    ? exchange.response
    : JSON.stringify(exchange.response, null, 2);
  const lua = exchange.lua_execution;
  // A Lua runtime error is not a PUT tool error: the returned response below
  // is the LLM fallback, while discarded operations are shown separately.
  const simRole = lua ? (lua.outcome === 'computed' ? 'SIM · Lua' : 'SIM · LLM') : 'SIM';
  return html`<div class="exchange">
    <div class="exchange-head">tool exchange ${index + 1}${total > 1 ? ` of ${total}` : ''}</div>
    <${Bubble} side="put" role="PUT · tool" tool=${true} body=${`🔧 ${exchange.call.name}(${args})`} />
    ${lua ? html`<${LuaExecutionProvenance} execution=${lua} />` : null}
    ${exchange.workspace_ops && exchange.workspace_ops.length
      ? html`<${WsOps} ops=${exchange.workspace_ops} />`
      : null}
    ${lua && lua.discarded_workspace_ops && lua.discarded_workspace_ops.length
      ? html`<${WsOps} ops=${lua.discarded_workspace_ops} rolledBack=${true}
          label="Lua workspace operations (not real world mutations)" />`
      : null}
    ${exchange.sim_thinking && exchange.sim_thinking.trim()
      ? html`<${Thinking} side="sim" role="SIM" text=${exchange.sim_thinking} />`
      : null}
    <${Bubble} side="sim" role=${simRole} body=${response} />
  </div>`;
}

function TurnView({ turn, index }) {
  const exchanges = turn.tool_exchanges || [];
  const kind = exchanges.length
    ? `${exchanges.length} tool call${exchanges.length === 1 ? '' : 's'}${exchanges.length > 1 ? ' · same completion' : ''}`
    : 'text completion';
  return html`<div class="turn">
    <div class="turn-head"><span class="utag put">PUT turn ${index + 1}</span><span class="meta">${kind}</span></div>
    ${turn.thinking && turn.thinking.trim()
      ? html`<${Thinking} side="put" role="PUT" text=${turn.thinking} />`
      : null}
    ${turn.model_output && turn.model_output.trim()
      ? html`<${Bubble} side="put" role="PUT" body=${turn.model_output} />`
      : null}
    ${exchanges.map((exchange, i) => html`<${ExchangeView} key=${i} exchange=${exchange} index=${i} total=${exchanges.length} />`)}
  </div>`;
}

function copySource(source) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(source);
  // Clipboard access may be unavailable on an insecure origin. This is only
  // a compatibility fallback; source itself is always rendered as text.
  const area = document.createElement('textarea');
  area.value = source;
  area.setAttribute('readonly', '');
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  const copied = document.execCommand('copy');
  area.remove();
  return copied ? Promise.resolve() : Promise.reject(new Error('copy unavailable'));
}

function SourceCode({ source }) {
  const [copied, setCopied] = useState('');
  const text = source == null ? '' : String(source);
  const copy = async () => {
    try { await copySource(text); setCopied('copied'); }
    catch { setCopied('copy unavailable'); }
  };
  return html`<div>
    <div class="source-actions"><button class="toggle" onClick=${copy}>copy source</button>${copied ? html`<span class="meta" style="margin-left:0.35rem">${copied}</span>` : null}</div>
    <pre class="source-code" tabindex="0"><code>${text}</code></pre>
  </div>`;
}

function LuaRevision({ revision, index, current }) {
  const diagnostic = revision.error == null ? '' : String(revision.error);
  const content = html`<div class=${current ? 'lua-current' : 'lua-revision'}>
    <div class="lua-revision-meta"><span class="mono">revision ${index}</span>${current ? ' · current' : ''}</div>
    ${diagnostic ? html`<div class="lua-diagnostic">not executable: ${diagnostic}</div>` : null}
    <${SourceCode} source=${revision.source} />
  </div>`;
  return current ? content : html`<details class="lua-revision"><summary><span class="mono">revision ${index}</span>${diagnostic ? ' · not executable' : ''}</summary>${content}</details>`;
}

function SetupEvidence({ program }) {
  const ops = program.setup_workspace_ops || [];
  const thinking = program.setup_thinking;
  if (!ops.length && !(thinking && thinking.trim())) return null;
  return html`<details style="margin-top:0.45rem">
    <summary>setup simulator evidence${ops.length ? ` · ${ops.length} workspace op${ops.length===1?'':'s'}` : ''}</summary>
    ${ops.length ? html`<${WsOps} ops=${ops} label="setup simulator workspace" />` : null}
    ${thinking && thinking.trim() ? html`<${Thinking} side="sim" role="SIM · setup" text=${thinking} />` : null}
  </details>`;
}

function SimulationProgram({ program }) {
  if (!program) return null;
  const revisions = Array.isArray(program.revisions) ? program.revisions : [];
  const current = revisions.length - 1;
  return html`<details class="lua-program">
    <summary>SIM · Lua · <span class="mono">${program.path || '(unnamed program)'}</span>${current >= 0 ? ` · current revision ${current}` : ' · no revisions recorded'}</summary>
    ${current >= 0 ? html`<${LuaRevision} revision=${revisions[current]} index=${current} current=${true} />` : null}
    ${current > 0 ? html`<details style="margin-top:0.5rem"><summary>earlier revisions · ${current}</summary>
      ${revisions.slice(0, current).map((revision, index) => html`<${LuaRevision} key=${index} revision=${revision} index=${index} current=${false} />`)}
    </details>` : null}
    <${SetupEvidence} program=${program} />
  </details>`;
}

function Chat({ s }) {
  const out = [];
  // The simulator's setup artifact sits beside resolved inputs, before the
  // protagonist and even when setup fails before the first PUT turn.
  if (s.simulation_program) out.push(html`<${SimulationProgram} key="lua" program=${s.simulation_program} />`);
  // Resolved input bindings (sim agent's output) — first, SIM side.
  const ri = s.resolved_inputs;
  if (ri && Object.keys(ri).length) {
    const rows = Object.entries(ri).map(([k, v], i) => {
      // Strings render as-is; only actual objects/arrays pretty-print,
      // collapsible so a deep value doesn't blow out the pane.
      const isObj = v !== null && typeof v === 'object';
      const shown = isObj ? JSON.stringify(v, null, 2) : String(v);
      const body = (!isObj || shown.length <= 80)
        ? html`<span>${shown}</span>`
        : html`<details><summary class="mono" style="cursor:pointer;color:var(--text-dim)">${shown.split('\n')[0].slice(0,70)}…</summary><pre class="step" style="max-height:12em;overflow:auto;margin:0.3rem 0">${shown}</pre></details>`;
      return html`<div key=${'ri'+i} style="display:flex;gap:0.4rem;padding:0.15rem 0;border-bottom:1px solid var(--border)"><span class="mono" style="color:var(--text-dim);flex-shrink:0">${k} →</span><span style="word-break:break-word">${body}</span></div>`;
    });
    out.push(html`<div class="bubble sim" key="ri"><div class="role">SIM</div><div class="body">${rows}</div></div>`);
  }
  if (s.user_message && s.user_message.trim()) out.push(html`<${Bubble} key="u" side="sim" role="USER" body=${s.user_message} />`);
  (s.turns || []).forEach((turn, i) => {
    out.push(html`<${TurnView} key=${'turn'+i} turn=${turn} index=${i} />`);
  });
  return html`<div class="chat">${out.length ? out : html`<span class="meta">(no messages yet)</span>`}</div>`;
}

function WsOps({ ops, label = 'simulator workspace', rolledBack = false }) {
  // The simulator's workspace lookups while rendering this step — so a
  // reader can see whether the answer was GROUNDED in the uploaded files
  // (real reads/greps) or INVENTED. Collapsible; each op shows tool(args)
  // and the workspace's JSON result. Rolled-back Lua operations are not
  // presented as committed world changes.
  const heading = `${rolledBack ? '↩ ROLLED BACK · ' : '🔍 '}${label} · ${ops.length} op${ops.length===1?'':'s'}: ${ops.map(o=>o.tool).join(', ')}`;
  return html`<details class=${`wsops${rolledBack ? ' rolled-back' : ''}`}><summary class="meta" style="cursor:pointer">${heading}</summary><div>${ops.map((o,i)=>{
    const a = (o.args !== null && typeof o.args === 'object') ? JSON.stringify(o.args) : String(o.args);
    const r = (o.result !== null && typeof o.result === 'object') ? JSON.stringify(o.result, null, 2) : String(o.result);
    return html`<div class="wsop" key=${i}><span class="mono meta">${o.tool}(${a})</span><pre class="step" style="max-height:9em;overflow:auto;margin:0.2rem 0">${r}</pre></div>`;
  })}</div></details>`;
}

// ---------------------------------------------------------------------
// Grades (caller judgment, recorded via PATCH) + Pareto frontier
// ---------------------------------------------------------------------
// Reserved measured axes: harness-computed, direction baked in. The
// name → direction pairs mirror core::frontier::RESERVED_AXES.
const RESERVED_AXES = [
  ['put_input_tokens','lower'], ['put_output_tokens','lower'], ['put_cache_read_tokens','higher'],
  ['put_cost_usd','lower'], ['sim_input_tokens','lower'], ['sim_output_tokens','lower'],
  ['sim_cache_read_tokens','higher'], ['sim_cost_usd','lower'],
  ['steps_per_trace_avg','lower'], ['steps_per_trace_min','lower'],
  ['steps_per_trace_max','lower'], ['steps_per_trace_stdev','lower'],
];
const reservedDir = n => (RESERVED_AXES.find(([rn]) => rn === n) || [null, null])[1];
const SYSTEM_TAG_KEYS = new Set(['put_model', 'sim_model', 'put_thinking', 'sim_thinking', 'prompt_hash', 'workspace_hash']);
const jobTags = j => (j && j.tags) || {};
const displayName = j => jobTags(j).label || (j.put && j.put.id) || (j.id || '').slice(0, 8);

// Preserve local drafts through live polling; save only keys changed against
// the editing baseline, retaining unrelated edits from concurrent callers.
function useMetadataDraft(source) {
  const asRows = map => Object.entries(map).map(([k, v]) => ({ k, v: String(v) }));
  const [rows, updateRows] = useState(() => asRows(source));
  const baseline = useRef(source);
  const dirty = useRef(false);
  const reset = map => { baseline.current = map; dirty.current = false; updateRows(asRows(map)); };
  useEffect(() => { if (!dirty.current) reset(source); }, [JSON.stringify(source)]);
  const setRows = value => { dirty.current = true; updateRows(value); };
  return { rows, setRows, baseline, reset };
}
function metadataPatch(baseline, desired) {
  const patch = {};
  Object.entries(desired).forEach(([key, value]) => { if (baseline[key] !== value) patch[key] = value; });
  Object.keys(baseline).forEach(key => { if (!Object.prototype.hasOwnProperty.call(desired, key)) patch[key] = null; });
  return patch;
}

// Editable caller grades, merged with the live server map.
function GradesPanel({ j, token, onPatched }) {
  const { rows, setRows, baseline, reset } = useMetadataDraft(j.grades || {});
  const [nk, setNk] = useState(''); const [nv, setNv] = useState('');
  const [msg, setMsg] = useState(null);
  const set = (i, f) => setRows(rows.map((r, x) => x === i ? { ...r, ...f } : r));
  const save = async () => {
    const grades = {};
    const seen = new Set();
    for (const r of rows.concat(nk ? [{ k: nk, v: nv }] : [])) {
      const key = r.k.trim();
      if (!key) continue;
      if (seen.has(key)) { setMsg({ err: `duplicate axis: ${key}` }); return; }
      seen.add(key);
      if (r.v === '' || r.v === null) { grades[key] = null; }
      else {
        const f = Number(r.v);
        if (!Number.isFinite(f)) { setMsg({ err: `${key}: not a number` }); return; }
        grades[key] = f;
      }
    }
    const patch = metadataPatch(baseline.current, grades);
    setMsg(null);
    try {
      const r = await fetch(API(j.id), { method: 'PATCH', headers: { ...authHeaders(token), 'content-type': 'application/json' }, body: JSON.stringify({ grades: patch }) });
      const body = await r.json().catch(() => ({}));
      if (r.ok) { reset(body.grades || {}); setNk(''); setNv(''); onPatched && onPatched(j.id, body); setMsg({ ok: 'saved' }); }
      else setMsg({ err: (body.problems || []).map(p => p.detail).join(' · ') || body.error || `HTTP ${r.status}` });
    } catch (e) { setMsg({ err: `request failed: ${e.message || e}` }); }
  };
  return html`
    <details style="margin-top:0.4rem">
      <summary class="meta">grades ${rows.length ? `· ${rows.length} axis${rows.length===1?'':'es'}` : ''} <span style="opacity:0.7">(caller judgment — PATCHed, then used by the frontier)</span></summary>
      <div style="margin:0.4rem 0 0.2rem">
        ${rows.map((r, i) => html`
          <div class="grade-row" key=${r.k}>
            <span class="name">${r.k}</span>
            <input type="text" value=${r.v} onInput=${e => set(i, { v: e.target.value })} />
            <button class="del" title="delete this axis" onClick=${() => setRows(rows.filter((_, x) => x !== i))}>✕</button>
          </div>`)}
        <div class="grade-row">
          <input type="text" placeholder="new_axis_name" value=${nk} onInput=${e => setNk(e.target.value)} style="min-width:11em" />
          <input type="text" placeholder="value" value=${nv} onInput=${e => setNv(e.target.value)} />
          <button class="del" title="add" onClick=${() => { if (nk) { setRows(rows.concat([{ k: nk, v: nv }])); setNk(''); setNv(''); } }}>＋</button>
        </div>
        <div class="grow" style="margin-top:0.35rem">
          <button onClick=${save}>save grades</button>
          ${msg?.ok ? html`<span class="meta" style="color:var(--green)">✓ ${msg.ok}</span>` : null}
          ${msg?.err ? html`<span class="note">${msg.err}</span>` : null}
        </div>
      </div>
    </details>`;
}

// Tags describe a variant and are also the grouping dimensions for the live
// frontier. System tags are provenance emitted by the server, never editable.
function TagsPanel({ j, token, onPatched }) {
  const editable = map => Object.fromEntries(Object.entries(map).filter(([k]) => !SYSTEM_TAG_KEYS.has(k)));
  const { rows, setRows, baseline, reset } = useMetadataDraft(editable(jobTags(j)));
  const [nk, setNk] = useState(''); const [nv, setNv] = useState('');
  const [msg, setMsg] = useState(null);
  const set = (i, f) => setRows(rows.map((r, x) => x === i ? { ...r, ...f } : r));
  const save = async () => {
    const tags = {};
    const desired = rows.concat(nk ? [{ k: nk, v: nv }] : []);
    const seen = new Set();
    for (const r of desired) {
      const key = r.k.trim();
      if (!key) continue;
      if (SYSTEM_TAG_KEYS.has(key)) { setMsg({ err: `${key} is server-generated and cannot be changed` }); return; }
      if (seen.has(key)) { setMsg({ err: `duplicate tag key: ${key}` }); return; }
      seen.add(key);
      // Empty is a valid, distinct tag value. Only removing this row emits
      // null for an old key below; do not turn an intentional empty string
      // into a missing/null grouping value.
      tags[key] = r.v;
    }
    const patch = metadataPatch(baseline.current, tags);
    setMsg(null);
    try {
      const r = await fetch(API(j.id), { method: 'PATCH', headers: { ...authHeaders(token), 'content-type': 'application/json' }, body: JSON.stringify({ tags: patch }) });
      const body = await r.json().catch(() => ({}));
      if (r.ok) { reset(editable(body.tags || {})); onPatched && onPatched(j.id, body); setMsg({ ok: 'saved' }); setNk(''); setNv(''); }
      else setMsg({ err: (body.problems || []).map(p => p.detail).join(' · ') || body.error || `HTTP ${r.status}` });
    } catch (e) { setMsg({ err: `request failed: ${e.message || e}` }); }
  };
  const system = Object.entries(jobTags(j)).filter(([k]) => SYSTEM_TAG_KEYS.has(k));
  return html`<details style="margin-top:0.4rem">
    <summary class="meta">tags <span style="opacity:0.7">(group variants and set this card's label)</span></summary>
    <div style="margin:0.4rem 0 0.2rem">
      ${system.length ? html`<div class="meta" style="margin-bottom:0.25rem">system provenance — read-only</div>
        ${system.map(([k, v]) => html`<div class="tag-row" key=${k}><span class="system-tag">${k}</span><span class="system-tag meta">${v}</span><span class="meta">🔒</span></div>`)}` : html`<div class="meta">No system tags returned yet.</div>`}
      <div class="meta" style="margin:0.45rem 0 0.2rem">custom tags</div>
      ${rows.map((r, i) => html`<div class="tag-row" key=${i}>
        <input type="text" value=${r.k} placeholder="tag name" onInput=${e => set(i, { k: e.target.value })} />
        <input type="text" value=${r.v} placeholder="value" onInput=${e => set(i, { v: e.target.value })} />
        <button class="del" title="delete tag" onClick=${() => setRows(rows.filter((_, x) => x !== i))}>✕</button>
      </div>`) }
      <div class="tag-row"><input type="text" placeholder="new tag name" value=${nk} onInput=${e => setNk(e.target.value)} /><input type="text" placeholder="value" value=${nv} onInput=${e => setNv(e.target.value)} /><button class="del" title="add tag" onClick=${() => { if (nk.trim()) { setRows(rows.concat([{ k: nk, v: nv }])); setNk(''); setNv(''); } }}>＋</button></div>
      <div class="grow" style="margin-top:0.35rem"><button onClick=${save}>save tags</button>${msg?.ok ? html`<span class="meta" style="color:var(--green)">✓ ${msg.ok}</span>` : null}${msg?.err ? html`<span class="note">${msg.err}</span>` : null}</div>
    </div>
  </details>`;
}

// The frontier panel compares every job, grouped by tag values; the server
// owns cohort construction and dominance so no client-side candidate filter
// can silently change the comparison.
function FrontierPanel({ jobs, token }) {
  const allJobs = jobs || [];
  const [groupBy, setGroupBy] = useState(['put_model', 'put_thinking', 'prompt_hash']);
  const [axes, setAxes] = useState(['put_output_tokens', '']); // '' = derive at render
  const [dirs, setDirs] = useState({});
  const [plot, setPlot] = useState(null);
  const [err, setErr] = useState(null);
  const knownTagKeys = [...new Set(allJobs.flatMap(j => Object.keys(jobTags(j))))].sort();
  const gradedNames = [...new Set(allJobs.flatMap(j => Object.keys(j.grades || {})))];
  const options = RESERVED_AXES.map(([n]) => n).concat(gradedNames.filter(n => !reservedDir(n)));
  const names = [];
  axes.forEach(a => {
    if (a) { names.push(a); return; }
    const used = new Set(names);
    names.push(gradedNames.find(g => !reservedDir(g) && !used.has(g))
      || options.find(o => !used.has(o)) || 'steps_per_trace_avg');
  });
  const dirOf = n => reservedDir(n) || dirs[n] || 'higher';
  const setDir = (n, d) => setDirs({ ...dirs, [n]: d });
  // This includes completed jobs too: a caller can PATCH grades/tags after a
  // run, and these are exactly the result fields used by measured axes. Keep
  // trace bodies out of the dependency key: a large evidence corpus should
  // not be repeatedly serialized just to refresh a small frontier request.
  const measuredSummary = j => {
    const result = j.result;
    if (!result) return null;
    return {
      usage: result.usage || null,
      steps_per_trace: (result.attempts || []).map(a => (a.turns || [])
        .reduce((steps, turn) => steps + Math.max((turn.tool_exchanges || []).length, 1), 0)),
    };
  };
  const jobsKey = JSON.stringify(allJobs.map(j => [j.id, j.status, j.tags, j.grades, measuredSummary(j)]));
  const groupKey = JSON.stringify(groupBy);
  const namesKey = JSON.stringify(names);
  const dirsKey = JSON.stringify(names.map(n => dirOf(n)));
  const seq = useRef(0);
  useEffect(() => {
    const controller = new AbortController();
    const mySeq = ++seq.current;
    if (!allJobs.length) { setPlot({ points: [], svg: null }); setErr(null); return () => controller.abort(); }
    const body = {
      group_by: groupBy.map(k => k.trim()).filter(Boolean),
      axes: names.map(n => ({ name: n, better: dirOf(n) })),
    };
    const headers = { ...authHeaders(token), 'content-type': 'application/json' };
    (async () => {
      try {
        const two = names.length === 2;
        const [jsonR, svgR] = await Promise.all([
          fetch('/api/frontier?format=json', { method: 'POST', headers, body: JSON.stringify(body), signal: controller.signal }),
          two ? fetch('/api/frontier?format=svg', { method: 'POST', headers, body: JSON.stringify(body), signal: controller.signal }) : Promise.resolve(null),
        ]);
        if (!jsonR.ok || (svgR && !svgR.ok)) {
          const b = await jsonR.json().catch(() => ({}));
          if (mySeq === seq.current && !controller.signal.aborted) {
            setPlot(null); setErr(b.problems || [{ reason: b.error || 'error', detail: `HTTP ${jsonR.status}` }]);
          }
          return;
        }
        const json = await jsonR.json();
        const svg = svgR ? await svgR.text() : null;
        if (mySeq === seq.current && !controller.signal.aborted) { setErr(null); setPlot({ points: json.points || [], svg }); }
      } catch (e) {
        if (e.name !== 'AbortError' && mySeq === seq.current && !controller.signal.aborted) setErr([{ reason: 'request failed', detail: String(e) }]);
      }
    })();
    return () => controller.abort();
  }, [jobsKey, groupKey, namesKey, dirsKey, token]);

  const axisRow = i => {
    const name = names[i];
    const rowOpts = options.filter(o => !names.some((n, x) => x !== i && n === o));
    return html`<div class="axis-grid" key=${i}>
      <span class="meta">${i === 0 ? 'x axis' : i === 1 ? 'y axis' : `axis ${i + 1}`}</span>
      <select value=${name} onChange=${e => setAxes(axes.map((a, x) => x === i ? e.target.value : a))}>
        ${rowOpts.map(o => html`<option value=${o} key=${o}>${o}${reservedDir(o) ? '' : ' (graded)'}</option>`)}
      </select>
      ${reservedDir(name)
        ? html`<span class="meta" title="reserved measured axis — direction is baked in">${reservedDir(name)} is better 🔒</span>`
        : html`<select value=${dirOf(name)} onChange=${e => setDir(name, e.target.value)}><option value="higher">higher is better</option><option value="lower">lower is better</option></select>`}
      <button class="del" title="remove this axis" disabled=${axes.length <= 1} onClick=${() => setAxes(axes.filter((_, x) => x !== i))}>✕</button>
    </div>`;
  };
  const counts = point => (point.excluded || []).reduce((out, e) => ({ ...out, [e.status]: (out[e.status] || 0) + 1 }), {});
  const groupTagText = point => groupBy.length
    ? groupBy.map(k => `${k}=${point.tags && point.tags[k] != null ? point.tags[k] : 'null'}`).join(' · ')
    : 'all investigations';
  const backlog = (plot && plot.points || []).flatMap(point => (point.excluded || []).map(e => ({ point, ...e })));

  return html`<div class="card">
    <h2>📈 Live grouped Pareto <span class="meta" style="font-weight:400">— every investigation is a candidate</span></h2>
    <div class="meta" style="margin:0.4rem 0">Matching tag values become one point. Every coordinate is a mean over the same completed, fully graded investigations. Preliminary points are faded with a dashed ring; groups with no usable members stay pending without coordinates. All excluded members remain in the backlog. Delete unwanted investigations to remove them from the comparison.</div>
    <div style="margin:0.45rem 0">
      <div class="meta">group by tags <span style="opacity:0.7">(empty = one group; missing values are grouped as null)</span></div>
      ${groupBy.map((key, i) => html`<div class="grow" key=${i} style="margin:0.2rem 0"><input type="text" list="frontier-tag-keys" value=${key} placeholder="tag name" onInput=${e => setGroupBy(groupBy.map((k, x) => x === i ? e.target.value : k))} /><button class="del" title="remove grouping tag" onClick=${() => setGroupBy(groupBy.filter((_, x) => x !== i))}>✕</button></div>`)}
      <datalist id="frontier-tag-keys">${knownTagKeys.map(k => html`<option value=${k} key=${k} />`)}</datalist>
      <button class="toggle" onClick=${() => setGroupBy(groupBy.concat(['']))}>+ grouping tag</button>
    </div>
    <div style="margin:0.45rem 0">${axes.map((_, i) => axisRow(i))}
      <button class="toggle" onClick=${() => setAxes(axes.concat(['']))} title="dominance supports N axes; SVG is two-axis only">+ axis</button>
    </div>
    <div class="meta" style="margin:0.45rem 0;opacity:0.75">${names.length === 2 ? 'SVG shows two axes; the table and dominance calculation support any number.' : `${names.length} axes — N-dimensional dominance; SVG is available at exactly two axes.`}</div>
    ${err ? html`<div class="frontier-err">${err.map((p, i) => html`<div key=${i}><span class="reason">${p.reason}</span><div class="meta">${p.detail}</div></div>`)}</div>` : null}
    ${plot && plot.svg ? html`<div class="frontier-svg" dangerouslySetInnerHTML=${{ __html: plot.svg }}></div>` : null}
    ${plot ? html`<table class="ptable"><thead><tr><th>group</th>${names.map(n => html`<th key=${n} class="mono">${n}</th>`)}<th>rank</th><th>counts</th></tr></thead>
      <tbody>${plot.points.map(p => { const c = counts(p); return html`<tr key=${p.id}>
        <td class="group-label"><b class="mono" title=${p.id}>${`g-${p.id.replace(/^group-/, '').slice(0, 8)}`}</b><div class="meta mono">${groupTagText(p)}</div></td>
        ${names.map(n => html`<td key=${n} class="mono">${p.values ? fmtAxisVal(p.values[n]) : 'pending — not plotted'}</td>`)}
        <td>${p.on_frontier === null ? html`<span class="pending">pending</span>` : p.on_frontier ? html`<span class="nd">frontier${p.preliminary ? ' · preliminary' : ''}</span>` : html`<span class="dom">dominated${p.preliminary ? ' · preliminary' : ''}</span>`}<div class="meta mono">${(p.dominated_by || []).join(', ') || '—'}</div></td>
        <td><div class="group-counts"><span class="group-count">included ${((p.included || []).length)}</span>${['running','awaiting_grades','failed','unavailable'].filter(s => c[s]).map(s => html`<span class=${`group-count ${s === 'running' || s === 'awaiting_grades' ? 'pending' : 'unavailable'}`} key=${s}>${s.replace('_',' ')} ${c[s] || 0}</span>`)}</div>
          <details><summary>members ${((p.investigations || []).length)}</summary><div class="mono meta">${(p.investigations || []).map(id => html`<div key=${id}><a href=${`#job-${id}`}>${id}</a></div>`)}</div></details></td>
      </tr>`; })}</tbody></table>` : null}
    ${backlog.length ? html`<details open style="margin-top:0.55rem"><summary class="pending">backlog — ${backlog.length} investigation${backlog.length === 1 ? '' : 's'} needs attention</summary>
      <div class="meta" style="margin:0.35rem 0">These exact members are not in the common complete cohort yet. Grade the linked job when grades are missing; running, failed, and unavailable jobs remain distinct evidence.</div>
      ${backlog.map(e => html`<div class="step" key=${`${e.point.id}-${e.investigation}`}><a href=${`#job-${e.investigation}`} class="mono">${e.investigation}</a> · <b class=${e.status === 'awaiting_grades' || e.status === 'running' ? 'pending' : 'unavailable'}>${e.status.replace('_', ' ')}</b>${e.missing_grades && e.missing_grades.length ? html` · missing grades: <span class="mono">${e.missing_grades.join(', ')}</span>` : null}${e.missing_axes && e.missing_axes.length ? html` · missing axes: <span class="mono">${e.missing_axes.join(', ')}</span>` : null}<div class="meta">group: ${e.point.label}</div></div>`) }
    </details>` : null}
  </div>`;
}

// Completed attempts are the durable trace view. Synthesize the same shape
// that Chat consumes rather than relying on frozen live progress, and carry
// the program explicitly: it is evidence just like resolved inputs.
function progressFromAttempt(attempt) {
  return {
    state: { kind: 'done' },
    turns: attempt.turns || [],
    user_message: attempt.scenario && attempt.scenario.user_message,
    resolved_inputs: attempt.resolved_inputs || {},
    simulation_program: attempt.simulation_program,
  };
}

function JobCard({ j, token, onDelete, onPatched, leaving }) {
  const tags = jobTags(j);
  const putModel = tags.put_model || j.put_model;
  const simModel = tags.sim_model || j.sim_model;
  const putThinking = tags.put_thinking || j.put_thinking_level;
  const simThinking = tags.sim_thinking || j.sim_thinking_level;
  const liveProgs = (j.progress && j.progress.scenarios) || [];
  const inputById = {}; (j.scenarios || []).forEach(s => { if (s.id != null) inputById[s.id] = s; });
  // A completed result has attempts by value, not scenario ids. Keep failed
  // live entries too: they have no AttemptView but can still contain setup
  // evidence from a failed preparation phase.
  const panels = j.status === 'done' && j.result
    ? (j.result.attempts || []).map((attempt, index) => ({
        key: `attempt-${index}`,
        prog: progressFromAttempt(attempt),
        input: attempt.scenario,
        label: `scenario ${index + 1}`,
      })).concat(liveProgs.map((prog, index) => ({ prog, index }))
        .filter(({ prog }) => (prog.state || {}).kind === 'failed')
        .map(({ prog, index }) => ({
          key: `failed-${index}`,
          prog,
          input: inputById[prog.scenario_id] || (j.scenarios || [])[index],
          label: `failed scenario ${index + 1}`,
        })))
    : liveProgs.map((prog, index) => ({
        key: prog.scenario_id || `scenario-${index}`,
        prog,
        input: inputById[prog.scenario_id] || (j.scenarios || [])[index],
        label: prog.scenario_id || `scenario ${index + 1}`,
      }));
  return html`
    <div id=${`job-${j.id}`} class=${`card${leaving ? ' leaving' : ''}`} key=${j.id}>
      <h2>
        <span class=${`badge ${j.status === 'done' ? 'job-done' : j.status}`}>${j.status}</span>
        ${j.status === 'running' && j.phase ? html`<span class="badge phase">${phaseLabel(j.phase)}</span>` : null}
        <span class="display-name" title="custom tag label, or prompt-under-test id when no label is set">${displayName(j)}</span>
        <span class="mono meta">${(j.id || '').slice(0,8)}</span>
        <span class="meta">${'· ' + relTime(j.started_at)}</span>
        <span style="margin-left:auto;display:flex;gap:0.35rem;align-items:center;flex-wrap:wrap;justify-content:flex-end">
          ${putModel ? html`<span class="utag put" title="system tag put_model">${putModel}</span>` : null}
          ${putThinking ? html`<span class="utag put" title="system tag put_thinking">think ${putThinking}</span>` : null}
          ${simModel ? html`<span class="utag sim" title="system tag sim_model">${simModel}</span>` : null}
          ${simThinking ? html`<span class="utag sim" title="system tag sim_thinking">think ${simThinking}</span>` : null}
          ${j.workspace_files ? html`<span class="utag ws" title="simulation workspace: an in-memory filesystem the SIMULATOR consults (read/write/list_dir/grep), seeded from the uploaded zip; per-trace. The agent under test never sees it.">ws · ${j.workspace_files} file${j.workspace_files===1?'':'s'}</span>` : null}
          <button class="del" title="delete this investigation (irreversible — removes the job, traces, grades, and tags from server memory)" onClick=${() => onDelete(j.id)}>✕</button>
        </span>
      </h2>
      <div class="meta" style="margin:0.4rem 0">${j.reason ? html`<span><b>reason:</b> ${j.reason}</span>` : html`<span class="meta" style="opacity:0.7">(no reason — observing behavior; the caller is the judge)</span>`}</div>
      <${PutPanel} put=${j.put} />
      <${TagsPanel} j=${j} token=${token} onPatched=${onPatched} />
      <${GradesPanel} j=${j} token=${token} onPatched=${onPatched} />
      <${ResultLine} j=${j} />
      <div class="scens" style="margin-top:0.5rem">
        ${panels.map(panel => html`<${ScenarioPanel} key=${panel.key} prog=${panel.prog} input=${panel.input} label=${panel.label} />`)}
      </div>
    </div>`;
}

function App() {
  const [jobs, setJobs] = useState(null); // null = loading
  const [auto, setAuto] = useState(true);
  const [token, setToken] = useState(() => localStorage.getItem(TOKEN_KEY) || '');
  const [draft, setDraft] = useState(() => localStorage.getItem(TOKEN_KEY) || '');
  const [authRequired, setAuthRequired] = useState(false);
  const [authError, setAuthError] = useState(false);
  const [theme, setTheme] = useState(() => localStorage.getItem(THEME_KEY) || 'light');
  const deletedIds = useRef(new Set());
  const revision = useRef(0);
  const deleteTimers = useRef(new Set());
  useEffect(() => () => { deleteTimers.current.forEach(clearTimeout); }, []);

  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    localStorage.setItem(THEME_KEY, theme);
  }, [theme]);

  useEffect(() => {
    if (!auto) return;
    const controller = new AbortController();
    let disposed = false, timer;
    const poll = async () => {
      const mine = revision.current;
      try {
        const r = await fetch(API(), { headers: authHeaders(token), signal: controller.signal });
        if (r.status === 401) {
          if (!disposed && mine === revision.current) { setAuthRequired(true); if (token) setAuthError(true); }
          return;
        }
        if (!r.ok) throw new Error(`job list: HTTP ${r.status}`);
        const list = await r.json();
        if (!Array.isArray(list) || disposed || mine !== revision.current) return;
        if (!list.length) { setJobs([]); setAuthRequired(false); setAuthError(false); return; }
        // Always retrieve full views, including completed ones: grades and tags
        // may have been PATCHed by another caller after a run finished.
        const views = await Promise.all(list.map(async s => {
          const view = await fetch(API(s.id), { headers: authHeaders(token), signal: controller.signal });
          // A delete can race the summary list. Treat that single vanished job
          // as absent rather than retaining a stale card until the next poll.
          if (view.status === 404) return null;
          if (!view.ok) throw new Error(`job ${s.id}: HTTP ${view.status}`);
          return view.json();
        }));
        if (!disposed && mine === revision.current) {
          setJobs(views.filter(j => j && !deletedIds.current.has(j.id)));
          setAuthRequired(false); setAuthError(false);
        }
      } catch (e) {
        if (e.name !== 'AbortError' && !disposed) console.error(e);
      } finally {
        // Serialize polls: slow trace downloads must not be perpetually
        // invalidated by the next interval or accumulate outstanding requests.
        if (!disposed) timer = setTimeout(poll, 2500);
      }
    };
    poll();
    return () => { disposed = true; controller.abort(); clearTimeout(timer); };
  }, [auto, token]);

  const saveToken = () => {
    const t = draft.trim();
    localStorage.setItem(TOKEN_KEY, t);
    setToken(t);
    setAuthError(false);
  };

  const clearToken = () => {
    localStorage.removeItem(TOKEN_KEY);
    setToken('');
    setDraft('');
    setAuthError(false);
  };

  const [leaving, setLeaving] = useState(null); // id mid-leave-animation
  const applyPatch = (id, patch) => {
    ++revision.current; // discard any GET snapshot started before this PATCH
    setJobs(js => (js || []).map(j => j.id === id ? {
      ...j,
      grades: patch.grades === undefined ? j.grades : patch.grades,
      tags: patch.tags === undefined ? j.tags : patch.tags,
    } : j));
  };
  const removeJob = async id => {
    let ok = false;
    try {
      const r = await fetch(API(id), { method: 'DELETE', headers: authHeaders(token) });
      if (!r.ok) {
        const b = await r.json().catch(() => ({}));
        alert(b.error || `delete failed: HTTP ${r.status}`);
        return;
      }
      ok = true;
    } catch (e) { console.error(e); alert('delete failed: network error'); return; }
    if (!ok) return;
    // A detail-list poll begun before DELETE may still resolve. Remember the
    // tombstone until a later list no longer contains it, so it cannot revive.
    deletedIds.current.add(id);
    ++revision.current;
    // Leave animation: collapse first, drop from state after. The 250ms
    // covers the 220ms CSS transition plus layout settle; the timeout is
    // cleared on unmount so a deleted card can't resurrect over a page
    // navigation.
    setLeaving(id);
    const timer = setTimeout(() => {
      deleteTimers.current.delete(timer);
      setJobs(js => (js || []).filter(x => x.id !== id));
      setLeaving(null);
    }, 250);
    deleteTimers.current.add(timer);
  };

  const expandAll = () => {
    const all = [...document.querySelectorAll('#root details')];
    const anyClosed = all.some(d => !d.hasAttribute('open'));
    all.forEach(d => { if (anyClosed) d.setAttribute('open', ''); else d.removeAttribute('open'); });
  };

  return html`
    <header>
      <h1>prompt-explore <span class="mono" style="font-size:0.72rem;color:var(--text-dim)">v__VERSION__</span></h1>
      <span class="sub">job overview</span>
      <span class="auto">
        <label class="meta"><input type="checkbox" checked=${auto} onClick=${() => setAuto(!auto)} /> auto-refresh</label>
        <button class="toggle" onClick=${expandAll}>expand all logs</button>
        <button class="toggle" onClick=${() => setTheme(theme === 'light' ? 'dark' : 'light')}
          title=${`switch to ${theme === 'light' ? 'dark' : 'light'} mode`}>${theme === 'light' ? 'dark mode' : 'light mode'}</button>
        ${token ? html`<button class="toggle" onClick=${clearToken} title="forget the stored API token">clear token</button>` : null}
      </span>
    </header>
    ${authRequired ? html`
      <div class="card" style="border-color:var(--accent)">
        <h2>🔒 API token required</h2>
        <div class="meta" style="margin:0.4rem 0">This server requires an <span class="mono">Authorization: Bearer</span> token (set via <span class="mono">PROMPT_EXPLORE_API_TOKEN</span>). Enter it to view and submit jobs. It is stored only in this browser's localStorage.</div>
        <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">
          <input type="password" value=${draft} onInput=${e => setDraft(e.target.value)} placeholder="API token" style="background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:0.3rem 0.6rem;font-family:var(--mono);flex:1;min-width:16em" />
          <button onClick=${saveToken}>save</button>
        </div>
        ${authError ? html`<div class="note" style="margin-top:0.4rem">That token was rejected — check it and try again.</div>` : null}
      </div>` : null}
    ${authRequired ? null : jobs === null ? null : html`<${FrontierPanel} jobs=${jobs} token=${token} />`}
    <div id="jobs">
      ${authRequired ? null
       : jobs === null ? html`<div class="empty">loading…</div>`
       : jobs.length === 0 ? html`<div class="empty">No jobs. Start one via <span class="mono">POST /api/investigations</span>.</div>`
       : jobs.map(j => html`<${JobCard} key=${j.id} j=${j} token=${token} onDelete=${removeJob} onPatched=${applyPatch} leaving=${leaving === j.id} />`)}
    </div>
    <footer class="meta" style="margin-top:2rem;text-align:center">
      API spec: <a class="mono" href="/openapi.json">/openapi.json</a> · models: <a class="mono" href="/api/models">/api/models</a>
    </footer>`;
}

render(html`<${App} />`, document.getElementById('root'));
</script>
</body>
</html>
