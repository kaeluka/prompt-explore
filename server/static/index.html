<title>prompt-explore · jobs</title>
<style>
  :root {
    color-scheme: light;
    /* Solarized: role/difference hues have matched perceptual lightness;
       red/green/yellow are reserved for outcome labels. */
    --bg: #f6f8f7; --panel: #ffffff; --panel-2: #f1f4f3; --border: #d7dfdd;
    --text: #203033; --text-dim: #68797c; --accent: #087b80; --accent-2: #07666a;
    --accent-text: #268bd2; --accent-soft: rgba(38,139,210,0.10); --accent-border: rgba(38,139,210,0.38);
    --put: #268bd2; --put-soft: rgba(38,139,210,0.10); --put-border: rgba(38,139,210,0.38);
    --sim: #6c71c4; --sim-soft: rgba(108,113,196,0.10); --sim-border: rgba(108,113,196,0.38);
    --workspace: #2aa198; --workspace-soft: rgba(42,161,152,0.10); --workspace-border: rgba(42,161,152,0.38);
    --red: #dc322f; --red-soft: rgba(220,50,47,0.10); --red-border: rgba(220,50,47,0.38);
    --green: #859900; --green-soft: rgba(133,153,0,0.10); --green-border: rgba(133,153,0,0.38);
    --amber: #b58900; --amber-soft: rgba(181,137,0,0.10); --amber-border: rgba(181,137,0,0.38);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #101718; --panel: #172123; --panel-2: #111a1c; --border: #334245;
    --text: #e4ecea; --text-dim: #93a4a6; --accent: #49aeb2; --accent-2: #6bc2c5;
    --accent-text: #268bd2; --accent-soft: rgba(38,139,210,0.14); --accent-border: rgba(38,139,210,0.45);
    --put: #268bd2; --put-soft: rgba(38,139,210,0.14); --put-border: rgba(38,139,210,0.45);
    --sim: #6c71c4; --sim-soft: rgba(108,113,196,0.14); --sim-border: rgba(108,113,196,0.45);
    --workspace: #2aa198; --workspace-soft: rgba(42,161,152,0.14); --workspace-border: rgba(42,161,152,0.45);
    --red: #dc322f; --red-soft: rgba(220,50,47,0.14); --red-border: rgba(220,50,47,0.45);
    --green: #859900; --green-soft: rgba(133,153,0,0.14); --green-border: rgba(133,153,0,0.45);
    --amber: #b58900; --amber-soft: rgba(181,137,0,0.14); --amber-border: rgba(181,137,0,0.45);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.45; }
  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  .wrap { max-width: 1460px; margin: 0 auto; padding: 0 1.5rem 4rem; }
  header { min-height: 58px; display: flex; align-items: center; gap: 0.8rem; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 1rem; margin: 0; letter-spacing: -0.015em; }
  header .sub { color: var(--text-dim); font-size: 0.78rem; }
  header .auto { margin-left: auto; display: flex; align-items: center; gap: 0.35rem; }
  .meta { color: var(--text-dim); font-size: 0.78rem; }
  .card { background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 1rem 1.1rem; margin: 0.7rem 0; }
  .card.enter { animation: card-in 0.24s ease-out; }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  .card.leaving { opacity: 0; transform: scale(0.97); transition: opacity 0.22s ease-in, transform 0.22s ease-in, margin 0.22s ease-in, padding 0.22s ease-in, border 0.22s ease-in; }
  .card.leaving > * { visibility: hidden; }
  .card h2 { font-size: 0.92rem; margin: 0; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .mono { font-family: var(--mono); overflow-wrap: anywhere; }
  .badge { display: inline-block; font-size: 0.74rem; font-weight: 700;
    padding: 0.16rem 0.55rem; border-radius: 999px; letter-spacing: 0.02em; }
  .badge.running { background: var(--accent-soft); color: var(--accent-text); border: 1px solid var(--accent-border); }
  .badge.phase { background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--border); font-weight: 500; }
  .badge.done { background: var(--green-soft); color: var(--green); border: 1px solid var(--green-border); }
  .badge.job-done { background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--border); }
  .badge.failed { background: var(--red-soft); color: var(--red); border: 1px solid var(--red-border); }
  .badge.completed { background: var(--green-soft); color: var(--green); border: 1px solid var(--green-border); }
  .badge.partial { background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber-border); }
  .badge.error { background: var(--red-soft); color: var(--red); border: 1px solid var(--red-border); }
  .spinner { width: 13px; height: 13px; border-radius: 50%; display: inline-block;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { color: var(--text-dim); text-align: center; padding: 3rem 0; }
  details { margin-top: 0.35rem; }
  summary { cursor: pointer; color: var(--text-dim); font-size: 0.82rem; user-select: none; }
  summary:hover { color: var(--text); }
  details[open] > summary { color: var(--text); }
  .scen { border-left: 2px solid var(--border); padding-left: 0.8rem; margin: 0.6rem 0; }
  .scen-head { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .scen-id { font-family: var(--mono); font-size: 0.82rem; }
  .step { font-family: var(--mono); font-size: 0.76rem; color: var(--text-dim);
    margin: 0.25rem 0; padding: 0.3rem 0.45rem; background: var(--panel-2);
    border-radius: 5px; border-left: 2px solid var(--border); white-space: pre-wrap; word-break: break-word; max-height: 10em; overflow: auto; }
  .chat { display: flex; flex-direction: column; gap: 0.55rem; margin-top: 0.4rem; }
  /* One bordered element is one PUT model completion. Tool exchanges nested
     inside it were requested together; the border makes that API boundary
     visible instead of presenting sibling calls as separate agent turns. */
  .turn { border: 1px solid var(--put-border); border-radius: 9px; padding: 0.5rem;
    background: var(--panel-2); display: flex; flex-direction: column; gap: 0.38rem; }
  .turn-head { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
  .exchange { border-top: 1px solid var(--border); padding-top: 0.42rem;
    display: flex; flex-direction: column; gap: 0.3rem; }
  .exchange-head { font-family: var(--mono); font-size: 0.68rem; color: var(--text-dim); }
  .bubble { max-width: 82%; padding: 0.4rem 0.6rem; border-radius: 9px; font-size: 0.8rem; }
  .bubble.put { align-self: flex-start; background: var(--put-soft); border: 1px solid var(--put-border); }
  .bubble.sim { align-self: flex-end; background: var(--sim-soft); border: 1px solid var(--sim-border); }
  .bubble .role { font-size: 0.66rem; color: var(--text-dim); margin-bottom: 0.18rem; letter-spacing: 0.04em; }
  .bubble .body { white-space: pre-wrap; word-break: break-word; }
  .bubble .body.tool { font-family: var(--mono); font-size: 0.76rem; }
  /* Lua is evidence from the simulator, not rendered HTML. Keep source
     bounded until opened, scrollable, and copyable without losing its shape. */
  .lua-program { margin: 0.15rem 0; align-self: flex-end; max-width: 100%; }
  .lua-program > summary { color: var(--sim); }
  .lua-current { margin: 0.45rem 0 0; }
  .lua-revision { margin: 0.35rem 0 0.35rem 0.5rem; }
  .lua-revision-meta, .lua-provenance { font-size: 0.75rem; color: var(--text-dim); }
  .lua-diagnostic { margin: 0.22rem 0; padding-left: 0.45rem; border-left: 2px solid var(--sim-border); color: var(--text-dim); font-size: 0.78rem; }
  .source-actions { display: flex; justify-content: flex-end; margin: 0.2rem 0; }
  .source-code { margin: 0; padding: 0.5rem; max-height: 24em; overflow: auto; white-space: pre;
    tab-size: 2; font: 0.76rem/1.45 var(--mono); background: var(--panel-2); border: 1px solid var(--sim-border); border-radius: 6px; }
  .lua-provenance { display: flex; align-items: baseline; gap: 0.35rem; flex-wrap: wrap; margin: 0.05rem 0; }
  /* Thinking (visible reasoning) renders italic + dimmed so it reads as
     the model's inner voice, distinct from spoken output. */
  .bubble .body.think { font-style: italic; color: var(--text-dim); }
  .note { color: var(--amber); font-size: 0.82rem; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 0.32rem 0.65rem; cursor: pointer; font-size: 0.78rem; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toggle { font-size: 0.75rem; }
  /* Solarized role hues distinguish sources without implying preference. */
  .usage-line { margin-top: 0.15rem; }
  .uchip { display: inline-block; font-size: 0.66rem; font-weight: 700; padding: 0.06rem 0.4rem;
    border-radius: 4px; letter-spacing: 0.04em; margin-right: 0.35rem; vertical-align: 1px; font-family: var(--mono); }
  .uchip.put { background: var(--put-soft); color: var(--put); border: 1px solid var(--put-border); }
  .uchip.sim { background: var(--sim-soft); color: var(--sim); border: 1px solid var(--sim-border); }
  .uchip.ws { background: var(--workspace-soft); color: var(--workspace); border: 1px solid var(--workspace-border); }
  .wsops { margin: 0.15rem 0 0.15rem 1.4rem; border-left: 2px solid var(--workspace-border); padding-left: 0.5rem; }
  .wsops.rolled-back { border-left-style: dashed; }
  .wsop { margin: 0.2rem 0; }
  /* Grades editor + frontier panel */
  input[type=text], input[type=number], select, textarea {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 0.3rem 0.5rem; font-size: 0.78rem; font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { width: 100%; min-height: 4.5em; resize: vertical; }
  .evidence-primary { border-left: 3px solid var(--put-border); padding-left: .45rem; }
  .execution { margin: .4rem 0; padding: .35rem .5rem; border-left: 2px solid var(--border); background: var(--panel-2); font-size: .78rem; }
  .execution.capped { border-left-color: var(--amber); }
  .execution.failure { border-left-color: var(--red); }
  /* Workflow orchestration is distinct from one PUT completion: the program's
     returned value and each agent stage get their own border hue. */
  .execution.workflow-output { border-left-color: var(--accent); }
  .workflow-stage { border-color: var(--sim-border); }
  .workflow-stage .workflow-invocation-output { margin-top: .35rem; }
  .run-event > summary { cursor: pointer; list-style: none; }
  .run-event > summary::before { content: '▸'; color: var(--text-dim); margin-right: .4rem; }
  .run-event[open] > summary::before { content: '▾'; }
  .run-event > summary::-webkit-details-marker { display: none; }
  .returned-value { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 30rem; overflow: auto; scrollbar-gutter: stable; color: var(--text); }
  .returned-fields { margin: .35rem 0 0; }
  .returned-fields dt { font-weight: 600; margin: .65rem 0 .25rem; }
  .returned-fields dd { margin: 0; }
  .call-browser { display: grid; grid-template-columns: minmax(12rem, .7fr) minmax(0, 1.3fr); gap: 1rem; margin-top: .5rem; align-items: start; }
  .call-list { max-height: 24rem; overflow: auto; border: 1px solid var(--border); }
  .call-row { display: grid; gap: .25rem; width: 100%; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; padding: .6rem; text-align: left; overflow-wrap: anywhere; }
  .call-row.active { background: var(--bg-alt, var(--bg)); box-shadow: inset 3px 0 var(--accent, currentColor); }
  .call-row strong { font-weight: 600; }
  .call-detail { min-width: 0; }
  .call-detail > h3 { margin-top: 0; }
  .call-detail > section { margin: .75rem 0; padding-bottom: .6rem; border-bottom: 1px solid var(--border); }
  .call-detail h4 { margin: .35rem 0; }
  .call-arguments .returned-value { max-height: 20rem; }
  @media (max-width: 1100px) { .call-browser { grid-template-columns: minmax(0, 1fr); } .call-list { max-height: 13rem; } }
  .workflow-direct { border-left-color: var(--workspace); }
  .workflow-direct .bubble.put { background: var(--workspace-soft); border-color: var(--workspace-border); }
  .composer { border-top: 1px solid var(--border); padding-top: .45rem; margin: .65rem 0; }
  .composer > summary { font-weight: 600; }
  .composer textarea { min-height: 16rem; }
  .filter-row { display:grid; grid-template-columns:minmax(10em,1fr) minmax(12em,2fr) auto; gap:.4rem; align-items:center; margin:.25rem 0; }
  .source-compare { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin-top:.35rem; }
  @media (max-width: 600px) { .source-compare { grid-template-columns:1fr; } .filter-row { grid-template-columns:1fr auto; } .filter-row input { grid-column:1; } }
  .grow { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .grade-row { display: flex; gap: 0.4rem; align-items: center; margin: 0.22rem 0; }
  .grade-row .name { font-family: var(--mono); font-size: 0.78rem; color: var(--text); min-width: 11em; }
  .grade-row input { width: 7em; }
  .attribute-row { display: grid; grid-template-columns: minmax(9em, 1fr) minmax(12em, 2fr) auto; gap: 0.4rem; align-items: center; margin: 0.22rem 0; }
  .attribute-row input { min-width: 0; width: 100%; }
  .system-attribute { font-family: var(--mono); font-size: 0.76rem; overflow-wrap: anywhere; }
  .display-name { color: var(--text); font-size: 1rem; font-weight: 700; overflow-wrap: anywhere; }
  .group-counts { display: flex; gap: 0.3rem; flex-wrap: wrap; margin: 0.25rem 0; }
  .group-count { font: 0.7rem var(--mono); padding: 0.08rem 0.35rem; border: 1px solid var(--border); border-radius: 4px; }
  .pending { color: var(--amber); }
  .unavailable { color: var(--red); }
  .del { color: var(--text-dim); cursor: pointer; border: none; background: none; padding: 0 0.2rem; font-size: 0.9rem; }
  .del:hover { color: var(--accent); }
  .axis-grid { display: grid; grid-template-columns: 1fr auto auto auto; gap: 0.4rem 0.6rem; align-items: center; }
  .frontier-err { border-left: 2px solid var(--red); padding-left: 0.6rem; margin: 0.4rem 0; }
  .frontier-err .reason { font-family: var(--mono); font-size: 0.74rem; color: var(--red); }
  .ptable { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 0.78rem; margin-top: 0.5rem; }
  .ptable th, .ptable td { text-align: left; padding: 0.25rem 0.5rem; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; word-break: break-word; }
  .ptable .group-label { min-width: 14em; }
  .ptable .dom { color: var(--text-dim); }
  .ptable .nd { color: var(--green); font-weight: 700; }
  .frontier-svg {
    /* Inherited by the inline SVG; no server request needed on theme changes. */
    --frontier-page: var(--panel); --frontier-panel: var(--panel);
    --frontier-label: var(--text); --frontier-tick: var(--text-dim);
    --frontier-dim-label: var(--text-dim); --frontier-grid: var(--border);
    margin-top: 0.8rem; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); overflow: auto;
  }
  .frontier-svg svg { display: block; }
  /* Cross-linking is presentation only: group ids and arithmetic remain the

  .frontier-svg .frontier-group.pe-linked-active { opacity: 1 !important; }
  .frontier-svg .frontier-group.pe-linked-muted { opacity: .18 !important; }
  /* Pending groups have no coordinates. Their complete membership remains in
     the review queue and data table; omitting them from the plot legend keeps

  .frontier-svg .frontier-group.pending { display:none; }
  .job-group { scroll-margin-top: 1rem; }

  /* Long failure texts (e.g. full provider error bodies) are clipped to one

  .clip-toggle { color: var(--accent); cursor: pointer; user-select: none; font-weight: 700; padding: 0 0.1rem; }
  .clip-toggle:hover { text-decoration: underline; }

  /* Overview-first application shell. Detail remains complete, but only the
     selected primary view is mounted so an evidence corpus is not a 100k-pixel
     catalog of simultaneously expanded records. */
  .app-nav { display: flex; gap: 1.1rem; border-bottom: 1px solid var(--border); margin-bottom: 1.35rem; }
  .nav-tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; padding: 0.75rem 0.1rem 0.62rem; color: var(--text-dim); }
  .nav-tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 650; }

  .page-head p { margin:.2rem 0 0; max-width:68rem; }

  .overview-stats { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); border-top:1px solid var(--border); border-bottom:1px solid var(--border); margin-bottom:1.25rem; }
  .stat { padding:.75rem 1rem; border-right:1px solid var(--border); }

  .stat span { color:var(--text-dim); font-size:.72rem; }

  .config-panel > summary, .data-panel > summary, .backlog-panel > summary, .help-panel > summary { font-weight:600; }
  .configuration-summary { color:var(--text-dim); font: .74rem var(--mono); overflow-wrap:anywhere; }
  .toolbar { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin-bottom:.8rem; padding:.55rem 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }

  .filter-panel { flex:1 1 100%; border-top:1px solid var(--border); padding-top:.45rem; }

  .job-group { border:0; box-shadow:none; }
  .job-group.active { border:0; box-shadow:none; }

  .investigation-list-pane, .investigation-detail-pane { min-width:0; }

  .job-row .row-review.pending { color:var(--amber); }

  .raw-json { max-height:36rem; overflow:auto; white-space:pre; font:.72rem/1.45 var(--mono); background:var(--panel-2); padding:.7rem; border:1px solid var(--border); }
  .scenario-layout { display:grid; grid-template-columns:minmax(16rem,22rem) minmax(0,1fr); gap:1.5rem; }
  .scenario-list { border-top:1px solid var(--border); }
  .scenario-row { width:100%; display:block; text-align:left; border:0; border-bottom:1px solid var(--border); border-radius:0; background:transparent; padding:.7rem .25rem; }
  .scenario-row.active { background:var(--accent-soft); }
  .scenario-row strong { display:block; }
  @media (max-width: 900px) {
    .overview-stats, .detail-summary { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .stat, .summary-item { border-bottom:1px solid var(--border); }
    .investigation-layout, .scenario-layout { grid-template-columns:1fr; }
    .investigation-detail-pane { scroll-margin-top:1rem; }
    .job-row { grid-template-columns:5.2rem minmax(0,1fr); }
  }
  @media (max-width: 600px) {
    .wrap { padding-left:.8rem; padding-right:.8rem; }
    header { align-items:flex-start; padding:.7rem 0; }
    header .sub { display:none; }
    header .auto { margin-left:auto; }
    header .auto label, header .auto .share-label { display:none; }
    .app-nav { overflow-x:auto; }
    .page-head { align-items:flex-start; flex-direction:column; }
    .overview-stats, .detail-summary { grid-template-columns:1fr 1fr; }
    .overview-stats > :last-child, .detail-summary > :last-child { grid-column:1 / -1; }
    .axis-grid { grid-template-columns:1fr; }
    .axis-grid > * { max-width:100%; }
    .attribute-row { grid-template-columns:minmax(0,1fr) auto; }
    .attribute-row > :nth-child(2) { grid-column:1; }
    .job-row { grid-template-columns:4.7rem minmax(0,1fr); gap:.5rem; }
  }
</style>
<script>
  // Light is the product default; remember an explicit dark-mode choice.
  document.documentElement.dataset.theme = localStorage.getItem('pe_theme') || 'light';
</script>
</head>
<body>
<div class="wrap"><div id="root"></div></div>

<script type="importmap">
{ "imports": {
  "preact": "/vendor/preact.mjs",
  "preact/hooks": "/vendor/hooks.mjs",
  "htm": "/vendor/htm.mjs"
} }
</script>
<script type="module">
import { h, render } from 'preact';
import { useState, useEffect, useRef } from 'preact/hooks';
import htm from 'htm';
const html = htm.bind(h);

const API = id => `/api/investigations${id ? '/'+id : ''}`;
const TOKEN_KEY = 'pe_api_token';
const THEME_KEY = 'pe_theme';
const authHeaders = token => token ? {'Authorization': 'Bearer '+token} : {};
// Format one role's UsageTotals. `tool_calls` is only the simulated PUT
// Estimated USD cost, only present for priced (e.g. OpenRouter) models.
// Scale precision to magnitude so sub-cent costs stay meaningful.
const fmtUsd = c => {
  if (c == null) return '';
  const s = c >= 1 ? c.toFixed(2) : c >= 0.0001 ? c.toPrecision(2) : c.toExponential(1);
  return ` · ~$${s}`;
};
// (the sim model has no tools), so it's hidden when zero to avoid noise.
const fmtUsage = u => u ? `${u.input_tokens.toLocaleString()} in${u.cache_read_tokens?` (${u.cache_read_tokens.toLocaleString()} cached)`:''} / ${u.output_tokens.toLocaleString()} out · ${u.llm_calls} llm${u.tool_calls?` · ${u.tool_calls} tool calls`:''}${fmtUsd(u.cost_usd)}` : '';
// One usage line: a colored role chip + the totals. Colors match the chat
// bubbles so `put`/`sim` are recognizable across the card.
const roleLine = (label, u, cls) => u ? html`<div class="meta usage-line"><span class=${`uchip ${cls}`}>${label}</span>${fmtUsage(u)}</div>` : null;
const pretty = v => { try { return JSON.stringify(v, null, 2); } catch { return String(v); } };
const renderValue = v => typeof v === 'string' ? v : pretty(v);
const fmtAxisVal = v => v == null ? '—' : Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : +v.toFixed(3);
const relTime = ms => { const s=(Date.now()-ms)/1000; if(s<60) return `${Math.floor(s)}s ago`; if(s<3600) return `${Math.floor(s/60)}m ago`; return `${Math.floor(s/3600)}h ago`; };
const phaseLabel = p => ({
  resolving_inputs: 'resolving input variables',
  orchestration: 'orchestrating workflow',
  put_loop: 'running PUT tool loop',
})[p] || p;

// Failure texts (e.g. "simulator call failed: …" plus the whole provider
// body) can run several screens long. Clip to the first `limit` chars and
// make the marker itself the toggle: click "…" to expand, "⌃" to collapse.
function ClipText({ text, limit = 150 }) {
  const [open, setOpen] = useState(false);
  const s = text == null ? '' : String(text);
  if (s.length <= limit) return html`<span>${s}</span>`;
  return html`<span>${open ? s : s.slice(0, limit)}<span class="clip-toggle" onClick=${() => setOpen(!open)} title=${open ? 'collapse' : 'expand full error'}>${open ? ' ⌃' : '…'}</span></span>`;
}

function Bubble({ side, role, body, tool, think }) {
  return html`<div class=${`bubble ${side}`}><div class="role">${role}</div><div class=${`body${tool ? ' tool':''}${think ? ' think':''}`}>${body}</div></div>`;
}

// A thinking bubble: collapsible when long (reasoning can run screens),
// italic always. Same chat side as its owner's other bubbles.
function Thinking({ side, role, text }) {
  const [open, setOpen] = useState(false);
  const LIMIT = 300;
  const s = String(text);
  const long = s.length > LIMIT;
  const shown = open || !long ? s : s.slice(0, LIMIT);
  return html`<div class=${`bubble ${side}`}>
    <div class="role">${role} · thinking${long ? html` <span class="clip-toggle" style="cursor:pointer" onClick=${() => setOpen(!open)} title=${open ? 'collapse' : 'expand full thinking'}>${open ? '⌃' : '…'}</span>` : null}</div>
    <div class="body think">${shown}</div>
  </div>`;
}

function LuaExecutionProvenance({ execution }) {
  const outcome = execution.outcome || 'unknown';
  const detailLabel = outcome === 'fallback' ? 'fallback reason'
    : outcome === 'error' ? 'Lua error' : 'detail';
  return html`<div class="lua-provenance">
    <span class="uchip sim">supplied Lua · ${execution.tool} · ${(execution.source_hash || '').slice(0, 8)}</span>
    <span>${outcome}</span>
    ${execution.detail ? html`<span>· ${detailLabel}: ${execution.detail}</span>` : null}
  </div>`;
}

function ExchangeView({ exchange, index, total }) {
  const a = exchange.call && exchange.call.args;
  const args = typeof a === 'string' ? a : JSON.stringify(a);
  const response = typeof exchange.response === 'string'
    ? exchange.response
    : JSON.stringify(exchange.response, null, 2);
  const lua = exchange.lua_execution;
  // A Lua runtime error is not a PUT tool error: the returned response below
  // is the LLM fallback, while discarded operations are shown separately.
  const computed = lua && lua.outcome === 'computed';
  const simRole = computed ? 'SIM · Lua · executed, fidelity unverified' : (lua ? 'SIM · LLM' : 'SIM');
  return html`<div class="exchange evidence-primary">
    <div class="exchange-head">primary exchange evidence · tool call ${index + 1}${total > 1 ? ` of ${total}` : ''}</div>
    <${Bubble} side="put" role="PUT-visible tool call · exact arguments" tool=${true} body=${`${exchange.call.name}(${args})`} />
    <${Bubble} side="sim" role=${`${simRole} · PUT-visible response`} tool=${true} body=${response} />
    ${lua ? html`<${LuaExecutionProvenance} execution=${lua} />` : null}
    ${(exchange.workspace_ops && exchange.workspace_ops.length) || (lua && lua.discarded_workspace_ops && lua.discarded_workspace_ops.length) || (exchange.sim_thinking && exchange.sim_thinking.trim()) ? html`<details><summary>secondary simulator provenance</summary>
      ${exchange.workspace_ops && exchange.workspace_ops.length ? html`<${WsOps} ops=${exchange.workspace_ops} />` : null}
      ${lua && lua.discarded_workspace_ops && lua.discarded_workspace_ops.length ? html`<${WsOps} ops=${lua.discarded_workspace_ops} rolledBack=${true} label="Lua workspace operations (not real world mutations)" />` : null}
      ${exchange.sim_thinking && exchange.sim_thinking.trim() ? html`<${Thinking} side="sim" role="SIM" text=${exchange.sim_thinking} />` : null}
    </details>` : null}
  </div>`;
}

function TurnView({ turn, index }) {
  const exchanges = turn.tool_exchanges || [];
  const kind = exchanges.length
    ? `${exchanges.length} tool call${exchanges.length === 1 ? '' : 's'}${exchanges.length > 1 ? ' · same completion' : ''}`
    : 'text completion';
  return html`<div class="turn">
    <div class="turn-head"><span class="uchip put">Agent turn ${index + 1}</span><span class="meta">${kind}</span></div>
    ${turn.thinking && turn.thinking.trim()
      ? html`<${Thinking} side="put" role="PUT" text=${turn.thinking} />`
      : null}
    ${turn.model_output && turn.model_output.trim()
      ? html`<${Bubble} side="put" role="PUT" body=${turn.model_output} />`
      : null}
    ${exchanges.map((exchange, i) => html`<${ExchangeView} key=${i} exchange=${exchange} index=${i} total=${exchanges.length} />`)}
  </div>`;
}

// The Lua workflow's returned value is NOT a final answer and need not equal the
// last agent completion: it is whatever JSON the program returned. Render it as
// its own artifact before any per-stage completions.
function WorkflowOutput({ output, error, stopReason }) {
  const hasOutput = output !== undefined;
  return html`<div class=${`execution workflow-output${error ? ' failure' : ''}`}>
    <b>workflow output</b> <span class="meta">· value returned by the Lua program — not necessarily the last agent completion</span>
    ${stopReason ? html`<span class="mono"> · stop ${String(stopReason).replaceAll('_', ' ')}</span>` : null}
    ${error ? html`<div class="note">workflow error: <${ClipText} text=${error} /></div>` : null}
    ${hasOutput
      ? html`<pre class="step">${pretty(output)}</pre>`
      : html`<div class="meta">no workflow output recorded${error ? ' — the program failed' : ''}.</div>`}
  </div>`;
}

// One ctx.run_agent conversation. Its exact effective handoff (prompt, input,
// model, tools, controls) and its turn range in the flat trace are evidence:
// the reader can see what each stage received and produced, and where the
// handoff to the next stage happened.
function InvocationStage({ invocation, turns, index, total }) {
  const recordedRange = invocationTurnRange(invocation);
  const range = recordedRange && invocation.running ? [recordedRange[0], (turns || []).length] : recordedRange;
  const stageTurns = range ? (turns || []).slice(range[0], range[1]) : [];
  const name = invocation.name || `agent ${index + 1}`;
  const tools = invocation.tools || [];
  const controls = invocation.controls || {};
  return html`<details class="turn workflow-stage run-event">
    <summary class="turn-head"><span class="uchip put">Agent ${index + 1}${total > 1 ? ` / ${total}` : ''}</span><span>${name}</span><span class="meta">${shortModel(invocation.model)}</span>${invocation.running ? html`<span class="badge running">running</span>` : invocation.failure ? html`<span class="badge failed">failed</span>` : invocation.stop_reason ? html`<span class="badge ${invocation.stop_reason === 'final_completion' ? 'completed' : 'partial'}">${stopLabel(invocation.stop_reason)}</span>` : null}</summary>
    <div class="meta">model <span class="mono">${shortModel(invocation.model)}</span>${range ? (range[1] > range[0] ? ` · flat turns ${range[0]}–${range[1] - 1}` : ' · flat turns none') : ' · turn range not recorded'} · steps ${invocation.steps_used ?? '—'} · tokens ${invocation.tokens_used ?? '—'}${invocation.stop_reason ? ` · stop ${String(invocation.stop_reason).replaceAll('_', ' ')}` : ''}</div>
    <details><summary class="meta">Input, instructions and settings</summary>
      ${invocation.prompt ? html`<div style="margin-top:.3rem"><b class="meta">Prompt</b><div class="body" style="white-space:pre-wrap;word-break:break-word;font-size:.78rem">${invocation.prompt}</div></div>` : null}
      ${invocation.input ? html`<div style="margin-top:.3rem"><b class="meta">Input to this stage</b><div class="body" style="white-space:pre-wrap;word-break:break-word;font-size:.78rem">${invocation.input}</div></div>` : null}
      <div class="meta" style="margin-top:.3rem">tools: <span class="mono">${tools.length ? tools.join(', ') : '(none exposed)'}</span></div>
      <div class="meta">controls: <span class="mono">${pretty(controls)}</span></div>
      ${invocation.budget ? html`<div class="meta">effective stage budget: <span class="mono">${pretty(invocation.budget)}</span></div>` : null}
    </details>
    ${invocation.failure ? html`<div class="note">invocation failed: <${ClipText} text=${invocation.failure} /></div>` : null}
    ${invocation.budget_cutoff_completion ? html`<details><summary class="meta">charged completion excluded by this stage's token cap</summary><pre class="step">${pretty(invocation.budget_cutoff_completion)}</pre></details>` : null}
    ${invocation.unrendered_call ? html`<details><summary class="meta">tool request with no response</summary><pre class="step">${pretty(invocation.unrendered_call)}</pre></details>` : null}
    ${stageTurns.map((turn, i) => html`<${TurnView} key=${i} turn=${turn} index=${(range ? range[0] : 0) + i} />`)}
    <details><summary class="meta">raw invocation evidence JSON</summary><pre class="step">${pretty(invocation)}</pre></details>
    ${invocation.output != null && !stageTurns.some(turn => turn.model_output === invocation.output && !(turn.tool_exchanges || []).length) ? html`<div class="workflow-invocation-output"><div class="meta">Stage output</div><${Bubble} side="put" role=${name} body=${invocation.output} /></div>` : null}
  </details>`;
}

// A ctx.call_tool call is orchestration, not a PUT turn: the program asked the
// world directly and got a rendered response. Show request, response, and the
// same provenance a PUT tool exchange carries.
function DirectToolCallView({ call, index, total }) {
  const name = call.name || '(unnamed tool)';
  const args = typeof call.args === 'string' ? call.args : pretty(call.args);
  const response = typeof call.response === 'string' ? call.response : pretty(call.response);
  const lua = call.lua_execution;
  return html`<details class="exchange evidence-primary workflow-direct run-event">
    <summary class="exchange-head">Program tool call ${index + 1}${total > 1 ? ` of ${total}` : ''} · <span class="mono">${name}</span><span class=${`badge ${call.running ? 'running' : call.failure ? 'failed' : 'completed'}`}>${call.running ? 'running' : call.failure ? 'failed' : 'finished'}</span></summary>
    <${Bubble} side="put" role="program tool call · exact arguments" tool=${true} body=${`${name}(${args})`} />
    ${call.running ? html`<div class="meta">tool call running — no response yet</div>` : call.failure
      ? html`<div class="note">program tool call failed: <${ClipText} text=${call.failure} /></div>`
      : html`<${Bubble} side="sim" role="world response · rendered by the same engine" tool=${true} body=${response} />`}
    ${lua ? html`<${LuaExecutionProvenance} execution=${lua} />` : null}
    ${call.state_after != null ? html`<details><summary class="meta">world state after this call</summary><pre class="step">${pretty(call.state_after)}</pre></details>` : null}
    ${(call.workspace_ops && call.workspace_ops.length) || (lua && lua.discarded_workspace_ops && lua.discarded_workspace_ops.length) || (call.sim_thinking && call.sim_thinking.trim()) ? html`<details><summary class="meta">secondary simulator provenance</summary>
      ${call.workspace_ops && call.workspace_ops.length ? html`<${WsOps} ops=${call.workspace_ops} />` : null}
      ${lua && lua.discarded_workspace_ops && lua.discarded_workspace_ops.length ? html`<${WsOps} ops=${lua.discarded_workspace_ops} rolledBack=${true} label="Lua workspace operations (not real world mutations)" />` : null}
      ${call.sim_thinking && call.sim_thinking.trim() ? html`<${Thinking} side="sim" role="SIM" text=${call.sim_thinking} />` : null}
    </details>` : null}
    <details><summary class="meta">raw direct call evidence JSON</summary><pre class="step">${pretty(call)}</pre></details>
  </details>`;
}

// Exact program revision and parameters the orchestration actually ran, plus
// the raw evidence object for readers who want every field.
function WorkflowEvidenceMeta({ workflow }) {
  const hash = workflow.source_hash || '';
  return html`<details class="lua-program">
    <summary>workflow orchestration · source, params, and raw evidence</summary>
    <div class="lua-provenance"><span class="uchip sim">orchestration Lua · ${hash.slice(0, 8) || 'unhashed'}</span>${workflow.stop_reason ? html`<span>stop ${String(workflow.stop_reason).replaceAll('_', ' ')}</span>` : null}${workflow.error ? html`<span class="note">· failed</span>` : null}</div>
    ${workflow.params !== undefined && workflow.params !== null ? html`<details><summary class="meta">params passed to the program</summary><pre class="step">${pretty(workflow.params)}</pre></details>` : null}
    ${workflow.source ? html`<${SourceCode} source=${workflow.source} />` : null}
    <details><summary class="meta">raw workflow evidence JSON</summary><pre class="raw-json">${pretty(workflow)}</pre></details>
  </details>`;
}

function copySource(source) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(source);
  // Clipboard access may be unavailable on an insecure origin. This is only
  // a compatibility fallback; source itself is always rendered as text.
  const area = document.createElement('textarea');
  area.value = source;
  area.setAttribute('readonly', '');
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  const copied = document.execCommand('copy');
  area.remove();
  return copied ? Promise.resolve() : Promise.reject(new Error('copy unavailable'));
}

function SourceCode({ source }) {
  const [copied, setCopied] = useState('');
  const text = source == null ? '' : String(source);
  const copy = async () => {
    try { await copySource(text); setCopied('copied'); }
    catch { setCopied('copy unavailable'); }
  };
  return html`<div>
    <div class="source-actions"><button class="toggle" onClick=${copy}>copy source</button>${copied ? html`<span class="meta" style="margin-left:0.35rem">${copied}</span>` : null}</div>
    <pre class="source-code" tabindex="0"><code>${text}</code></pre>
  </div>`;
}

/// The implementations the SCENARIO supplies for this run, as evidence: the
/// caller authored them, the harness executed them. There are no generated
/// revisions to display — a fix is a new scenario revision (fork it), and each
/// exchange names the source hash it ran.
function Implementations({ implementations }) {
  const list = Array.isArray(implementations) ? implementations : [];
  if (!list.length) return null;
  return html`<details class="lua-program">
    <summary>Tool simulation code · ${list.length} implementation${list.length === 1 ? '' : 's'}</summary>
    ${list.map((implementation, index) => html`<div class="lua-revision" key=${index}>
      <div class="lua-revision-meta"><span class="mono">${implementation.tool}</span> · <span class="mono">${(implementation.source_hash || '').slice(0, 8)}</span></div>
      <${SourceCode} source=${implementation.source} />
    </div>`)}
  </details>`;
}

function Chat({ s }) {
  const out = [];
  // The scenario's supplied implementations sit beside resolved inputs: what
  // CAN compute, before the protagonist and even when the run fails early.
  if (s.implementations && s.implementations.length) {
    out.push(html`<${Implementations} key="lua" implementations=${s.implementations} />`);
  }
  // Resolved input bindings (sim agent's output) — first, SIM side.
  const ri = s.resolved_inputs;
  if (ri && Object.keys(ri).length) {
    const rows = Object.entries(ri).map(([k, v], i) => {
      // Strings render as-is; only actual objects/arrays pretty-print,
      // collapsible so a deep value doesn't blow out the pane.
      const isObj = v !== null && typeof v === 'object';
      const shown = isObj ? JSON.stringify(v, null, 2) : String(v);
      const body = (!isObj || shown.length <= 80)
        ? html`<span>${shown}</span>`
        : html`<details><summary class="mono" style="cursor:pointer;color:var(--text-dim)">${shown.split('\n')[0].slice(0,70)}…</summary><pre class="step" style="max-height:12em;overflow:auto;margin:0.3rem 0">${shown}</pre></details>`;
      return html`<div key=${'ri'+i} style="display:flex;gap:0.4rem;padding:0.15rem 0;border-bottom:1px solid var(--border)"><span class="mono" style="color:var(--text-dim);flex-shrink:0">${k} →</span><span style="word-break:break-word">${body}</span></div>`;
    });
    out.push(html`<div class="bubble sim" key="ri"><div class="role">SIM</div><div class="body">${rows}</div></div>`);
  }
  if (s.user_message && s.user_message.trim()) out.push(html`<${Bubble} key="u" side="sim" role="USER" body=${s.user_message} />`);
  if (s.workflow) {
    out.push(html`<${WorkflowOutput} key="wf-output" output=${s.workflow.output} error=${s.workflow.error} stopReason=${s.workflow.stop_reason} />`);
    const invocations = s.workflow.invocations || [];
    const turns = s.turns || [];
    const direct = s.workflow.tool_calls || [];
    const events = [
      ...invocations.map((value, i) => ({ value, i, kind: 'agent' })),
      ...direct.map((value, i) => ({ value, i, kind: 'tool' })),
    ];
    if (events.every(event => Number.isInteger(event.value.event_id))) {
      events.sort((a, b) => a.value.event_id - b.value.event_id);
      events.forEach(event => out.push(event.kind === 'agent'
        ? html`<${InvocationStage} key=${'event'+event.value.event_id} invocation=${event.value} turns=${turns} index=${event.i} total=${invocations.length} />`
        : html`<details class="lua-program" key=${'event'+event.value.event_id}><summary>workflow direct tool calls · event ${event.value.event_id} · ${event.value.name}</summary><${DirectToolCallView} call=${event.value} index=${event.i} total=${direct.length} /></details>`));
    } else {
      invocations.forEach((invocation, i) => out.push(html`<${InvocationStage} key=${'stage'+i} invocation=${invocation} turns=${turns} index=${i} total=${invocations.length} />`));
      if (direct.length) out.push(html`<details class="lua-program" key="wf-direct"><summary>workflow direct tool calls · ${direct.length} <span class="meta">(ctx.call_tool, not PUT turns)</span></summary>${direct.map((call, i) => html`<${DirectToolCallView} key=${i} call=${call} index=${i} total=${direct.length} />`)}</details>`);
    }
    // Turns whose index is not named by any recorded invocation range are still
    // evidence. Surface them rather than losing them when the server adds a
    // stage kind the UI does not yet attribute.
    const covered = new Set();
    invocations.forEach(invocation => { const range = invocationTurnRange(invocation); if (range) for (let t = range[0]; t < range[1]; t++) covered.add(t); });
    const leftovers = turns.map((turn, i) => ({ turn, i })).filter(x => !covered.has(x.i));
    if (leftovers.length) out.push(html`<details key="wf-leftover"><summary class="meta">flat turns not attributed to a stage · ${leftovers.length}</summary>${leftovers.map(x => html`<${TurnView} key=${x.i} turn=${x.turn} index=${x.i} />`)}</details>`);
    out.push(html`<${WorkflowEvidenceMeta} key="wf-meta" workflow=${s.workflow} />`);
  } else {
    (s.turns || []).forEach((turn, i) => {
      out.push(html`<${TurnView} key=${'turn'+i} turn=${turn} index=${i} />`);
    });
  }
  return html`<div class="chat">${out.length ? out : html`<span class="meta">(no messages yet)</span>`}</div>`;
}

function WsOps({ ops, label = 'simulator workspace', rolledBack = false }) {
  // The simulator's workspace lookups while rendering this step — so a
  // reader can see whether the answer was GROUNDED in the uploaded files
  // (real reads/greps) or INVENTED. Collapsible; each op shows tool(args)
  // and the workspace's JSON result. Rolled-back Lua operations are not
  // presented as committed world changes.
  const heading = `${rolledBack ? '↩ ROLLED BACK · ' : '🔍 '}${label} · ${ops.length} op${ops.length===1?'':'s'}: ${ops.map(o=>o.tool).join(', ')}`;
  return html`<details class=${`wsops${rolledBack ? ' rolled-back' : ''}`}><summary class="meta" style="cursor:pointer">${heading}</summary><div>${ops.map((o,i)=>{
    const a = (o.args !== null && typeof o.args === 'object') ? JSON.stringify(o.args) : String(o.args);
    const r = (o.result !== null && typeof o.result === 'object') ? JSON.stringify(o.result, null, 2) : String(o.result);
    return html`<div class="wsop" key=${i}><span class="mono meta">${o.tool}(${a})</span><pre class="step" style="max-height:9em;overflow:auto;margin:0.2rem 0">${r}</pre></div>`;
  })}</div></details>`;
}

// A job now investigates one authored scenario. Keep its narrative at the job
// level and render either live progress or the terminal trace in this one
// conversation, rather than fabricating attempt/scenario identities.
function ExecutionSummary({ execution, budget }) {
  if (!execution) return html`<div class="execution meta">execution metadata unavailable for this older job fixture.</div>`;
  const reason = execution.stop_reason || 'running / not yet terminal';
  const capped = reason === 'step_budget' || reason === 'token_budget';
  const failed = reason === 'runtime_failure';
  const timing = execution.timing || {};
  const ms = v => Number.isFinite(v) ? `${v.toLocaleString()}ms` : '—';
  return html`<div class=${`execution${capped ? ' capped' : ''}${failed ? ' failure' : ''}`}>
    <b>execution:</b> ${reason === 'final_completion' ? 'final completion' : capped ? `capped (${reason}) — done does not mean a final answer` : reason}
    <span class="mono"> · steps ${execution.steps_used ?? '—'} / ${budget?.max_steps_per_trace ?? '—'} · PUT tokens ${execution.put_tokens_used ?? '—'} / ${budget && budget.max_tokens == null ? 'unlimited' : budget?.max_tokens ?? '—'}</span>
    <div class="meta">timing: elapsed ${ms(timing.elapsed_ms)} · input resolution ${ms(timing.resolving_inputs_ms)}${timing.orchestration_ms > 0 ? ` · orchestration ${ms(timing.orchestration_ms)}` : ''} · PUT loop ${ms(timing.put_loop_ms)}</div>
    ${execution.budget_cutoff_completion ? html`<details open><summary>completion received at token cutoff — not accepted; tools were NOT executed</summary><pre class="step">${pretty(execution.budget_cutoff_completion)}</pre></details>` : null}
    ${execution.unrendered_call ? html`<details open><summary>tool request that could not be simulated — it has NO response; its siblings above are real</summary><pre class="step">${pretty(execution.unrendered_call)}</pre></details>` : null}
  </div>`;
}

function ConversationPanel({ scenario, progress, trace, failure, budget }) {
  const evidence = trace
    ? { ...trace, user_message: scenario && scenario.user_message }
    : { ...(progress || {}), user_message: (progress && progress.user_message) || (scenario && scenario.user_message) };
  const turns = evidence.turns || [];
  const toolCallCount = trace ? trace.tool_calls : turns.reduce((sum, turn) => sum + (turn.tool_exchanges || []).length, 0);
  return html`<div class="scen" style="margin-top:0.55rem">
    ${scenario ? html`<details>
      <summary>scenario spec (world and input domain)</summary>
      <div class="body" style="white-space:pre-wrap;word-break:break-word;padding:0.3rem 0">${scenario.world || '(no world)'}</div>
      ${scenario.input_domain ? html`<details><summary class="meta">input domain</summary><pre class="step">${pretty(scenario.input_domain)}</pre></details>` : null}
      ${scenario.simulator_notes ? html`<div class="meta" style="margin-top:0.4rem"><b>simulator notes:</b> ${scenario.simulator_notes}</div>` : null}
    </details>` : null}
    ${failure ? html`<div class="note" style="margin:0.35rem 0"><b>${failure.stage}:</b> <${ClipText} text=${failure.error} /></div>` : null}
    <${ExecutionSummary} execution=${(trace && trace.execution) || (progress && progress.execution)} budget=${budget} />
    <details>
      <summary>conversation · ${turns.length} PUT turn(s) · ${toolCallCount} tool call(s)${evidence.workflow ? ` · ${(evidence.workflow.invocations || []).length} workflow stage(s) · ${(evidence.workflow.tool_calls || []).length} direct call(s)` : ''}</summary>
      <${Chat} s=${evidence} />
    </details>
    ${trace && trace.final_world_state != null ? html`<details><summary>final world state</summary><pre class="step">${pretty(trace.final_world_state)}</pre></details>` : null}
  </div>`;
}

function PutPanel({ put }) {
  if (!put) return null;
  const tools = put.tools || [];
  return html`
    <details style="margin-top:0.4rem">
      <summary class="meta">Prompt goals and tool contracts</summary>
      <div class="meta" style="margin:0.3rem 0"><b>design goals:</b> ${put.design_goals || ''}</div>
      ${tools.length ? html`
        <div class="meta" style="margin:0.3rem 0"><b>tools:</b> (click to expand)</div>
        ${tools.map(t => html`
          <details style="margin:0.2rem 0 0.2rem 0.6rem">
            <summary class="mono meta" style="cursor:pointer">${t.name} <span style="opacity:0.6">(${t.side_effect})</span></summary>
            <div style="margin:0.3rem 0 0.3rem 0.7rem">
              <div class="meta" style="margin:0.2rem 0"><b>description:</b> ${t.description || ''}</div>
              <details><summary class="meta">parameters (JSON schema)</summary><pre class="step">${JSON.stringify(t.parameters, null, 2)}</pre></details>
              ${t.example_responses && t.example_responses.length ? html`<details><summary class="meta">example_responses (${t.example_responses.length})</summary><div>${t.example_responses.map(r => html`<pre class="step">${r}</pre>`)}</div></details>` : null}
            </div>
          </details>`)}
      ` : null}
    </details>`;
}

// The submitted orchestration program (JobView.workflow) is caller-owned and
// visible even before execution or on failure; the evidence endpoint also
// returns it as workflow_program. It is NOT the scenario's tool Lua.
function WorkflowProgramPanel({ program, evidence }) {
  if (!program && !evidence) return null;
  const source = (program && program.lua_source) || (evidence && evidence.source) || '';
  const hash = (evidence && evidence.source_hash) || '';
  return html`<details style="margin-top:0.4rem">
    <summary class="meta">${program ? 'Workflow program' : 'Default program'} · source and parameters</summary>
    <div class="meta">A custom workflow always runs this program in the sandbox. Each <span class="mono">ctx.run_agent</span> is a fresh agent conversation; each <span class="mono">ctx.call_tool</span> asks the scenario world directly. The returned value is the workflow output, not automatically a final answer.</div>
    ${(evidence?.limits || program?.limits) ? html`<details><summary class="meta">Orchestration limits</summary><pre class="step">${pretty(evidence?.limits || program?.limits)}</pre></details>` : null}
    ${program && program.params !== undefined && program.params !== null ? html`<details><summary class="meta">params</summary><pre class="step">${pretty(program.params)}</pre></details>` : null}
    ${source ? html`<${SourceCode} source=${source} />` : html`<div class="meta">Submitted source is not in this view.</div>`}
    ${hash ? html`<div class="meta mono">source sha256 ${hash}</div>` : null}
    ${program ? html`<details><summary class="meta">raw submitted program JSON</summary><pre class="raw-json">${pretty(program)}</pre></details>` : null}
    ${evidence ? html`<details><summary class="meta">workflow execution evidence JSON</summary><pre class="raw-json">${pretty(evidence)}</pre></details>` : null}
  </details>`;
}

// Workflow request examples rendered as raw JSON. There is no structured form
// for arbitrary `workflow.params` or Lua source; the request JSON is the
// editor, so params and source pass through verbatim.
const WORKFLOW_LUA_EXAMPLE = `return function(params, ctx)
  local facts = ctx.run_agent({ name = "extract", prompt = params.extract, model = params.model, input = ctx.input })
  if facts.output == nil then return {delivered = false} end
  local review = ctx.run_agent({ name = "review", prompt = params.review, model = params.model, input = facts.output, tools = {} })
  return { findings = facts.output, answer = review.output }
end`;
const WORKFLOW_REQUEST_EXAMPLE = JSON.stringify({
  scenario_id: '<scenario-id>',
  investigation: { reason: 'two-stage orchestration: extract, then review', budget: { max_steps_per_trace: 12, max_tokens: 12000 } },
  workflow: {
    lua_source: WORKFLOW_LUA_EXAMPLE,
    params: { model: 'open_router::openai/gpt-4.1-nano', extract: 'Use the tools to gather the facts needed for the request. Return exact findings and sources.', review: 'Review the supplied facts and answer concisely. Do not invent facts or claim actions were taken.' },
    limits: { max_agent_invocations: 8, max_direct_tool_calls: 64 },
  },
  attributes: { label: 'two-stage audit' },
}, null, 2);
const SINGLE_AGENT_REQUEST_EXAMPLE = JSON.stringify({
  scenario_id: '<scenario-id>',
  investigation: { reason: 'baseline single-agent run', budget: { max_steps_per_trace: 10, max_tokens: 10000 } },
  put: { id: 'support-agent', template: 'You are a careful support agent. Resolve the request and cite the evidence you used.', design_goals: 'Resolve correctly without inventing facts.' },
  put_model: 'open_router::openai/gpt-4.1-nano',
  attributes: { label: 'baseline' },
}, null, 2);

// Ergonomic submission path for investigations: a request JSON editor seeded
// with a custom-workflow example (and the legacy shorthand). An optional
// scenario picker inserts a known scenario_id without forcing a form for the
// open-ended workflow params/source.
function InvestigationComposer({ token }) {
  const [body, setBody] = useState(() => localStorage.getItem('pe_new_request') || WORKFLOW_REQUEST_EXAMPLE);
  const [scenarios, setScenarios] = useState([]);
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);
  useEffect(() => { try { localStorage.setItem('pe_new_request', body); } catch {} }, [body]);
  useEffect(() => {
    (async () => {
      try {
        const r = await fetch('/api/scenarios', { headers: authHeaders(token) });
        if (!r.ok) return;
        const list = await r.json();
        if (Array.isArray(list)) setScenarios(list);
      } catch {}
    })();
  }, [token]);
  const useExample = value => { setBody(value); setMsg(null); };
  const pickScenario = id => {
    if (!id) return;
    try { const parsed = JSON.parse(body); parsed.scenario_id = id; setBody(JSON.stringify(parsed, null, 2)); setMsg(null); }
    catch { setMsg({ err: 'request JSON must be valid before a scenario can be inserted' }); }
  };
  const submit = async () => {
    setMsg(null);
    let parsed;
    try { parsed = JSON.parse(body); } catch (e) { setMsg({ err: `request is not valid JSON: ${e.message}` }); return; }
    setBusy(true);
    try {
      const r = await fetch(API(), { method: 'POST', headers: { ...authHeaders(token), 'content-type': 'application/json' }, body: JSON.stringify(parsed) });
      const res = await r.json().catch(() => ({}));
      if (!r.ok) { setMsg({ err: (res.problems || []).map(p => p.detail).join(' · ') || res.error || `HTTP ${r.status}` }); return; }
      setMsg({ ok: `accepted ${res.id} — it will appear in the list on the next refresh` });
    } catch (e) { setMsg({ err: `request failed: ${e.message || e}` }); } finally { setBusy(false); }
  };
  return html`<details class="composer">
    <summary>New investigation <span class="meta">(POST /api/investigations)</span></summary>
    <div class="meta">Submit a custom Lua workflow, or the legacy single-agent shorthand, as request JSON. Lua source and params pass through verbatim; the server validates every field.</div>
    <div class="grow" style="margin:.4rem 0">
      <select aria-label="insert scenario id" value="" onChange=${e => pickScenario(e.target.value)}>
        <option value="">insert scenario id…</option>
        ${scenarios.map(s => html`<option value=${s.id}>${s.label || s.id.slice(0, 8)} · r${s.revision}</option>`)}
      </select>
      <button class="toggle" onClick=${() => useExample(WORKFLOW_REQUEST_EXAMPLE)}>workflow example</button>
      <button class="toggle" onClick=${() => useExample(SINGLE_AGENT_REQUEST_EXAMPLE)}>single-agent example</button>
    </div>
    <textarea aria-label="investigation request JSON" class="mono" value=${body} onInput=${e => setBody(e.target.value)}></textarea>
    <div class="grow" style="margin-top:.35rem"><button disabled=${busy} onClick=${submit}>submit investigation</button>${msg?.ok ? html`<span class="meta" style="color:var(--green)">✓ ${msg.ok}</span>` : null}${msg?.err ? html`<span class="note">${msg.err}</span>` : null}</div>
  </details>`;
}

function ResultLine({ j }) {
  const r = j.result; if (!r) return null;
  const wf = workflowEvidence(j);
  return html`<div style="margin-top:0.5rem">
    <span class="badge ${r.failure ? 'failed' : 'job-done'}">${r.failure ? 'failed' : r.trace ? 'trace captured (inspect stop reason)' : 'finished (inspect stop reason)'}</span>
    <span class="meta"> ${wf ? `${(wf.invocations || []).length} workflow stage(s) · ${(wf.tool_calls || []).length} direct tool call(s) — output is the program's return value` : r.trace ? `${(r.trace.turns || []).length} PUT turn(s)` : 'no terminal trace'}</span>
    ${(r.usage || j.progress?.usage) ? html`<div style="margin-top:0.2rem">${roleLine('put', (r.usage || j.progress?.usage).put, 'put')}${roleLine('sim', (r.usage || j.progress?.usage).sim, 'sim')}</div>` : null}
  </div>`;
}

// Only investigation-owned values belong here. Runtime call arguments and
// resolved scenario bindings are execution evidence, not original inputs.
function InvestigationInputs({ j }) {
  const program = j.workflow;
  const scenario = j.scenario;
  return html`<div class="stable-inputs">
    <h3>Program</h3>
    ${program ? html`<details><summary>Lua source</summary>${program.lua_source != null ? html`<${SourceCode} source=${program.lua_source} />` : html`<span class="meta">Default program (source not stored in this record)</span>`}</details>
      <h3>Parameters</h3><div class="investigation-params"><${ReturnedValue} value=${program.params ?? null} /></div>
      ${program.limits ? html`<details><summary>Orchestration limits</summary><pre class="step">${pretty(program.limits)}</pre></details>` : null}`
      : html`<div class="meta">Default single-agent program</div><h3>Single-agent configuration</h3><${ReturnedValue} value=${{put:j.put, model:j.put_model || jobAttributes(j).put_model, thinking:j.put_thinking_level, controls:j.conversation_controls}} />`}
    <details><summary>Investigation budget</summary><pre class="step">${pretty(j.budget)}</pre></details>
    <h3>Scenario</h3>
    ${scenario?.user_message != null ? html`<div class="bubble sim"><div class="role">User request</div><div class="body">${scenario.user_message}</div></div>` : html`<div class="meta">No opening user message</div>`}
    ${scenario ? html`<details><summary>Test world and input domain</summary>
      <div class="body" style="white-space:pre-wrap;overflow-wrap:anywhere">${scenario.world || '(no world)'}</div>
      <h4>Input domain</h4><pre class="step">${pretty(scenario.input_domain || {})}</pre>
      ${scenario.simulator_notes ? html`<h4>Simulator notes</h4><div class="returned-value">${scenario.simulator_notes}</div>` : null}
    </details>` : null}
  </div>`;
}

function ReturnedValue({ value }) {
  const text = v => typeof v === 'string' ? (v === '' ? '(empty string)' : v) : pretty(v);
  if (value && typeof value === 'object' && !Array.isArray(value) && Object.keys(value).length) {
    return html`<dl class="returned-fields">${Object.entries(value).map(([key, v]) => html`<div key=${key}><dt>${key}</dt><dd class="returned-value">${text(v)}</dd></div>`)}</dl>`;
  }
  return html`<div class="returned-value">${text(value)}</div>`;
}

function ReturnedOutputPanel({ j }) {
  const trace = j.result && j.result.trace;
  const wf = workflowEvidence(j);
  const execution = terminalExecution(j);
  const failure = j.result && j.result.failure;
  const finalTurn = trace && trace.turns && trace.turns.length ? trace.turns[trace.turns.length - 1] : null;
  let value;
  let note = '';
  let state = 'partial';
  let label = 'no returned output';
  if (wf) {
    if (Object.prototype.hasOwnProperty.call(wf, 'output')) {
      value = wf.output;
      state = 'completed';
      label = 'Program output';
    } else if (wf.error || failure) {
      state = 'failed';
      label = 'workflow failed';
      note = wf.error || failure.error || 'workflow failed';
    } else if (execution && (execution.stop_reason === 'step_budget' || execution.stop_reason === 'token_budget')) {
      state = 'partial';
      label = 'cut off';
      note = 'The run reached its limit without returning an output.';
    } else if (j.status === 'running') {
      state = 'running';
      label = 'running';
      note = 'The program is still running. No output has been returned yet.';
    } else {
      state = 'partial';
      label = 'no output';
      note = 'The program finished without returning a value.';
    }
  } else if (execution && execution.stop_reason === 'final_completion' && finalTurn && !(finalTurn.tool_exchanges || []).length) {
    value = finalTurn.model_output;
    state = 'completed';
    label = 'final response';
  } else if (execution && (execution.stop_reason === 'step_budget' || execution.stop_reason === 'token_budget')) {
    state = 'partial';
    label = 'cut off';
    note = 'no final response before budget cutoff';
  } else if (failure) {
    state = 'failed';
    label = 'failed';
    note = failure.error;
  } else if (j.status === 'running') {
    state = 'running';
    label = 'running';
    note = 'final response not available yet';
  } else {
    state = 'partial';
    label = 'no output';
    note = 'no final response recorded';
  }
  const hasValue = value !== undefined;
  const error = failure?.error || wf?.error;
  if (error) state = 'failed';
  const usage = jobUsage(j);
  return html`<div class="returned-output" data-output-state=${state}>
    ${error ? html`<div class="note"><b>Execution failed:</b> <${ClipText} text=${error} /></div>` : null}
    <div class=${`execution ${state}`}>
      <span class="meta">${error && hasValue ? 'Recorded output' : label}</span>
      ${hasValue ? html`<${ReturnedValue} value=${value} />` : !error ? html`<div class="meta" style="margin-top:.35rem">${note}</div>` : null}
    </div>
    <details><summary>Timing, limits and usage</summary>
      <${ExecutionSummary} execution=${execution} budget=${j.budget} />
      ${usage ? html`<div>${roleLine('Agent models', usage.put, 'put')}${roleLine('Tool simulation', usage.sim, 'sim')}</div>` : null}
    </details>
  </div>`;
}

const callState = event => event.value.running ? 'running' : event.value.failure ? 'failed' : event.value.stop_reason ? stopLabel(event.value.stop_reason) : event.kind === 'tool' ? 'finished' : 'recorded';

function CallDetail({ event, turns, j }) {
  const v = event.value;
  const range = invocationTurnRange(v);
  const indices = event.indices || (range ? Array.from({length:Math.max(0, (v.running ? turns.length : range[1]) - range[0])}, (_, i) => range[0] + i) : []);
  const callTurns = indices.filter(i => turns[i] != null).map(i => ({turn:turns[i], i}));
  const args = event.kind === 'agent' ? Object.fromEntries(Object.entries({name:v.name,prompt:v.prompt,model:v.model,input:v.input,tools:v.tools,controls:v.controls}).filter(([,value])=>value!==undefined))
    : event.kind === 'tool' ? {name:v.name,args:v.args}
    : event.kind === 'legacy' ? {configuration:j.put,model:j.put_model || jobAttributes(j).put_model} : null;
  return html`<article class="call-detail" aria-label="Selected call">
    <h3>${event.kind === 'agent' ? 'run_agent' : event.kind === 'tool' ? 'call_tool' : 'Conversation'} · ${v.name}</h3>
    <section class="call-arguments"><h4>Arguments</h4>${args ? html`<${ReturnedValue} value=${args} />` : html`<div class="meta">No call arguments recorded for these turns.</div>`}</section>
    ${event.kind !== 'tool' ? html`<section class="call-conversation"><h4>Conversation</h4>${callTurns.length ? callTurns.map(({turn,i})=>html`<${TurnView} key=${i} turn=${turn} index=${i} />`) : html`<div class="meta">${v.running ? 'Waiting for model turns…' : 'No model turns recorded.'}</div>`}</section>` : null}
    <section class="call-outcome"><h4>Outcome</h4><div class="meta">${callState(event)}${!v.running && v.steps_used != null ? ` · ${v.steps_used} steps · ${v.tokens_used ?? '—'} tokens` : ''}</div>
      ${v.failure ? html`<div class="note"><${ClipText} text=${v.failure} /></div>` : null}
      ${event.kind === 'tool' && Object.prototype.hasOwnProperty.call(v,'response') ? html`<${ReturnedValue} value=${v.response} />` : null}
      ${event.kind !== 'tool' && v.output != null && !callTurns.some(({turn})=>turn.model_output===v.output && !(turn.tool_exchanges || []).length) ? html`<${ReturnedValue} value=${v.output} />` : null}
      ${v.output === '' ? html`<div class="meta">Empty final output</div>` : null}
      ${v.budget ? html`<details><summary>Effective budget</summary><pre class="step">${pretty(v.budget)}</pre></details>` : null}
      ${v.budget_cutoff_completion ? html`<details><summary>Charged completion excluded by the token limit</summary><pre class="step">${pretty(v.budget_cutoff_completion)}</pre></details>` : null}
      ${v.unrendered_call ? html`<details><summary>Tool request with no response</summary><pre class="step">${pretty(v.unrendered_call)}</pre></details>` : null}
      ${v.lua_execution ? html`<${LuaExecutionProvenance} execution=${v.lua_execution} />` : null}
      ${v.workspace_ops?.length ? html`<${WsOps} ops=${v.workspace_ops} />` : null}
      ${v.lua_execution?.discarded_workspace_ops?.length ? html`<${WsOps} ops=${v.lua_execution.discarded_workspace_ops} rolledBack=${true} />` : null}
      ${v.sim_thinking ? html`<${Thinking} side="sim" role="SIM" text=${v.sim_thinking} />` : null}
      ${v.state_after != null ? html`<details><summary>World state after this call</summary><pre class="step">${pretty(v.state_after)}</pre></details>` : null}
    </section>
    <details><summary>Raw call evidence JSON</summary><pre class="step">${pretty(v)}</pre></details>
  </article>`;
}

function RunStepsPanel({ j, jobUi }) {
  const [selectedKey, setSelectedKey] = useState(() => jobUi?.selectedCallKey || null);
  const evidence = j.result?.trace || j.progress || {};
  const wf = workflowEvidence(j);
  const turns = evidence.turns || [];
  const events = (wf ? workflowEvents(wf) : []).map(event => ({...event, key:`${event.kind}:${event.value.event_id ?? event.value.invocation_id ?? event.i}`}));
  const covered = new Set();
  (wf?.invocations || []).forEach(v => {
    const range = invocationTurnRange(v);
    if (range) for (let i=range[0]; i<(v.running ? turns.length : range[1]); i++) covered.add(i);
  });
  const extra = turns.map((_,i)=>i).filter(i=>!covered.has(i));
  if (extra.length || (!wf && (evidence.execution?.budget_cutoff_completion || evidence.execution?.unrendered_call))) events.push({
    kind:wf ? 'trace' : 'legacy', key:'unattributed', indices:extra,
    value:{...evidence.execution,name:wf ? 'Additional recorded turns' : 'Single-agent trace',running:j.status==='running',failure:j.result?.failure?.error,tokens_used:evidence.execution?.put_tokens_used},
  });
  const selected = events.find(event=>event.key===selectedKey) || events[0];
  useEffect(()=>{ if (selected && jobUi) jobUi.selectedCallKey=selected.key; },[selected?.key]);
  const select = key => { setSelectedKey(key); if (jobUi) jobUi.selectedCallKey=key; };
  const keyboard = e => {
    const index=events.findIndex(event=>event.key===selected?.key);
    const next=e.key==='ArrowDown' ? Math.min(index+1,events.length-1) : e.key==='ArrowUp' ? Math.max(0,index-1) : e.key==='Home' ? 0 : e.key==='End' ? events.length-1 : null;
    if (next==null || !events[next]) return;
    e.preventDefault(); select(events[next].key); e.currentTarget.querySelectorAll('.call-row')[next]?.focus();
  };
  return html`<div class="execution-calls">
    ${Object.keys(evidence.resolved_inputs || {}).length ? html`<details><summary>Resolved scenario inputs</summary><${ReturnedValue} value=${evidence.resolved_inputs} /></details>` : null}
    <div class="meta">${events.length} execution record${events.length===1?'':'s'}</div>
    ${events.length ? html`<div class="call-browser">
      <div class="call-list" role="list" aria-label="Execution calls" onKeyDown=${keyboard}>
        ${events.map((event,index)=>html`<div role="listitem" key=${event.key}><button class=${`call-row${event.key===selected.key?' active':''}`} aria-current=${event.key===selected.key?'true':null} tabIndex=${event.key===selected.key?0:-1} onClick=${()=>select(event.key)}>
          <span class="meta">${index+1} · ${event.kind==='agent'?'run_agent':event.kind==='tool'?'call_tool':'trace'}</span><strong>${event.value.name || 'agent'}</strong>
          <span class="meta">${event.value.model ? `${shortModel(event.value.model)} · ` : ''}${callState(event)}</span>
        </button></div>`)}
      </div>
      <${CallDetail} key=${selected.key} event=${selected} turns=${turns} j=${j} />
    </div>` : html`<div class="meta">${j.status==='running' ? 'No calls yet. Calls appear here when the program makes them.' : 'No agent or tool calls were recorded.'}</div>`}
  </div>`;
}

// ---------------------------------------------------------------------
// Grades (caller judgment, recorded via PATCH) + Pareto frontier
// ---------------------------------------------------------------------
// Reserved measured axes: harness-computed, direction baked in. The
// name → direction pairs mirror core::frontier::RESERVED_AXES.
const RESERVED_AXES = [
  ['put_input_tokens','lower'], ['put_output_tokens','lower'], ['put_cache_read_tokens','higher'],
  ['put_cost_usd','lower'], ['sim_input_tokens','lower'], ['sim_output_tokens','lower'],
  ['sim_cache_read_tokens','higher'], ['sim_cost_usd','lower'],
  ['steps_per_trace_avg','lower'], ['steps_per_trace_min','lower'],
  ['steps_per_trace_max','lower'], ['steps_per_trace_stdev','lower'],
  ['elapsed_ms','lower'], ['resolving_inputs_ms','lower'], ['put_loop_ms','lower'],
];
const reservedDir = n => (RESERVED_AXES.find(([rn]) => rn === n) || [null, null])[1];
const SYSTEM_ATTRIBUTE_KEYS = new Set(['put_model', 'sim_model', 'put_thinking', 'sim_thinking', 'prompt_hash', 'workspace_hash', 'workflow_hash', 'simulation_backend', 'step_budget', 'token_budget', 'scenario_id', 'scenario_revision', 'scenario_hash']);
const jobAttributes = j => (j && j.attributes) || {};
const displayName = j => jobAttributes(j).label || (j.put && j.put.id) || (j.id || '').slice(0, 8);
const shortModel = value => value ? String(value).split('::').pop().split('/').pop() : '—';
const terminalExecution = j => j?.result?.trace?.execution || j?.progress?.execution || null;
const stopLabel = reason => ({ final_completion: 'finished', step_budget: 'step limit reached', token_budget: 'token limit reached', runtime_failure: 'execution failed' }[reason] || String(reason || '').replaceAll('_', ' '));
const totalUsageCost = usage => Number.isFinite(usage?.put?.cost_usd) && Number.isFinite(usage?.sim?.cost_usd) ? usage.put.cost_usd + usage.sim.cost_usd : null;
const reviewLabel = j => j?.assessment ? 'assessed' : Object.keys(j?.grades || {}).length ? 'graded' : 'needs review';
const evidenceCounts = j => {
  const trace = j?.result?.trace, turns = trace?.turns || j?.progress?.turns || [];
  return { turns: turns.length, tools: trace ? trace.tool_calls : turns.reduce((n, t) => n + (t.tool_exchanges || []).length, 0) };
};
const jobUsage = j => j?.result?.usage || j?.progress?.usage || null;
// Live or terminal orchestration evidence. The server puts submitted programs
// on the job view but execution evidence on progress/result, so read the
// evidence from either place. A custom workflow is what submitted a program (or
// resolved to the sentinel `put_model`), never merely "a trace with turns".
const workflowEvidence = j => (j && j.result && j.result.trace && j.result.trace.workflow) || (j && j.progress && j.progress.workflow) || null;
const isCustomWorkflow = j => !!(j && (j.workflow || j.put_model === 'workflow' || (workflowEvidence(j) && !(j.put && j.put.template))));
// An invocation's turn_start is inclusive, turn_end exclusive, into the flat
// Trace.turns list. Return null when the server did not record a usable range
// so callers fall back to the flat conversation rather than dropping turns.
const invocationTurnRange = invocation => {
  const start = invocation && invocation.turn_start, end = invocation && invocation.turn_end;
  return Number.isInteger(start) && Number.isInteger(end) && end >= start ? [start, end] : null;
};
const workflowEvents = workflow => {
  const invocations = (workflow && workflow.invocations) || [];
  const toolCalls = (workflow && workflow.tool_calls) || [];
  const events = [
    ...invocations.map((value, i) => ({ kind: 'agent', value, i })),
    ...toolCalls.map((value, i) => ({ kind: 'tool', value, i })),
  ];
  return events.length && events.every(event => Number.isInteger(event.value.event_id))
    ? [...events].sort((a, b) => a.value.event_id - b.value.event_id)
    : events;
};
// This key deliberately mirrors the frontier request: selected attribute values
// in order, with absent values kept distinct as null. The server remains the
// authority for group ids, labels, cohorts, arithmetic, and dominance.
const attributeValue = (attributes, key) => Object.prototype.hasOwnProperty.call(attributes || {}, key) ? attributes[key] : null;
const groupKeyFor = (groupBy, attributes) => JSON.stringify(groupBy.map(k => attributeValue(attributes, k)));
const fallbackGroupValue = (key, value) => {
  if (value == null) return 'null';
  if (key === 'put_model' || key === 'sim_model') return shortModel(value);
  if (key.endsWith('_hash')) return `${key.slice(0, -5).replaceAll('_','-')}-${String(value).slice(0,8)}`;
  return String(value);
};
const fallbackGroupLabel = (groupBy, attributes) => groupBy.length
  ? groupBy.map(k => fallbackGroupValue(k, attributeValue(attributes, k))).join('/')
  : 'all investigations';

// Preserve local drafts through live polling; save only keys changed against
// the editing baseline, retaining unrelated edits from concurrent callers.
// Cards are deliberately re-parented when the selected grouping changes.
// Keep editor drafts outside that component lifetime, keyed by job + editor,
// so an unsaved caller edit cannot disappear during a regroup or attribute
// change. App removes this small cache when the job is deleted.
function useMetadataDraft(source, jobUi, editor) {
  const asRows = map => Object.entries(map).map(([k, v]) => ({ k, v: String(v) }));
  const saved = jobUi.drafts.get(editor);
  const [rows, updateRows] = useState(() => saved ? saved.rows : asRows(source));
  const rowsRef = useRef(saved ? saved.rows : asRows(source));
  const baseline = useRef(saved ? saved.baseline : source);
  const dirty = useRef(saved ? saved.dirty : false);
  const persist = () => jobUi.drafts.set(editor, { rows: rowsRef.current, baseline: baseline.current, dirty: dirty.current });
  const reset = map => {
    baseline.current = map; dirty.current = false; rowsRef.current = asRows(map);
    persist(); updateRows(rowsRef.current);
  };
  useEffect(() => { if (!dirty.current) reset(source); }, [JSON.stringify(source)]);
  useEffect(() => () => persist(), []);
  const setRows = value => { dirty.current = true; rowsRef.current = value; persist(); updateRows(value); };
  return { rows, setRows, baseline, reset };
}
function metadataPatch(baseline, desired) {
  const patch = {};
  Object.entries(desired).forEach(([key, value]) => { if (baseline[key] !== value) patch[key] = value; });
  Object.keys(baseline).forEach(key => { if (!Object.prototype.hasOwnProperty.call(desired, key)) patch[key] = null; });
  return patch;
}

// Editable caller grades, merged with the live server map.
function GradesPanel({ j, token, onPatched, jobUi }) {
  const { rows, setRows, baseline, reset } = useMetadataDraft(j.grades || {}, jobUi, 'grades');
  const savedNew = jobUi.newFields.get('grades') || { k: '', v: '' };
  const [nk, updateNk] = useState(savedNew.k); const [nv, updateNv] = useState(savedNew.v);
  const setNk = value => { const old = jobUi.newFields.get('grades') || {}; jobUi.newFields.set('grades', { k: value, v: old.v || '' }); updateNk(value); };
  const setNv = value => { const old = jobUi.newFields.get('grades') || {}; jobUi.newFields.set('grades', { k: old.k || '', v: value }); updateNv(value); };
  const [msg, setMsg] = useState(null);
  const set = (i, f) => setRows(rows.map((r, x) => x === i ? { ...r, ...f } : r));
  const save = async () => {
    const grades = {};
    const seen = new Set();
    for (const r of rows.concat(nk ? [{ k: nk, v: nv }] : [])) {
      const key = r.k.trim();
      if (!key) continue;
      if (seen.has(key)) { setMsg({ err: `duplicate axis: ${key}` }); return; }
      seen.add(key);
      if (r.v === '' || r.v === null) { grades[key] = null; }
      else {
        const f = Number(r.v);
        if (!Number.isFinite(f)) { setMsg({ err: `${key}: not a number` }); return; }
        grades[key] = f;
      }
    }
    const patch = metadataPatch(baseline.current, grades);
    setMsg(null);
    try {
      const r = await fetch(API(j.id), { method: 'PATCH', headers: { ...authHeaders(token), 'content-type': 'application/json' }, body: JSON.stringify({ grades: patch }) });
      const body = await r.json().catch(() => ({}));
      if (r.ok) { reset(body.grades || {}); setNk(''); setNv(''); onPatched && onPatched(j.id, body); setMsg({ ok: 'saved' }); }
      else setMsg({ err: (body.problems || []).map(p => p.detail).join(' · ') || body.error || `HTTP ${r.status}` });
    } catch (e) { setMsg({ err: `request failed: ${e.message || e}` }); }
  };
  return html`
    <details style="margin-top:0.4rem">
      <summary class="meta">grades ${rows.length ? `· ${rows.length} axis${rows.length===1?'':'es'}` : ''} <span style="opacity:0.7">(caller judgment — PATCHed, then used by the frontier)</span></summary>
      <div style="margin:0.4rem 0 0.2rem">
        ${rows.map((r, i) => html`
          <div class="grade-row" key=${r.k}>
            <span class="name">${r.k}</span>
            <input type="text" value=${r.v} onInput=${e => set(i, { v: e.target.value })} />
            <button class="del" title="delete this axis" onClick=${() => setRows(rows.filter((_, x) => x !== i))}>✕</button>
          </div>`)}
        <div class="grade-row">
          <input type="text" placeholder="new_axis_name" value=${nk} onInput=${e => setNk(e.target.value)} style="min-width:11em" />
          <input type="text" placeholder="value" value=${nv} onInput=${e => setNv(e.target.value)} />
          <button class="del" title="add" onClick=${() => { if (nk) { setRows(rows.concat([{ k: nk, v: nv }])); setNk(''); setNv(''); } }}>＋</button>
        </div>
        <div class="grow" style="margin-top:0.35rem">
          <button onClick=${save}>save grades</button>
          ${msg?.ok ? html`<span class="meta" style="color:var(--green)">✓ ${msg.ok}</span>` : null}
          ${msg?.err ? html`<span class="note">${msg.err}</span>` : null}
        </div>
      </div>
    </details>`;
}

// Assessments are caller-owned reading notes, never a harness verdict. Store their
// unsaved text in the same per-job cache used by grades so polling/regrouping does
// not erase a reader's work.
function AssessmentPanel({ j, token, onPatched, jobUi }) {
  const saved = jobUi.drafts.get('assessment');
  const live = j.assessment || { summary: '', rubric: '', evidence: [] };
  const initial = { summary: saved?.summary ?? live.summary ?? '', rubric: saved?.rubric ?? live.rubric ?? '', evidence: saved?.evidence ?? pretty(live.evidence || []) };
  const values = useRef(initial);
  const [summary, setSummary] = useState(initial.summary);
  const [rubric, setRubric] = useState(initial.rubric);
  const [evidence, setEvidence] = useState(initial.evidence);
  const [msg, setMsg] = useState(null);
  const dirty = useRef(saved?.dirty || false);
  const persist = () => jobUi.drafts.set('assessment', { ...values.current, dirty: dirty.current });
  useEffect(() => () => persist(), []);
  useEffect(() => {
    if (!dirty.current) { const next = { summary: live.summary || '', rubric: live.rubric || '', evidence: pretty(live.evidence || []) }; values.current = next; setSummary(next.summary); setRubric(next.rubric); setEvidence(next.evidence); }
  }, [JSON.stringify(j.assessment)]);
  const change = (setter, key) => e => { dirty.current = true; const value = e.target.value; values.current = { ...values.current, [key]: value }; setter(value); persist(); };
  const send = async clear => {
    let assessment = null;
    if (!clear) {
      let parsed;
      try { parsed = JSON.parse(evidence); } catch (e) { setMsg({ err: `evidence must be JSON: ${e.message}` }); return; }
      if (!Array.isArray(parsed)) { setMsg({ err: 'evidence must be a JSON array' }); return; }
      if (parsed.length > 256) { setMsg({ err: 'evidence may contain at most 256 references' }); return; }
      const utf8 = text => new TextEncoder().encode(String(text == null ? '' : text)).length;
      const totalText = utf8(summary) + utf8(rubric) + parsed.reduce((n, item) => n + utf8(item && item.note), 0);
      if (totalText > 65536) { setMsg({ err: 'summary, rubric, and evidence notes must total at most 65,536 UTF-8 bytes' }); return; }
      assessment = { summary, rubric, evidence: parsed };
    }
