    setMsg(null);
    try {
      const r = await fetch(API(j.id), { method: 'PATCH', headers: { ...authHeaders(token), 'content-type': 'application/json' }, body: JSON.stringify({ assessment }) });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) { setMsg({ err: (body.problems || []).map(p => p.detail).join(' · ') || body.error || `HTTP ${r.status}` }); return; }
      dirty.current = false; jobUi.drafts.delete('assessment');
      const next = { summary: body.assessment?.summary || '', rubric: body.assessment?.rubric || '', evidence: pretty(body.assessment?.evidence || []) }; values.current = next;
      setSummary(next.summary); setRubric(next.rubric); setEvidence(next.evidence);
      onPatched && onPatched(j.id, body); setMsg({ ok: clear ? 'cleared' : 'saved' });
    } catch (e) { setMsg({ err: `request failed: ${e.message || e}` }); }
  };
  return html`<details style="margin-top:0.4rem"><summary class="meta">assessment <span style="opacity:.7">(caller-owned reading notes; no automatic grade)</span></summary>
    <div class="meta">Saving notes does not change grades. If this assessment overturns an earlier judgment, clear or revise its stale scores before comparing on the frontier.</div>
    <div style="margin:.4rem 0"><label class="meta">summary<textarea aria-label="assessment summary" value=${summary} onInput=${change(setSummary, 'summary')} /></label>
    <label class="meta">rubric<textarea aria-label="assessment rubric" value=${rubric} onInput=${change(setRubric, 'rubric')} /></label>
    <label class="meta">evidence JSON <span class="mono">[{"turn":0,"exchange":null,"note":"…"}]</span><textarea aria-label="assessment evidence JSON" value=${evidence} onInput=${change(setEvidence, 'evidence')} /></label>
    <div class="grow"><button onClick=${() => send(false)}>save assessment</button><button onClick=${() => send(true)}>clear assessment</button>${msg?.ok ? html`<span class="meta" style="color:var(--green)">✓ ${msg.ok}</span>` : null}${msg?.err ? html`<span class="note">${msg.err}</span>` : null}</div></div>
  </details>`;
}

// Attributes describe a variant and are also the grouping dimensions for the live
// frontier. System attributes are provenance emitted by the server, never editable.
function AttributesPanel({ j, token, onPatched, jobUi }) {
  const editable = map => Object.fromEntries(Object.entries(map).filter(([k]) => !SYSTEM_ATTRIBUTE_KEYS.has(k)));
  const { rows, setRows, baseline, reset } = useMetadataDraft(editable(jobAttributes(j)), jobUi, 'attributes');
  const savedNew = jobUi.newFields.get('attributes') || { k: '', v: '' };
  const [nk, updateNk] = useState(savedNew.k); const [nv, updateNv] = useState(savedNew.v);
  const setNk = value => { const old = jobUi.newFields.get('attributes') || {}; jobUi.newFields.set('attributes', { k: value, v: old.v || '' }); updateNk(value); };
  const setNv = value => { const old = jobUi.newFields.get('attributes') || {}; jobUi.newFields.set('attributes', { k: old.k || '', v: value }); updateNv(value); };
  const [msg, setMsg] = useState(null);
  const set = (i, f) => setRows(rows.map((r, x) => x === i ? { ...r, ...f } : r));
  const save = async () => {
    const attributes = {};
    const desired = rows.concat(nk ? [{ k: nk, v: nv }] : []);
    const seen = new Set();
    for (const r of desired) {
      const key = r.k.trim();
      if (!key) continue;
      if (SYSTEM_ATTRIBUTE_KEYS.has(key)) { setMsg({ err: `${key} is server-generated and cannot be changed` }); return; }
      if (seen.has(key)) { setMsg({ err: `duplicate attribute key: ${key}` }); return; }
      seen.add(key);
      // Empty is a valid, distinct attribute value. Only removing this row emits
      // null for an old key below; do not turn an intentional empty string
      // into a missing/null grouping value.
      attributes[key] = r.v;
    }
    const patch = metadataPatch(baseline.current, attributes);
    setMsg(null);
    try {
      const r = await fetch(API(j.id), { method: 'PATCH', headers: { ...authHeaders(token), 'content-type': 'application/json' }, body: JSON.stringify({ attributes: patch }) });
      const body = await r.json().catch(() => ({}));
      if (r.ok) { reset(editable(body.attributes || {})); onPatched && onPatched(j.id, body); setMsg({ ok: 'saved' }); setNk(''); setNv(''); }
      else setMsg({ err: (body.problems || []).map(p => p.detail).join(' · ') || body.error || `HTTP ${r.status}` });
    } catch (e) { setMsg({ err: `request failed: ${e.message || e}` }); }
  };
  const system = Object.entries(jobAttributes(j)).filter(([k]) => SYSTEM_ATTRIBUTE_KEYS.has(k));
  return html`<details style="margin-top:0.4rem">
    <summary class="meta">attributes <span style="opacity:0.7">(group variants and set this card's label)</span></summary>
    <div style="margin:0.4rem 0 0.2rem">
      ${system.length ? html`<div class="meta" style="margin-bottom:0.25rem">system provenance — read-only</div>
        ${system.map(([k, v]) => html`<div class="attribute-row" key=${k}><span class="system-attribute">${k}</span><span class="system-attribute meta">${v}</span><span class="meta">🔒</span></div>`)}` : html`<div class="meta">No system attributes returned yet.</div>`}
      <div class="meta" style="margin:0.45rem 0 0.2rem">custom attributes</div>
      ${rows.map((r, i) => html`<div class="attribute-row" key=${i}>
        <input type="text" value=${r.k} placeholder="attribute name" onInput=${e => set(i, { k: e.target.value })} />
        <input type="text" value=${r.v} placeholder="value" onInput=${e => set(i, { v: e.target.value })} />
        <button class="del" title="delete attribute" onClick=${() => setRows(rows.filter((_, x) => x !== i))}>✕</button>
      </div>`) }
      <div class="attribute-row"><input type="text" placeholder="new attribute name" value=${nk} onInput=${e => setNk(e.target.value)} /><input type="text" placeholder="value" value=${nv} onInput=${e => setNv(e.target.value)} /><button class="del" title="add attribute" onClick=${() => { if (nk.trim()) { setRows(rows.concat([{ k: nk, v: nv }])); setNk(''); setNv(''); } }}>＋</button></div>
      <div class="grow" style="margin-top:0.35rem"><button onClick=${save}>save attributes</button>${msg?.ok ? html`<span class="meta" style="color:var(--green)">✓ ${msg.ok}</span>` : null}${msg?.err ? html`<span class="note">${msg.err}</span>` : null}</div>
    </div>
  </details>`;
}

// The frontier panel compares every job, grouped by attribute values; the server
// owns cohort construction and dominance so no client-side candidate filter
// can silently change the comparison.
function FrontierPanel({ jobs, token, groupBy, setGroupBy, axes, setAxes, dirs, setDirs, activeGroupId, onActiveGroup, onGroupActivate, onOpenJob, onPlotChange }) {
  const allJobs = jobs || [];
  const [plot, setPlot] = useState(null);
  const [err, setErr] = useState(null);
  const svgRef = useRef(null);
  // System provenance keys always exist on real jobs; include them even before
  // the first job arrives. Caller attributes appear as soon as any investigation
  // carries them. Grouping is deliberately selected, never free-typed.
  const knownAttributeKeys = [...new Set([...SYSTEM_ATTRIBUTE_KEYS, ...groupBy, ...allJobs.flatMap(j => Object.keys(jobAttributes(j)))])].sort();
  const gradedNames = [...new Set(allJobs.flatMap(j => Object.keys(j.grades || {})))];
  const options = [...new Set(RESERVED_AXES.map(([n]) => n).concat(gradedNames.filter(n => !reservedDir(n)), axes.filter(Boolean)))];
  const names = [];
  axes.forEach(a => {
    if (a) { names.push(a); return; }
    const used = new Set(names);
    names.push(gradedNames.find(g => !reservedDir(g) && !used.has(g))
      || options.find(o => !used.has(o)) || 'steps_per_trace_avg');
  });
  const dirOf = n => reservedDir(n) || dirs[n] || 'higher';
  const setDir = (n, d) => setDirs({ ...dirs, [n]: d });
  // This includes completed jobs too: a caller can PATCH grades/attributes after a
  // run, and these are exactly the result fields used by measured axes. Keep
  // trace bodies out of the dependency key: a large evidence corpus should
  // not be repeatedly serialized just to refresh a small frontier request.
  const measuredSummary = j => {
    const result = j.result;
    if (!result) return null;
    return {
      // Live spend while a run is in flight (progress.usage), frozen totals once
      // it finishes (result.usage). Both are the same numbers.
      usage: result.usage || j.progress?.usage || null,
      // A single-conversation investigation has at most one terminal trace.
      // Its steps are completion boundaries (one per turn) or tool calls.
      steps_per_trace: result.trace ? [(result.trace.turns || [])
        .reduce((steps, turn) => steps + Math.max((turn.tool_exchanges || []).length, 1), 0)] : [],
      // Timing is a measured frontier input too. Include it in the polling
      // dependency key so a finished trace's late/frozen execution metadata
      // refreshes the frontier without serializing full evidence bodies.
      execution_timing: result.trace?.execution?.timing || null,
    };
  };
  const jobsKey = JSON.stringify(allJobs.map(j => [j.id, j.status, j.attributes, j.grades, measuredSummary(j)]));
  const groupKey = JSON.stringify(groupBy);
  const namesKey = JSON.stringify(names);
  // Resolve dynamic default axes once, then share the ACTUAL rendered choices.
  // Persisting an empty placeholder would choose a different grade on reload.
  useEffect(() => { if (axes.some(a => !a)) setAxes(names); }, [namesKey]);
  const dirsKey = JSON.stringify(names.map(n => dirOf(n)));
  const seq = useRef(0);
  useEffect(() => {
    const controller = new AbortController();
    const mySeq = ++seq.current;
    if (!allJobs.length) { setPlot({ points: [], svg: null }); setErr(null); return () => controller.abort(); }
    const body = {
      group_by: groupBy.map(k => k.trim()).filter(Boolean),
      axes: names.map(n => ({ name: n, better: dirOf(n) })),
    };
    const headers = { ...authHeaders(token), 'content-type': 'application/json' };
    (async () => {
      try {
        const two = names.length === 2;
        const [jsonR, svgR] = await Promise.all([
          fetch('/api/frontier?format=json', { method: 'POST', headers, body: JSON.stringify(body), signal: controller.signal }),
          two ? fetch('/api/frontier?format=svg', { method: 'POST', headers, body: JSON.stringify(body), signal: controller.signal }) : Promise.resolve(null),
        ]);
        if (!jsonR.ok || (svgR && !svgR.ok)) {
          const b = await jsonR.json().catch(() => ({}));
          if (mySeq === seq.current && !controller.signal.aborted) {
            setPlot(null); setErr(b.problems || [{ reason: b.error || 'error', detail: `HTTP ${jsonR.status}` }]);
          }
          return;
        }
        const json = await jsonR.json();
        const svg = svgR ? await svgR.text() : null;
        if (mySeq === seq.current && !controller.signal.aborted) { setErr(null); setPlot({ points: json.points || [], svg }); }
      } catch (e) {
        if (e.name !== 'AbortError' && mySeq === seq.current && !controller.signal.aborted) setErr([{ reason: 'request failed', detail: String(e) }]);
      }
    })();
    return () => controller.abort();
  }, [jobsKey, groupKey, namesKey, dirsKey, token]);

  // The generated SVG has stable data-group-id attributes on both marker and
  // PCA-ordered legend entry. Delegate through the containing HTML element so
  // replacing server-provided SVG markup never loses the cross-link handlers.
  const svgGroup = target => target && target.closest && target.closest('[data-group-id]');
  const svgId = event => { const group = svgGroup(event.target); return group && group.getAttribute('data-group-id'); };
  const svgEnter = event => { const id = svgId(event); if (id) onActiveGroup(id); };
  const svgLeave = event => {
    const from = svgGroup(event.target), to = svgGroup(event.relatedTarget);
    if (from && from !== to) onActiveGroup(null);
  };
  const svgActivate = event => {
    const id = svgId(event);
    if (id) { event.preventDefault(); onGroupActivate(id); }
  };
  const svgKeydown = event => {
    if ((event.key === 'Enter' || event.key === ' ') && svgId(event)) svgActivate(event);
  };
  // A ref callback binds once to the stable HTML container. Unlike a handler
  // on injected SVG nodes, these listeners survive replacement of its markup.
  const bindSvg = host => {
    svgRef.current = host;
    if (!host || host.__peFrontierBindings) return;
    host.__peFrontierBindings = true;
    // Use the same mouse event family as card/table enter/leave handlers:
    // pointerover fires before the previous element's mouseleave and would
    // have its new highlight immediately cleared by that later event.
    host.addEventListener('mouseover', svgEnter);
    host.addEventListener('mouseout', svgLeave);
    host.addEventListener('focusin', svgEnter);
    host.addEventListener('focusout', svgLeave);
    host.addEventListener('click', svgActivate);
    host.addEventListener('keydown', svgKeydown);
  };
  useEffect(() => {
    const host = svgRef.current;
    if (!host) return;
    const svg = host.querySelector('svg');
    // The standalone SVG deliberately carries a printable text backlog. The
    // dashboard has a richer review queue and data table for the same evidence,
    // so crop the embedded plot at that section rather than duplicating pages
    // of pending records below the graph. The API SVG itself is unchanged.
    if (svg) {
      const marker = [...svg.children].find(el => el.tagName === 'text' && (el.textContent || '').startsWith('pending / preliminary backlog'));
      const cutoff = marker && Number(marker.getAttribute('y'));
      if (Number.isFinite(cutoff)) {
        const height = Math.max(1, cutoff - 12), viewBox = (svg.getAttribute('viewBox') || '').trim().split(/\s+/);
        const children = [...svg.children], markerIndex = children.indexOf(marker);
        children.slice(markerIndex).forEach(node => node.remove());
        svg.setAttribute('height', String(height));
        if (viewBox.length === 4) { viewBox[3] = String(height); svg.setAttribute('viewBox', viewBox.join(' ')); }
      }
    }
    host.querySelectorAll('[data-group-id]').forEach(el => {
      const match = el.getAttribute('data-group-id') === activeGroupId;
      el.classList.toggle('pe-linked-active', !!activeGroupId && match);
      el.classList.toggle('pe-linked-muted', !!activeGroupId && !match);
      el.style.opacity = activeGroupId ? (match ? '1' : '.18') : '';
    });
  }, [plot && plot.svg, activeGroupId]);

  useEffect(() => { onPlotChange(plot ? plot.points : []); }, [plot, onPlotChange]);

  const axisRow = i => {
    const name = names[i];
    const rowOpts = options.filter(o => !names.some((n, x) => x !== i && n === o));
    return html`<div class="axis-grid" key=${i}>
      <span class="meta">${i === 0 ? 'x axis' : i === 1 ? 'y axis' : `axis ${i + 1}`}</span>
      <select value=${name} onChange=${e => setAxes(axes.map((a, x) => x === i ? e.target.value : a))}>
        ${rowOpts.map(o => html`<option value=${o} key=${o}>${o}${reservedDir(o) ? '' : ' (graded)'}</option>`)}
      </select>
      ${reservedDir(name)
        ? html`<span class="meta" title="reserved measured axis — direction is baked in">${reservedDir(name)} is better 🔒</span>`
        : html`<select value=${dirOf(name)} onChange=${e => setDir(name, e.target.value)}><option value="higher">higher is better</option><option value="lower">lower is better</option></select>`}
      <button class="del" title="remove this axis" disabled=${axes.length <= 1} onClick=${() => setAxes(axes.filter((_, x) => x !== i))}>✕</button>
    </div>`;
  };
  const groupOptionsFor = i => knownAttributeKeys.filter(k => groupBy[i] === k || !groupBy.some((selected, x) => x !== i && selected === k));
  const unusedAttributeKeys = knownAttributeKeys.filter(k => !groupBy.includes(k));
  const addGroupingAttribute = () => { if (unusedAttributeKeys.length) setGroupBy(groupBy.concat([unusedAttributeKeys[0]])); };
  const transposeAxes = () => {
    if (axes.length < 2) return;
    setAxes([axes[1], axes[0], ...axes.slice(2)]);
  };
  const counts = point => (point.excluded || []).reduce((out, e) => ({ ...out, [e.status]: (out[e.status] || 0) + 1 }), {});
  const groupAttributeText = point => groupBy.length
    ? groupBy.map(k => `${k}=${point.attributes && point.attributes[k] != null ? point.attributes[k] : 'null'}`).join(' · ')
    : 'all investigations';
  const backlog = (plot && plot.points || []).flatMap(point => (point.excluded || []).map(e => ({ point, ...e })));

  return html`<section class="surface frontier-panel">
    <div class="panel-head"><div><h2>Grouped Pareto frontier</h2><div class="configuration-summary">${groupBy.length ? groupBy.join(' / ') : 'one group'} · ${names.map(n => `${n} ${dirOf(n) === 'higher' ? '↑' : '↓'}`).join(' · ')}</div></div>
      <div class="panel-actions">${backlog.length ? html`<button class="toggle pending" onClick=${() => { const panel = document.getElementById('frontier-backlog'); if (panel) { panel.open = true; panel.scrollIntoView({behavior:'smooth',block:'start'}); } }}>${backlog.length} need attention</button>` : null}</div>
    </div>
    <details class="help-panel"><summary>How grouping, cohorts, and preliminary points work</summary><div class="meta" style="margin:.45rem 0">Every investigation remains a candidate. Matching attribute values form one point; every coordinate is a mean over the same completed investigations with every requested value. Preliminary points have excluded members; pending groups have no usable common cohort. Group by simulator/backend provenance when it affects comparability.</div></details>
    <details class="config-panel"><summary>Configure comparison</summary>
    <div style="margin:0.65rem 0">
      <div class="meta">group by attributes <span style="opacity:0.7">(empty = one group; missing values become null)</span></div>
      ${groupBy.map((key, i) => html`<div class="grow" key=${i} style="margin:0.2rem 0">
        <select aria-label=${`grouping attribute ${i + 1}`} value=${key} onChange=${e => setGroupBy(groupBy.map((k, x) => x === i ? e.target.value : k))}>
          ${groupOptionsFor(i).map(k => html`<option value=${k} key=${k}>${k}</option>`)}
        </select>
        <button class="del" title="remove grouping attribute" onClick=${() => setGroupBy(groupBy.filter((_, x) => x !== i))}>✕</button>
      </div>`)}
      <button class="toggle" disabled=${!unusedAttributeKeys.length} title=${unusedAttributeKeys.length ? 'add another grouping dimension' : 'all available attribute keys are already selected'} onClick=${addGroupingAttribute}>+ grouping attribute</button>
    </div>
    <div style="margin:0.45rem 0">${axes.map((_, i) => axisRow(i))}
      <div class="grow" style="margin-top:0.3rem">
        <button class="toggle" aria-label="transpose plot axes" disabled=${axes.length < 2} onClick=${transposeAxes} title="swap the x and y axes; each metric keeps its better-direction">⇄ transpose x / y</button>
        <button class="toggle" onClick=${() => setAxes(axes.concat(['']))} title="dominance supports N axes; SVG is two-axis only">+ axis</button>
      </div>
    </div>
    <div class="meta" style="margin:0.45rem 0;opacity:0.75">${names.length === 2 ? 'The plot shows two axes; the data table and dominance calculation support any number.' : `${names.length} axes — N-dimensional dominance; the plot is available at exactly two axes.`}</div>
    </details>
    ${err ? html`<div class="frontier-err">${err.map((p, i) => html`<div key=${i}><span class="reason">${p.reason}</span><div class="meta">${p.detail}</div></div>`)}</div>` : null}
    ${plot && plot.svg ? html`<div ref=${bindSvg} class="frontier-svg" dangerouslySetInnerHTML=${{ __html: plot.svg }}></div>` : null}
    ${plot ? html`<details class="data-panel"><summary>Data table · ${plot.points.length} group${plot.points.length === 1 ? '' : 's'}</summary><table class="ptable"><thead><tr><th>group</th>${names.map(n => html`<th key=${n} class="mono">${n}</th>`)}<th>rank</th><th>counts</th></tr></thead>
      <tbody>${plot.points.map(p => { const c = counts(p); return html`<tr key=${p.id}
        onMouseEnter=${() => onActiveGroup(p.id)} onMouseLeave=${() => onActiveGroup(null)}
        onFocusIn=${() => onActiveGroup(p.id)} onFocusOut=${e => { if (!e.currentTarget.contains(e.relatedTarget)) onActiveGroup(null); }}
        onClick=${e => {
          // Member links and disclosure controls have their own navigation/
          // toggling behavior; only a click on table evidence selects a group.
          if (e.target.closest('a,button,summary,details,input,select,textarea,label')) return;
          onGroupActivate(p.id);
        }}>
        <td class="group-label"><b class="mono" title=${`stable id: ${p.id}`}>${p.label}</b><div class="meta mono">${groupAttributeText(p)}</div></td>
        ${names.map(n => html`<td key=${n} class="mono">${p.values ? fmtAxisVal(p.values[n]) : 'pending — not plotted'}</td>`)}
        <td>${p.on_frontier === null ? html`<span class="pending">pending</span>` : p.on_frontier ? html`<span class="nd">frontier${p.preliminary ? ' · preliminary' : ''}</span>` : html`<span class="dom">dominated${p.preliminary ? ' · preliminary' : ''}</span>`}<div class="meta mono">${(p.dominated_by || []).join(', ') || '—'}</div></td>
        <td><div class="group-counts"><span class="group-count">included ${((p.included || []).length)}</span>${['running','awaiting_grades','failed','unavailable'].filter(s => c[s]).map(s => html`<span class=${`group-count ${s === 'running' || s === 'awaiting_grades' ? 'pending' : 'unavailable'}`} key=${s}>${s.replace('_',' ')} ${c[s] || 0}</span>`)}</div>
          <details><summary>members ${((p.investigations || []).length)}</summary><div class="mono meta">${(p.investigations || []).map(id => html`<div key=${id}><a href=${`#job-${id}`} onClick=${e => { e.preventDefault(); onOpenJob(id); }}>${id}</a></div>`)}</div></details></td>
      </tr>`; })}</tbody></table></details>` : null}
    ${backlog.length ? html`<details id="frontier-backlog" class="backlog-panel"><summary class="pending">Review queue · ${backlog.length} investigation${backlog.length === 1 ? '' : 's'} needs attention</summary>
      <div class="meta" style="margin:0.35rem 0">These exact members are not in the common complete cohort yet. Grade the linked job when grades are missing; running, failed, and unavailable jobs remain distinct evidence.</div>
      ${backlog.map(e => html`<div class="step" key=${`${e.point.id}-${e.investigation}`}><a href=${`#job-${e.investigation}`} onClick=${event => { event.preventDefault(); onOpenJob(e.investigation); }} class="mono">${e.investigation}</a> · <b class=${e.status === 'awaiting_grades' || e.status === 'running' ? 'pending' : 'unavailable'}>${e.status.replace('_', ' ')}</b>${e.missing_grades && e.missing_grades.length ? html` · missing grades: <span class="mono">${e.missing_grades.join(', ')}</span>` : null}${e.missing_axes && e.missing_axes.length ? html` · missing axes: <span class="mono">${e.missing_axes.join(', ')}</span>` : null}<div class="meta">group: ${e.point.label}</div></div>`) }
    </details>` : null}
  </section>`;
}

function jobUiState(uiCache, id) {
  let state = uiCache.current.get(id);
  if (!state) {
    state = { drafts: new Map(), newFields: new Map(), details: null };
    uiCache.current.set(id, state);
  }
  return state;
}

// Native <details> elements otherwise forget their open state when a keyed card
// moves to another group parent. Record all nested disclosure states in the same
// per-job cache as editor drafts and restore them on the new card instance.
function usePreservedDetails(jobUi) {
  const root = useRef(null);
  useEffect(() => {
    const host = root.current;
    if (!host) return;
    const disclosures = () => [...host.querySelectorAll('details')];
    if (jobUi.details) disclosures().forEach((detail, index) => {
      if (index < jobUi.details.length) detail.open = jobUi.details[index];
    });
    const save = () => { jobUi.details = disclosures().map(detail => detail.open); };
    host.addEventListener('toggle', save, true);
    return () => { save(); host.removeEventListener('toggle', save, true); };
  }, []);
  return root;
}

function ControlsPanel({ controls }) {
  if (!controls) return html`<div class="meta">resolved conversation controls unavailable for this older job fixture.</div>`;
  const lua = controls.lua_simulation;
  return html`<details><summary class="meta">Agent defaults and simulation settings</summary><div class="step">${pretty(controls)}</div><div class="meta">simulator backend: ${lua == null ? 'LLM-only' : 'Lua experimental'}; source/output remain evidence, not a fidelity judgment.</div></details>`;
}
function EvidenceDownload({ id, token }) {
  const [msg, setMsg] = useState('');
  const [raw, setRaw] = useState(null);
  const load = async () => {
    if (raw != null) return raw;
    setMsg('fetching evidence…');
    try {
      const r = await fetch(`${API(id)}/evidence`, { headers: authHeaders(token) });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const body = await r.json(); setRaw(body); setMsg(''); return body;
    } catch (e) { setMsg(`evidence failed: ${e.message || e}`); return null; }
  };
  const download = async () => {
    const body = await load(); if (body == null) return;
    const blob = new Blob([JSON.stringify(body, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = `investigation-${id}-evidence.json`; a.click(); URL.revokeObjectURL(url); setMsg('downloaded');
  };
  return html`<div>
    <div class="grow" style="margin:.35rem 0"><button onClick=${download}>download evidence JSON</button><span class="meta">authenticated; no token is put in the link</span>${msg ? html`<span class="meta">${msg}</span>` : null}</div>
    <details onToggle=${e => { if (e.currentTarget.open) load(); }}><summary>raw evidence JSON · complete API representation</summary>
      ${raw == null ? html`<div class="meta">${msg || 'loading…'}</div>` : html`<pre class="raw-json">${pretty(raw)}</pre>`}
    </details>
  </div>`;
}
function ScenarioWorkspaceDownload({ id, token }) {
  const [msg, setMsg] = useState('');
  const download = async () => {
    setMsg('fetching…');
    try {
      const r = await fetch(`/api/scenarios/${encodeURIComponent(id)}/workspace`, { headers: authHeaders(token) });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const blob = await r.blob(), url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = `scenario-${id}-workspace.zip`; a.click(); URL.revokeObjectURL(url); setMsg('downloaded');
    } catch (e) { setMsg(`download failed: ${e.message || e}`); }
  };
  return html`<span><button class="toggle" onClick=${download}>export workspace</button>${msg ? html`<span class="meta" style="margin-left:.35rem">${msg}</span>` : null}</span>`;
}
function currentLuaSource(job) {
  const list = job?.result?.trace?.implementations || job?.progress?.implementations || [];
  if (!list.length) return { path: null, revision: null, source: null };
  // Several tools may be implemented; show them together, each labeled.
  return {
    path: list.map(i => i.tool).join(', '),
    revision: list[0].source_hash ? list[0].source_hash.slice(0, 8) : null,
    source: list.map(i => `-- ${i.tool} (${(i.source_hash || '').slice(0, 8)})\n${i.source}`).join('\n\n'),
  };
}
function SourceComparison({ j, jobs }) {
  const candidates = (jobs || []).filter(x => x.id !== j.id && currentLuaSource(x).source != null);
  const [otherId, setOtherId] = useState(() => candidates[0]?.id || '');
  const selectedId = candidates.some(x => x.id === otherId) ? otherId : candidates[0]?.id || '';
  const mine = currentLuaSource(j), other = currentLuaSource(candidates.find(x => x.id === selectedId));
  if (mine.source == null || !candidates.length) return null;
  return html`<details><summary>compare tool simulation code with another investigation</summary><div class="meta">Side-by-side source evidence only; it does not judge fidelity or program equivalence.</div>
    <select aria-label="comparison investigation" value=${selectedId} onChange=${e => setOtherId(e.target.value)}>${candidates.map(x => html`<option value=${x.id}>${displayName(x)} · ${x.id.slice(0,8)}</option>`)}</select>
    <div class="source-compare"><div><b class="meta">this job · supplied Lua · ${mine.path || '—'} · ${mine.revision || '—'}</b><${SourceCode} source=${mine.source} /></div>
      <div><b class="meta">other job · supplied Lua · ${other?.path || '—'} · ${other?.revision || '—'}</b><${SourceCode} source=${other?.source || ''} /></div></div>
  </details>`;
}

function JobCard({ j, jobs, token, onDelete, onPatched, leaving, uiCache, onBack }) {
  const jobUi = jobUiState(uiCache, j.id);
  const detailRef = usePreservedDetails(jobUi);
  const attributes = jobAttributes(j);

  const putThinking = attributes.put_thinking || j.put_thinking_level;
  const trace = j.result && j.result.trace;
  const execution = terminalExecution(j);
  const counts = evidenceCounts(j);
  const usage = jobUsage(j);
  const totalCost = totalUsageCost(usage);
  const customWorkflow = isCustomWorkflow(j);
  const wf = workflowEvidence(j);
  return html`<div ref=${detailRef} id=${`job-${j.id}`} class=${`job-detail${leaving ? ' leaving' : ''}`} key=${j.id}>
    <div class="detail-title">
      <button class="toggle" onClick=${onBack}>close detail</button>
      <div><h2>${displayName(j)}</h2><div class="meta mono">${j.id}</div></div>
      <div class="detail-actions">

      </div>
    </div>
    <div class="detail-summary">
      <div class="summary-item"><span class="label">execution</span><span class="value"><span class=${`badge ${j.status === 'done' ? 'job-done' : j.status}`}>${j.status === 'done' ? 'recorded' : j.status}</span> ${execution?.stop_reason ? stopLabel(execution.stop_reason) : j.phase ? phaseLabel(j.phase) : ''}</span></div>
      <div class="summary-item"><span class="label">review</span><span class=${`value ${reviewLabel(j) === 'needs review' ? 'pending' : ''}`}>${reviewLabel(j)}${Object.keys(j.grades || {}).length ? ` · ${Object.keys(j.grades).length} grade${Object.keys(j.grades).length === 1 ? '' : 's'}` : ''}</span></div>
      ${customWorkflow
        ? html`<div class="summary-item"><span class="label">workflow</span><span class="value">${wf ? `${(wf.invocations || []).length} agent stage${(wf.invocations || []).length === 1 ? '' : 's'} · ${(wf.tool_calls || []).length} program tool call${(wf.tool_calls || []).length === 1 ? '' : 's'}` : 'program'}</span></div>`
        : html`<div class="summary-item"><span class="label">model</span><span class="value" title=${putModel || ''}>${shortModel(putModel)}${putThinking ? ` · ${putThinking}` : ''}</span></div>`}
      <div class="summary-item"><span class="label">scenario</span><span class="value mono">${j.scenario_id ? `${j.scenario_id.slice(0,8)} · r${j.scenario_revision}` : '—'}</span></div>
      <div class="summary-item"><span class="label">evidence</span><span class="value">${counts.turns} turn${counts.turns===1?'':'s'} · ${counts.tools} tool call${counts.tools===1?'':'s'}${totalCost != null ? fmtUsd(totalCost) : ' · cost unavailable'}</span></div>

      <${ReturnedOutputPanel} j=${j} />

    <section class="detail-section"><div class="panel-head"><h2>Execution</h2></div>
      <${RunStepsPanel} j=${j} jobUi=${jobUi} />
    </section>
    <section class="detail-section"><div class="panel-head"><h2>Your assessment</h2></div>
      <${AssessmentPanel} j=${j} token=${token} onPatched=${onPatched} jobUi=${jobUi} />
      <${GradesPanel} j=${j} token=${token} onPatched=${onPatched} jobUi=${jobUi} />
    </section>
    <section class="detail-section"><div class="panel-head"><h2>Configuration and exports</h2></div>
      <${Implementations} implementations=${j.result?.trace?.implementations || j.progress?.implementations} />

      ${(j.workflow || wf) ? html`<${WorkflowProgramPanel} program=${j.workflow} evidence=${wf} />` : null}
      ${trace?.final_world_state != null ? html`<details><summary>Final tool state (state patches)</summary><pre class="step">${pretty(trace.final_world_state)}</pre></details>` : null}
      <${ControlsPanel} controls=${j.conversation_controls} />

// The browser groups the cards using the exact attribute-vector request sent to
// /api/frontier. It does no cohort filtering: every job remains visible, so a
// pending or failed group is never hidden merely because it has no coordinate.
function JobRow({ j, onOpen, selected }) {
  const attributes = jobAttributes(j), execution = terminalExecution(j), usage = jobUsage(j), counts = evidenceCounts(j);
  const putModel = attributes.put_model || j.put_model;
  const customWorkflow = isCustomWorkflow(j);
  const wf = workflowEvidence(j);
  const cost = totalUsageCost(usage);
  const modelLine = customWorkflow
    ? `workflow orchestration${wf ? ` · ${(wf.invocations || []).length} stage${(wf.invocations || []).length === 1 ? '' : 's'}` : ''}`
    : `${shortModel(putModel)}${attributes.put_thinking ? ` · ${attributes.put_thinking}` : ''}`;
  return html`<button id=${`job-row-${j.id}`} class=${`job-row${selected ? ' active' : ''}`} aria-current=${selected ? 'true' : null} onClick=${() => onOpen(j.id)}>
    <span><span class=${`badge ${j.status === 'done' ? 'job-done' : j.status}`}>${j.status}</span><span class="meta" style="display:block;margin-top:.2rem">${execution?.stop_reason ? execution.stop_reason.replaceAll('_',' ') : j.phase ? phaseLabel(j.phase) : ''}</span></span>
    <span class="primary" title=${j.reason || ''}>
      <strong>${displayName(j)}</strong>
      <span class="row-meta mono">${j.id.slice(0,8)} · ${j.finished_at ? `finished ${relTime(j.finished_at)}` : `started ${relTime(j.started_at)}`}</span>
      <span class="row-meta">${modelLine} · <span class="mono">${j.scenario_id ? `${j.scenario_id.slice(0,8)} r${j.scenario_revision}` : 'no scenario'}</span></span>
      <span class=${`row-meta row-review ${reviewLabel(j) === 'needs review' ? 'pending' : ''}`}>${reviewLabel(j)} · ${cost != null ? `~$${cost < .01 ? cost.toFixed(4) : cost.toFixed(2)}` : `${counts.turns} turn${counts.turns===1?'':'s'} · cost unavailable`}</span>
    </span>
  </button>`;
}

function GroupedJobCards({ jobs, groupBy, points, activeGroupId, onActiveGroup, onOpen, selectedJobId }) {
  const pointByKey = new Map((points || []).map(p => [groupKeyFor(groupBy, p.attributes), p]));
  const groups = new Map();
  (jobs || []).forEach(j => {
    const key = groupKeyFor(groupBy, jobAttributes(j));
    if (!groups.has(key)) groups.set(key, { key, attributes: jobAttributes(j), jobs: [] });
    groups.get(key).jobs.push(j);
  });
  return html`<div class="job-list">
    ${[...groups.values()].map(g => {
      const point = pointByKey.get(g.key), pointId = point && point.id, active = pointId && pointId === activeGroupId;
      const enter = () => { if (pointId) onActiveGroup(pointId); }, leave = () => { if (pointId) onActiveGroup(null); };
      return html`<section key=${g.key} class=${`job-group${active ? ' active' : ''}`} id=${pointId ? `frontier-group-${pointId}` : null} data-job-group-id=${pointId || null}
        onMouseEnter=${enter} onMouseLeave=${leave} onFocusIn=${enter} onFocusOut=${e => { if (!e.currentTarget.contains(e.relatedTarget)) leave(); }}>
        <h2><span class="mono">${point ? point.label : fallbackGroupLabel(groupBy, g.attributes)}</span><span class="meta"> · ${g.jobs.length}${point && point.values == null ? ' · pending' : ''}</span></h2>
        ${g.jobs.map(j => html`<${JobRow} key=${j.id} j=${j} onOpen=${onOpen} selected=${selectedJobId === j.id} />`)}
      </section>`;
    })}
  </div>`;
}

const DEFAULT_GROUP_BY = ['put_model', 'put_thinking', 'prompt_hash'];
function readSharedState() {
  const q = new URL(window.location.href).searchParams, bad = [];
  const json = (name, fallback, check) => {
    if (!q.has(name)) return fallback;
    try { const v = JSON.parse(q.get(name)); if (!check(v)) throw new Error('wrong shape'); return v; }
    catch { bad.push(`${name} must be valid JSON of the documented shape`); return fallback; }
  };
  const validName = name => typeof name === 'string' && /^[a-z][a-z0-9_]{0,63}$/.test(name);
  const groupBy = json('group_by', DEFAULT_GROUP_BY, v => Array.isArray(v) && v.every(validName) && new Set(v).size === v.length);
  const axes = json('axes', [{ name: 'put_output_tokens', better: 'lower' }, { name: '', better: 'higher' }], v => Array.isArray(v) && v.length > 0 && v.every(x => x && validName(x.name) && (x.better === 'higher' || x.better === 'lower') && (!reservedDir(x.name) || reservedDir(x.name) === x.better)) && new Set(v.map(x => x.name)).size === v.length);
  const attributes = json('attributes', {}, v => v && !Array.isArray(v) && typeof v === 'object' && Object.keys(v).every(k => validName(k) && typeof v[k] === 'string' && new TextEncoder().encode(v[k]).length <= 1024));
  return { groupBy, axes, attributes, warning: bad.join('; ') };
}
function safeShareUrl() {
  const url = new URL(window.location.href);
  for (const key of [...url.searchParams.keys()]) {
    if (['token', 'api_token', 'authorization'].includes(key.toLowerCase())) url.searchParams.delete(key);
  }
  return url;
}
function writeSharedState(groupBy, axes, attributes, replace = false) {
  const url = safeShareUrl();
  url.searchParams.set('group_by', JSON.stringify(groupBy));
  url.searchParams.set('axes', JSON.stringify(axes));
  const keys = Object.keys(attributes);
  if (keys.length) url.searchParams.set('attributes', JSON.stringify(attributes)); else url.searchParams.delete('attributes');
  history[replace ? 'replaceState' : 'pushState'](null, '', url.pathname + url.search + url.hash);
}
function cardMatchesAttributes(job, filters) {
  const attrs = jobAttributes(job);
  return Object.entries(filters).every(([key, value]) => Object.prototype.hasOwnProperty.call(attrs, key) && attrs[key] === value);
}

/// Scenarios are reusable worlds: register once (narrative, tools with optional
/// Lua implementations, simulator settings, initial workspace), test with direct
/// tool-call probes, then reference the id from many investigations. This panel
/// is a workbench, not a judge: it shows responses, provenance and workspace
/// operations, and the caller decides whether the simulation is good enough.
function ScenarioPanel({ token }) {
  const [list, setList] = useState(null);
  const [selected, setSelected] = useState(null);
  const [detail, setDetail] = useState(null);
  const [probes, setProbes] = useState([]);
  const [calls, setCalls] = useState('[{"name": "lookup", "args": {"id": "A-1"}}]');
  const [msg, setMsg] = useState('');
  const [busy, setBusy] = useState(false);
  const load = async () => {
    try {
      const r = await fetch('/api/scenarios', { headers: authHeaders(token) });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const next = await r.json();
      setList(next);
      if (selected && !next.some(s => s.id === selected)) setSelected(null);
    } catch (e) { setMsg(`could not load scenarios: ${e.message || e}`); }
  };
  const loadDetail = async id => {
    try {
      const [d, p] = await Promise.all([
        fetch(`/api/scenarios/${encodeURIComponent(id)}`, { headers: authHeaders(token) }),
        fetch(`/api/scenarios/${encodeURIComponent(id)}/simulations`, { headers: authHeaders(token) }),
      ]);
      if (!d.ok) throw new Error(`scenario: HTTP ${d.status}`);
      setDetail(await d.json());
      setProbes(p.ok ? await p.json() : []);
    } catch (e) { setMsg(`could not load scenario ${id}: ${e.message || e}`); }
  };
  useEffect(() => { load(); }, [token]);
  useEffect(() => { if (selected) loadDetail(selected); else { setDetail(null); setProbes([]); } }, [selected, token]);
  useEffect(() => {
    if (!selected) return;
    if (!probes.some(probe => probe.status === 'running')) return;
    const timer = setTimeout(() => loadDetail(selected), 1200);
    return () => clearTimeout(timer);
  }, [selected, JSON.stringify(probes.map(p => [p.id, p.status]))]);
  const submitProbe = async () => {
    setMsg('');
    let parsed;
    try { parsed = JSON.parse(calls); } catch (e) { setMsg(`tool_calls is not valid JSON: ${e.message}`); return; }
    setBusy(true);
    try {
      const r = await fetch(`/api/scenarios/${encodeURIComponent(selected)}/simulations`, {
        method: 'POST',
        headers: { ...authHeaders(token), 'content-type': 'application/json' },
        body: JSON.stringify({ tool_calls: parsed }),
      });
      const body = await r.json().catch(() => null);
      if (!r.ok) throw new Error(body && body.error ? body.error : `HTTP ${r.status}`);
      await loadDetail(selected);
    } catch (e) { setMsg(`probe failed: ${e.message || e}`); } finally { setBusy(false); }
  };
  const forkSelected = async () => {
    setMsg('');
    try {
      const r = await fetch(`/api/scenarios/${encodeURIComponent(selected)}/fork`, {
        method: 'POST',
        headers: { ...authHeaders(token), 'content-type': 'application/json' },
        body: JSON.stringify({ expected_revision: detail.revision }),
      });
      const body = await r.json().catch(() => null);
      if (!r.ok) throw new Error(body && body.error ? body.error : `HTTP ${r.status}`);
      setMsg(`forked to ${body.id} (editable)`);
      await load();
      setSelected(body.id);
    } catch (e) { setMsg(`fork failed: ${e.message || e}`); }
  };
  const scenarioToolRows = definition => (definition?.tools || []).map((tool, i) => html`<div class="exchange" key=${i}>
    <div class="exchange-head">tool · <span class="mono">${tool.name}</span> · ${tool.side_effect}${tool.lua_source ? ' · supplied Lua' : ' · LLM-rendered'}</div>
    <div class="meta">${tool.description}</div>
    ${tool.lua_source ? html`<${SourceCode} source=${tool.lua_source} />` : null}
  </div>`);
  return html`<section>
    <div class="page-head"><div><h2>Scenarios</h2><p class="meta">Reusable worlds, tool contracts, simulator settings, and workspace seeds. Investigations pin an exact revision.</p></div><button class="toggle" onClick=${load}>refresh</button></div>
    ${msg ? html`<div class="note" style="margin:.4rem 0">${msg}</div>` : null}
    <div class="scenario-layout">
      <aside><div class="scenario-list">
        ${(list || []).map(s => html`<button class=${`scenario-row${selected === s.id ? ' active' : ''}`} onClick=${() => setSelected(s.id)}>
          <strong>${s.label || s.id.slice(0, 8)}</strong><span class="meta mono">${s.id.slice(0,8)} · r${s.revision} · ${s.editable ? 'editable' : `pinned by ${s.investigations}`}</span>
        </button>`)}
      </div>
      ${list && !list.length ? html`<div class="empty">No scenarios yet.</div>` : null}
      <div class="meta" style="margin-top:.7rem">Register with <span class="mono">POST /api/scenarios</span> using request JSON and an optional workspace zip. The API specification documents the complete authoring contract.</div>
      <details><summary>raw scenario list JSON</summary><pre class="raw-json">${pretty(list || [])}</pre></details></aside>
      <div>${detail ? html`<div class="surface" style="padding:1rem">
      <div class="meta"><b class="mono">${detail.id}</b> · revision ${detail.revision} · ${detail.editable ? 'editable' : html`pinned by ${detail.investigation_ids.length} investigation(s)`} · ${detail.workspace_files} workspace file(s) · ${detail.tools || ''}${detail.definition.tools.length} tool(s), ${detail.definition.tools.filter(x => x.lua_source).length} implemented</div>
      <div class="meta mono">definition ${detail.definition_hash.slice(0, 12)} · workspace ${detail.workspace_hash.slice(0, 12)}</div>
      ${detail.correction ? html`<div class="note">corrects <span class="mono">${detail.correction.scenario_id.slice(0, 8)}</span> r${detail.correction.revision}: ${detail.correction.reason}</div>` : null}
      <div class="panel-actions" style="margin:.5rem 0"><button class="toggle" onClick=${forkSelected}>fork current revision</button><${ScenarioWorkspaceDownload} id=${detail.id} token=${token} /></div>
      <details><summary>world specification</summary><div class="body" style="white-space:pre-wrap;padding:.45rem 0">${detail.definition.world}</div></details>
      <details><summary>input domain and protagonist</summary><div class="meta"><b>user message</b></div><div style="white-space:pre-wrap">${detail.definition.user_message || '—'}</div><div class="meta" style="margin-top:.5rem"><b>input domain</b></div><pre class="raw-json">${pretty(detail.definition.input_domain || {})}</pre>${detail.definition.simulator_notes ? html`<div class="meta" style="margin-top:.5rem"><b>simulator notes:</b> ${detail.definition.simulator_notes}</div>` : null}</details>
      <details><summary>tool contracts · ${detail.definition.tools.length}</summary>${scenarioToolRows(detail.definition)}</details>
      <details><summary>simulation controls</summary><pre class="raw-json">${pretty(detail.definition.simulation || {})}</pre></details>
      <div class="meta" style="margin-top:.5rem">Simulator: <span class="mono">${detail.definition.simulation?.sim_model || 'server default'}</span> · thinking ${detail.definition.simulation?.sim_thinking_level || 'provider default'}</div>
      <h3 style="margin:.8rem 0 .2rem">simulation probes</h3>
      <div class="meta">Each submission runs its calls in order in one session and starts from a fresh snapshot; the PUT is never involved.</div>
      <textarea aria-label="probe tool calls" class="mono" style="width:100%;min-height:5rem;background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:.4rem" value=${calls} onInput=${e => setCalls(e.target.value)}></textarea>
      <div style="margin-top:.35rem"><button disabled=${busy || !selected} onClick=${submitProbe}>run probe</button></div>
      ${probes.map((probe, probeIndex) => html`<details class="lua-program" key=${probe.id} open=${probe.status !== 'done'}>
        <summary>probe <span class="mono">${probe.id.slice(0, 8)}</span> · ${probe.status}${probe.stop_reason ? ` · ${probe.stop_reason}` : ''} · r${probe.scenario_revision} · ${(probe.calls || []).length} call(s)${probe.usage ? ` · ${fmtUsage(probe.usage)}` : ''}</summary>
        ${probe.error ? html`<div class="note">${probe.error}</div>` : null}
        ${probe.reason ? html`<div class="meta">reason: ${probe.reason}</div>` : null}
        ${(probe.calls || []).map((call, i) => html`<div class="exchange evidence-primary" key=${i}>
          <div class="exchange-head">call ${i + 1} · <span class="mono">${call.request.name}(${JSON.stringify(call.request.args)})</span> · ${call.elapsed_ms}ms</div>
          ${call.error ? html`<div class="note">could not be rendered: ${call.error}</div>` : html`<pre class="step">${pretty(call.response)}</pre>`}
          ${call.lua_execution ? html`<${LuaExecutionProvenance} execution=${call.lua_execution} />` : null}
          ${call.workspace_ops && call.workspace_ops.length ? html`<${WsOps} ops=${call.workspace_ops} />` : null}
          ${call.lua_execution && call.lua_execution.discarded_workspace_ops && call.lua_execution.discarded_workspace_ops.length ? html`<${WsOps} ops=${call.lua_execution.discarded_workspace_ops} rolledBack=${true} label="discarded Lua writes" />` : null}
        </div>`)}
      </details>`)}
      <details class="detail-section"><summary>raw scenario JSON · complete scenario API representation</summary><pre class="raw-json">${pretty(detail)}</pre></details>
      <details><summary>raw probe list JSON</summary><pre class="raw-json">${pretty(probes)}</pre></details>
    </div>` : html`<div class="empty">Select a scenario to inspect its complete definition, lifecycle, probes, and raw API representation.</div>`}</div>
    </div>
  </section>`;
}

function BrowsingFilters({ jobs, filters, setFilters }) {
  const keys = [...new Set((jobs || []).flatMap(j => Object.keys(jobAttributes(j))).concat(Object.keys(filters)))].sort();
  const entries = Object.entries(filters);
  const set = (oldKey, key, value) => {
    const next = { ...filters }; delete next[oldKey]; if (key) next[key] = value; setFilters(next);
  };
  const add = () => { const key = keys.find(k => !Object.prototype.hasOwnProperty.call(filters, k)); if (key) setFilters({ ...filters, [key]: '' }); };
  return html`<details class="filter-panel" open=${entries.length > 0}><summary>Filters${entries.length ? ` · ${entries.length} active` : ''}</summary>
    <div class="meta">Exact AND matches against caller/system attributes; investigation list only; all jobs remain frontier candidates.</div>
    ${entries.map(([key, value]) => html`<div class="filter-row" key=${key}><select aria-label="filter attribute" value=${key} onChange=${e => set(key, e.target.value, value)}>${[...new Set([key, ...keys])].map(k => html`<option value=${k}>${k}</option>`)}</select><input aria-label="filter value" type="text" value=${value} onInput=${e => set(key, key, e.target.value)} /><button class="del" title="remove filter" onClick=${() => { const n = { ...filters }; delete n[key]; setFilters(n); }}>✕</button></div>`)}
    <button class="toggle" disabled=${!keys.some(k => !Object.prototype.hasOwnProperty.call(filters, k))} onClick=${add}>+ attribute filter</button>
  </details>`;
}

function App() {
  const shared = useRef(readSharedState()).current;
  const [jobs, setJobs] = useState(null); // null = loading
  const [auto, setAuto] = useState(true);
  const [token, setToken] = useState(() => localStorage.getItem(TOKEN_KEY) || '');
  const [draft, setDraft] = useState(() => localStorage.getItem(TOKEN_KEY) || '');
  const [authRequired, setAuthRequired] = useState(false);
  const [authError, setAuthError] = useState(false);
  const [theme, setTheme] = useState(() => localStorage.getItem(THEME_KEY) || 'light');
  const initialJobId = location.hash.startsWith('#job-') ? location.hash.slice(5) : null;
  const [activeView, setActiveView] = useState(initialJobId ? 'investigations' : 'overview');
  const [selectedJobId, setSelectedJobId] = useState(initialJobId);
  const [groupBy, setGroupByState] = useState(shared.groupBy);
  const [axes, setAxes] = useState(() => shared.axes.map(a => a.name));
  const [dirs, setDirs] = useState(() => Object.fromEntries(shared.axes.map(a => [a.name, a.better])));
  const [filters, setFilters] = useState(shared.attributes);
  const [urlWarning, setUrlWarning] = useState(shared.warning);
  const [shareMsg, setShareMsg] = useState('');
  const urlReady = useRef(false), restoringUrl = useRef(false);
  const [frontierPoints, setFrontierPoints] = useState([]);
  const [activeGroupId, setActiveGroupId] = useState(null);
  const deletedIds = useRef(new Set());
  // Ephemeral browser-only state for cards that are regrouped. It is neither
  // server metadata nor a persistence layer; deleting a job drops it.
  const jobUiCache = useRef(new Map());
  const revision = useRef(0);
  const deleteTimers = useRef(new Set());
  useEffect(() => () => { deleteTimers.current.forEach(clearTimeout); }, []);
  useEffect(() => {
    if (jobs === null) return;
    const present = new Set(jobs.map(job => job.id));
    for (const id of jobUiCache.current.keys()) {
      if (!present.has(id)) jobUiCache.current.delete(id);
    }
  }, [jobs]);

  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    localStorage.setItem(THEME_KEY, theme);
  }, [theme]);

  // Shared browsing state is deliberately URL-only and never includes the API
  // token. Keep unrelated query parameters and hash intact.
  useEffect(() => {
    const stateAxes = axes.map(name => ({ name, better: reservedDir(name) || dirs[name] || 'higher' }));
    if (axes.some(name => !name)) return;
    if (restoringUrl.current) { restoringUrl.current = false; return; }
    writeSharedState(groupBy, stateAxes, filters, !urlReady.current);
    urlReady.current = true;
  }, [JSON.stringify(groupBy), JSON.stringify(axes), JSON.stringify(dirs), JSON.stringify(filters)]);
  useEffect(() => {
    const restore = () => {
      const next = readSharedState(); restoringUrl.current = true; setGroupByState(next.groupBy); setAxes(next.axes.map(a => a.name)); setDirs(Object.fromEntries(next.axes.map(a => [a.name, a.better]))); setFilters(next.attributes); setUrlWarning(next.warning); setFrontierPoints([]); setActiveGroupId(null);
      const id = location.hash.startsWith('#job-') ? location.hash.slice(5) : null;
      setSelectedJobId(id); if (id) setActiveView('investigations');
    };
    addEventListener('popstate', restore); addEventListener('hashchange', restore);
    return () => { removeEventListener('popstate', restore); removeEventListener('hashchange', restore); };
  }, []);

  useEffect(() => {
    if (!auto) return;
    const controller = new AbortController();
    let disposed = false, timer;
    const poll = async () => {
      const mine = revision.current;
      try {
        const r = await fetch(API(), { headers: authHeaders(token), signal: controller.signal });
        if (r.status === 401) {
          if (!disposed && mine === revision.current) { setAuthRequired(true); if (token) setAuthError(true); }
          return;
        }
        if (!r.ok) throw new Error(`job list: HTTP ${r.status}`);
        const list = await r.json();
        if (!Array.isArray(list) || disposed || mine !== revision.current) return;
        if (!list.length) { setJobs([]); setAuthRequired(false); setAuthError(false); return; }
        // Always retrieve full views, including completed ones: grades and attributes
        // may have been PATCHed by another caller after a run finished.
        const views = await Promise.all(list.map(async s => {
          const view = await fetch(API(s.id), { headers: authHeaders(token), signal: controller.signal });
          // A delete can race the summary list. Treat that single vanished job
          // as absent rather than retaining a stale card until the next poll.
          if (view.status === 404) return null;
          if (!view.ok) throw new Error(`job ${s.id}: HTTP ${view.status}`);
          return view.json();
        }));
        if (!disposed && mine === revision.current) {
          setJobs(views.filter(j => j && !deletedIds.current.has(j.id)));
          setAuthRequired(false); setAuthError(false);
        }
      } catch (e) {
        if (e.name !== 'AbortError' && !disposed) console.error(e);
      } finally {
        // Serialize polls: slow trace downloads must not be perpetually
        // invalidated by the next interval or accumulate outstanding requests.
        if (!disposed) timer = setTimeout(poll, 2500);
      }
    };
    poll();
    return () => { disposed = true; controller.abort(); clearTimeout(timer); };
  }, [auto, token]);

  const saveToken = () => {
    const t = draft.trim();
    localStorage.setItem(TOKEN_KEY, t);
    setToken(t);
    setAuthError(false);
  };

  const clearToken = () => {
    localStorage.removeItem(TOKEN_KEY);
    setToken('');
    setDraft('');
    setAuthError(false);
  };

  const [leaving, setLeaving] = useState(null); // id mid-leave-animation
  const applyPatch = (id, patch) => {
    ++revision.current; // discard any GET snapshot started before this PATCH
    setJobs(js => (js || []).map(j => j.id === id ? {
      ...j,
      grades: patch.grades === undefined ? j.grades : patch.grades,
      attributes: patch.attributes === undefined ? j.attributes : patch.attributes,
      assessment: patch.assessment === undefined ? j.assessment : patch.assessment,
    } : j));
  };
  const removeJob = async id => {
    let ok = false;
    try {
      const r = await fetch(API(id), { method: 'DELETE', headers: authHeaders(token) });
      if (!r.ok) {
        const b = await r.json().catch(() => ({}));
        alert(b.error || `delete failed: HTTP ${r.status}`);
        return;
      }
      ok = true;
    } catch (e) { console.error(e); alert('delete failed: network error'); return; }
    if (!ok) return;
    if (selectedJobId === id) closeJob();
    // A detail-list poll begun before DELETE may still resolve. Remember the
    // tombstone until a later list no longer contains it, so it cannot revive.
    deletedIds.current.add(id);
    ++revision.current;
    // Leave animation: collapse first, drop from state after. The 250ms
    // covers the 220ms CSS transition plus layout settle; the timeout is
    // cleared on unmount so a deleted card can't resurrect over a page
    // navigation.
    setLeaving(id);
    const timer = setTimeout(() => {
      deleteTimers.current.delete(timer);
      setJobs(js => (js || []).filter(x => x.id !== id));
      setLeaving(null);
    }, 250);
    deleteTimers.current.add(timer);
  };

  const setGroupBy = next => {
    setGroupByState(next);
    // Old ids describe a different attribute vector; never cross-highlight
    // while the new frontier request is in flight.
    setFrontierPoints([]); setActiveGroupId(null);
  };
  const activateGroup = id => {
    setActiveGroupId(id); setSelectedJobId(null); setActiveView('investigations');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const group = [...document.querySelectorAll('[data-job-group-id]')].find(el => el.getAttribute('data-job-group-id') === id);
      if (group) group.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }));
  };
  const openJob = id => {
    setSelectedJobId(id); setActiveView('investigations');
    const url = safeShareUrl(); url.hash = `job-${id}`; history.pushState(null, '', url.pathname + url.search + url.hash);
    if (matchMedia('(max-width: 900px)').matches) requestAnimationFrame(() => document.querySelector('.investigation-detail-pane')?.scrollIntoView({ behavior:'smooth', block:'start' }));
  };
  const closeJob = () => {
    setSelectedJobId(null);
    if (location.hash.startsWith('#job-')) { const url = safeShareUrl(); url.hash = ''; history.pushState(null, '', url.pathname + url.search); }
  };
  const showView = view => {
    setActiveView(view);
    if (view !== 'investigations' && selectedJobId) closeJob(); else scrollTo({ top: 0, behavior: 'smooth' });
  };
  const copyShareLink = async () => {
    try { await copySource(safeShareUrl().href); setShareMsg('share link copied (no token included)'); }
    catch { setShareMsg('could not copy share link'); }
  };
  const shownJobs = jobs === null ? null : jobs.filter(j => cardMatchesAttributes(j, filters));
  const selectedJob = jobs && jobs.find(j => j.id === selectedJobId);
  const attentionIds = new Set(frontierPoints.flatMap(p => (p.excluded || []).map(e => e.investigation)));
  const frontierCount = frontierPoints.filter(p => p.on_frontier === true).length;
  const requiredGrades = axes.filter(name => !reservedDir(name));
  const comparisonReady = jobs ? jobs.filter(j => j.status === 'done' && requiredGrades.every(name => Number.isFinite(j.grades?.[name]))).length : 0;

  return html`
    <header>
      <h1>prompt-explore <span class="mono" style="font-size:.68rem;color:var(--text-dim)">v__VERSION__</span></h1>
      <span class="sub">behavior evidence</span>
      <span class="auto">
        <label class="meta"><input type="checkbox" checked=${auto} onClick=${() => setAuto(!auto)} /> auto-refresh</label>
        <button class="toggle" onClick=${copyShareLink}><span class="share-label">copy </span>share link</button>
        <button class="toggle" onClick=${() => setTheme(theme === 'light' ? 'dark' : 'light')} title=${`switch to ${theme === 'light' ? 'dark' : 'light'} mode`}>${theme === 'light' ? 'dark' : 'light'}</button>
        ${token ? html`<button class="toggle" onClick=${clearToken} title="forget the stored API token">clear token</button>` : null}
      </span>
    </header>
    <nav class="app-nav" aria-label="Primary">
      ${[['overview','Overview'],['investigations',`Investigations${jobs ? ` ${jobs.length}` : ''}`],['scenarios','Scenarios']].map(([id,label]) => html`<button class=${`nav-tab${activeView === id ? ' active' : ''}`} aria-current=${activeView === id ? 'page' : null} onClick=${() => showView(id)}>${label}</button>`)}
    </nav>
    ${authRequired ? html`
      <div class="card" style="border-color:var(--accent)">
        <h2>API token required</h2>
        <div class="meta" style="margin:.4rem 0">Enter the server's bearer token. It is stored only in this browser's localStorage.</div>
        <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap"><input type="password" value=${draft} onInput=${e => setDraft(e.target.value)} placeholder="API token" style="flex:1;min-width:16em" /><button onClick=${saveToken}>save</button></div>
        ${authError ? html`<div class="note" style="margin-top:.4rem">That token was rejected — check it and try again.</div>` : null}
      </div>` : null}
    ${urlWarning ? html`<div class="frontier-err"><b>Invalid shared URL state</b><div class="meta">${urlWarning}. Defaults were used.</div></div>` : null}
    ${shareMsg ? html`<div class="meta" style="margin-bottom:.5rem">${shareMsg}</div>` : null}

    ${authRequired ? null : jobs === null ? html`<div class="empty">loading…</div>` : activeView === 'overview' ? html`<main>
      <div class="page-head"><div><h2>Overview</h2><p class="meta">Comparison first. Open the review queue or an investigation when you need the complete evidence.</p></div></div>
      <div class="overview-stats">
        <div class="stat"><strong>${jobs.length}</strong><span>investigations</span></div>
        <div class="stat"><strong>${jobs.filter(j => j.status === 'done').length}</strong><span>completed traces</span></div>
        <div class="stat"><strong>${comparisonReady}</strong><span>have selected grades</span></div>
        <div class="stat"><strong class=${attentionIds.size ? 'pending' : ''}>${attentionIds.size}</strong><span>need attention for this comparison</span></div>
        <div class="stat"><strong>${frontierCount}</strong><span>frontier groups</span></div>
      </div>
      <${FrontierPanel} jobs=${jobs} token=${token} groupBy=${groupBy} setGroupBy=${setGroupBy} axes=${axes} setAxes=${setAxes} dirs=${dirs} setDirs=${setDirs}
        activeGroupId=${activeGroupId} onActiveGroup=${setActiveGroupId} onGroupActivate=${activateGroup} onOpenJob=${openJob} onPlotChange=${setFrontierPoints} />
    </main>` : activeView === 'investigations' ? html`<main id="jobs">
      <div class="page-head"><div><h2>Investigations</h2><p class="meta">Select an investigation to inspect its complete evidence alongside the campaign list.</p></div></div>
      <${InvestigationComposer} token=${token} />
      <div class="investigation-layout">
        <aside class="investigation-list-pane">
          <div class="toolbar"><span class="meta">${shownJobs.length} shown · ${jobs.length} total</span><span class="spacer"></span><${BrowsingFilters} jobs=${jobs} filters=${filters} setFilters=${setFilters} /></div>
          ${jobs.length === 0 ? html`<div class="empty">No investigations. Start one via <span class="mono">POST /api/investigations</span>.</div>`
          : shownJobs.length === 0 ? html`<div class="empty">No investigations match these filters. The frontier still considers every investigation.</div>`
          : html`<${GroupedJobCards} jobs=${shownJobs} groupBy=${groupBy} points=${frontierPoints} activeGroupId=${activeGroupId} onActiveGroup=${setActiveGroupId} onOpen=${openJob} selectedJobId=${selectedJobId} />`}
        </aside>
        <div class="investigation-detail-pane">
          ${selectedJob ? html`<${JobCard} j=${selectedJob} jobs=${jobs} token=${token} onDelete=${removeJob} onPatched=${applyPatch} leaving=${leaving === selectedJob.id} uiCache=${jobUiCache} onBack=${closeJob} />`
          : html`<div class="empty">Select an investigation to inspect its outcome, caller review, conversation, provenance, and raw API representations.</div>`}
        </div>
      </div>
    </main>` : html`<main><${ScenarioPanel} token=${token} /></main>`}

    <footer class="meta" style="margin-top:2rem;text-align:center;border-top:1px solid var(--border);padding-top:1rem">
      API: <a class="mono" href="/openapi.json">/openapi.json</a> · Workflow Lua: <a class="mono" href="/docs/workflow">/docs/workflow</a> · Tool Lua: <a class="mono" href="/docs/lua">/docs/lua</a> · models: <a class="mono" href="/api/models">/api/models</a>
    </footer>`;
}

render(html`<${App} />`, document.getElementById('root'));
</script>
</body>
</html>
