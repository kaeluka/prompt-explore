<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Service description: the OpenAPI spec. RFC 8631 rel="service-desc",
     also surfaced via a Link header on every response. -->
<link rel="service-desc" href="/openapi.json" title="OpenAPI spec">
<link rel="service-doc" href="/" title="Web UI">
<title>prompt-explore · jobs</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1d212b; --border: #2a2f3b;
    --text: #e6e8ec; --text-dim: #9aa3b2; --accent: #7c6cff; --accent-2: #5a4bd6;
    --red: #ff6b6b; --green: #51cf8a; --amber: #f5b556;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.55; }
  .wrap { max-width: 940px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  header { display: flex; align-items: baseline; gap: 0.7rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
  header h1 { font-size: 1.15rem; margin: 0; }
  header .sub { color: var(--text-dim); font-size: 0.85rem; }
  header .auto { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }
  .meta { color: var(--text-dim); font-size: 0.85rem; }
  .card { background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 1rem 1.1rem; margin: 0.7rem 0; }
  .card h2 { font-size: 0.92rem; margin: 0; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .mono { font-family: var(--mono); }
  .badge { display: inline-block; font-size: 0.74rem; font-weight: 700;
    padding: 0.16rem 0.55rem; border-radius: 999px; letter-spacing: 0.02em; }
  .badge.running { background: rgba(124,108,255,0.16); color: #b7aaff; border: 1px solid rgba(124,108,255,0.4); }
  .badge.phase { background: rgba(154,163,178,0.10); color: var(--text-dim); border: 1px solid var(--border); font-weight: 500; }
  .badge.done { background: rgba(81,207,138,0.12); color: var(--green); border: 1px solid rgba(81,207,138,0.35); }
  .badge.failed { background: rgba(255,107,107,0.12); color: var(--red); border: 1px solid rgba(255,107,107,0.35); }
  .badge.completed { background: rgba(81,207,138,0.12); color: var(--green); border: 1px solid rgba(81,207,138,0.35); }
  .badge.partial { background: rgba(245,181,86,0.14); color: var(--amber); border: 1px solid rgba(245,181,86,0.35); }
  .badge.error { background: rgba(255,107,107,0.14); color: var(--red); border: 1px solid rgba(255,107,107,0.4); }
  .spinner { width: 13px; height: 13px; border-radius: 50%; display: inline-block;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { color: var(--text-dim); text-align: center; padding: 3rem 0; }
  details { margin-top: 0.4rem; }
  summary { cursor: pointer; color: var(--text-dim); font-size: 0.84rem; user-select: none; }
  summary:hover { color: var(--text); }
  .scen { border-left: 2px solid var(--border); padding-left: 0.8rem; margin: 0.6rem 0; }
  .scen-head { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .scen-id { font-family: var(--mono); font-size: 0.82rem; }
  .step { font-family: var(--mono); font-size: 0.76rem; color: var(--text-dim);
    margin: 0.25rem 0; padding: 0.3rem 0.45rem; background: var(--panel-2);
    border-radius: 5px; border-left: 2px solid var(--border); white-space: pre-wrap; word-break: break-word; max-height: 10em; overflow: auto; }
  .chat { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.4rem; }
  .bubble { max-width: 82%; padding: 0.4rem 0.6rem; border-radius: 9px; font-size: 0.8rem; }
  .bubble.put { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--border); }
  .bubble.sim { align-self: flex-end; background: rgba(124,108,255,0.10); border: 1px solid rgba(124,108,255,0.30); }
  .bubble .role { font-size: 0.66rem; color: var(--text-dim); margin-bottom: 0.18rem; letter-spacing: 0.04em; }
  .bubble .body { white-space: pre-wrap; word-break: break-word; }
  .bubble .body.tool { font-family: var(--mono); font-size: 0.76rem; }
  /* Thinking (visible reasoning) renders italic + dimmed so it reads as
     the model's inner voice, distinct from spoken output. */
  .bubble .body.think { font-style: italic; color: var(--text-dim); }
  .note { color: var(--amber); font-size: 0.82rem; }
  button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.3rem 0.7rem; cursor: pointer; font-size: 0.8rem; }
  button:hover { border-color: var(--accent); }
  .toggle { font-size: 0.78rem; }
  /* Per-role usage tags mirror the chat bubbles: PUT is neutral, SIM is purple. */
  .usage-line { margin-top: 0.15rem; }
  .utag { display: inline-block; font-size: 0.66rem; font-weight: 700; padding: 0.06rem 0.4rem;
    border-radius: 4px; letter-spacing: 0.04em; margin-right: 0.35rem; vertical-align: 1px; font-family: var(--mono); }
  .utag.put { background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--border); }
  .utag.sim { background: rgba(124,108,255,0.14); color: #b7aaff; border: 1px solid rgba(124,108,255,0.35); }
  .utag.ws { background: rgba(46,170,160,0.14); color: #7fd9cf; border: 1px solid rgba(46,170,160,0.4); }
  .wsops { margin: 0.15rem 0 0.15rem 1.4rem; border-left: 2px solid rgba(46,170,160,0.4); padding-left: 0.5rem; }
  .wsop { margin: 0.2rem 0; }
  /* Grades editor + frontier panel */
  input[type=text], input[type=number], select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.22rem 0.5rem; font-size: 0.8rem; font-family: var(--mono); }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .grow { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .grade-row { display: flex; gap: 0.4rem; align-items: center; margin: 0.22rem 0; }
  .grade-row .name { font-family: var(--mono); font-size: 0.78rem; color: var(--text); min-width: 11em; }
  .grade-row input { width: 7em; }
  .del { color: var(--text-dim); cursor: pointer; border: none; background: none; padding: 0 0.2rem; font-size: 0.9rem; }
  .del:hover { color: var(--red); }
  .axis-grid { display: grid; grid-template-columns: 1fr auto auto; gap: 0.4rem 0.6rem; align-items: center; }
  .frontier-err { border-left: 2px solid var(--red); padding-left: 0.6rem; margin: 0.4rem 0; }
  .frontier-err .reason { font-family: var(--mono); font-size: 0.74rem; color: var(--red); }
  .ptable { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-top: 0.5rem; }
  .ptable th, .ptable td { text-align: left; padding: 0.25rem 0.5rem; border-bottom: 1px solid var(--border); }
  .ptable .dom { color: var(--text-dim); }
  .ptable .nd { color: var(--green); font-weight: 700; }
  .frontier-svg { margin-top: 0.6rem; border: 1px solid var(--border); border-radius: 8px; overflow: auto; }
  .frontier-svg svg { display: block; }
  /* Long failure texts (e.g. full provider error bodies) are clipped to one
     line-length; the "…" / "⌃" marker toggles the rest. */
  .clip-toggle { color: var(--accent); cursor: pointer; user-select: none; font-weight: 700; padding: 0 0.1rem; }
  .clip-toggle:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap"><div id="root"></div></div>

<script type="importmap">
{ "imports": {
  "preact": "/vendor/preact.mjs",
  "preact/hooks": "/vendor/hooks.mjs",
  "htm": "/vendor/htm.mjs"
} }
</script>
<script type="module">
import { h, render } from 'preact';
import { useState, useEffect } from 'preact/hooks';
import htm from 'htm';
const html = htm.bind(h);

const API = id => `/api/investigations${id ? '/'+id : ''}`;
const TOKEN_KEY = 'pe_api_token';
const authHeaders = token => token ? {'Authorization': 'Bearer '+token} : {};
// Format one role's UsageTotals. `tool_calls` is only the simulated PUT
// Estimated USD cost, only present for priced (e.g. OpenRouter) models.
// Scale precision to magnitude so sub-cent costs stay meaningful.
const fmtUsd = c => {
  if (c == null) return '';
  const s = c >= 1 ? c.toFixed(2) : c >= 0.0001 ? c.toPrecision(2) : c.toExponential(1);
  return ` · ~$${s}`;
};
// (the sim model has no tools), so it's hidden when zero to avoid noise.
const fmtUsage = u => u ? `${u.input_tokens.toLocaleString()} in${u.cache_read_tokens?` (${u.cache_read_tokens.toLocaleString()} cached)`:''} / ${u.output_tokens.toLocaleString()} out · ${u.llm_calls} llm${u.tool_calls?` · ${u.tool_calls} tool calls`:''}${fmtUsd(u.cost_usd)}` : '';
// One usage line: a colored role tag + the totals. Colors match the chat
// bubbles so `put`/`sim` are recognizable across the card.
const roleLine = (label, u, cls) => u ? html`<div class="meta usage-line"><span class=${`utag ${cls}`}>${label}</span>${fmtUsage(u)}</div>` : null;
const pretty = v => { try { return JSON.stringify(v, null, 2); } catch { return String(v); } };
const relTime = ms => { const s=(Date.now()-ms)/1000; if(s<60) return `${Math.floor(s)}s ago`; if(s<3600) return `${Math.floor(s/60)}m ago`; return `${Math.floor(s/3600)}h ago`; };
const phaseLabel = p => ({scenarios:'simulating scenarios'})[p] || p;

// Failure texts (e.g. "simulator call failed: …" plus the whole provider
// body) can run several screens long. Clip to the first `limit` chars and
// make the marker itself the toggle: click "…" to expand, "⌃" to collapse.
function ClipText({ text, limit = 150 }) {
  const [open, setOpen] = useState(false);
  const s = text == null ? '' : String(text);
  if (s.length <= limit) return html`<span>${s}</span>`;
  return html`<span>${open ? s : s.slice(0, limit)}<span class="clip-toggle" onClick=${() => setOpen(!open)} title=${open ? 'collapse' : 'expand full error'}>${open ? ' ⌃' : '…'}</span></span>`;
}

function ScenBadge({ s }) {
  const st = s.state || {}, kind = st.kind || 'running';
  if (kind === 'running') return html`<span class="badge running"><span class="spinner"></span> running</span>`;
  if (kind === 'done') return html`<span class="badge done">done</span>`;
  if (kind === 'failed') return html`<span class="badge error">failed: ${st.stage}</span>`;
  return null;
}

function Bubble({ side, role, body, tool, think }) {
  return html`<div class=${`bubble ${side}`}><div class="role">${role}</div><div class=${`body${tool ? ' tool':''}${think ? ' think':''}`}>${body}</div></div>`;
}

// A thinking bubble: collapsible when long (reasoning can run screens),
// italic always. Same chat side as its owner's other bubbles.
function Thinking({ side, role, text }) {
  const [open, setOpen] = useState(false);
  const LIMIT = 300;
  const s = String(text);
  const long = s.length > LIMIT;
  const shown = open || !long ? s : s.slice(0, LIMIT);
  return html`<div class=${`bubble ${side}`}>
    <div class="role">${role} · thinking${long ? html` <span class="clip-toggle" style="cursor:pointer" onClick=${() => setOpen(!open)} title=${open ? 'collapse' : 'expand full thinking'}>${open ? '⌃' : '…'}</span>` : null}</div>
    <div class="body think">${shown}</div>
  </div>`;
}

function Chat({ s }) {
  const out = [];
  // Resolved input bindings (sim agent's output) — first, SIM side.
  const ri = s.resolved_inputs;
  if (ri && Object.keys(ri).length) {
    const rows = Object.entries(ri).map(([k, v], i) => {
      // Strings render as-is; only actual objects/arrays pretty-print,
      // collapsible so a deep value doesn't blow out the pane.
      const isObj = v !== null && typeof v === 'object';
      const shown = isObj ? JSON.stringify(v, null, 2) : String(v);
      const body = (!isObj || shown.length <= 80)
        ? html`<span>${shown}</span>`
        : html`<details><summary class="mono" style="cursor:pointer;color:var(--text-dim)">${shown.split('\n')[0].slice(0,70)}…</summary><pre class="step" style="max-height:12em;overflow:auto;margin:0.3rem 0">${shown}</pre></details>`;
      return html`<div key=${'ri'+i} style="display:flex;gap:0.4rem;padding:0.15rem 0;border-bottom:1px solid var(--border)"><span class="mono" style="color:var(--text-dim);flex-shrink:0">${k} →</span><span style="word-break:break-word">${body}</span></div>`;
    });
    out.push(html`<div class="bubble sim" key="ri"><div class="role">SIM</div><div class="body">${rows}</div></div>`);
  }
  if (s.user_message && s.user_message.trim()) out.push(html`<${Bubble} key="u" side="sim" role="USER" body=${s.user_message} />`);
  (s.steps || []).forEach((st, i) => {
    if (st.thinking && st.thinking.trim())
      out.push(html`<${Thinking} key=${'pt'+i} side="put" role="PUT" text=${st.thinking} />`);
    if (st.model_output && st.model_output.trim())
      out.push(html`<${Bubble} key=${'o'+i} side="put" role="PUT" body=${st.model_output} />`);
    if (st.tool_call) {
      const a = st.tool_call.args;
      const args = typeof a === 'string' ? a : JSON.stringify(a);
      out.push(html`<${Bubble} key=${'t'+i} side="put" role="PUT · tool" tool=${true} body=${`🔧 ${st.tool_call.name}(${args})`} />`);
    }
    if (st.workspace_ops && st.workspace_ops.length) {
      out.push(html`<${WsOps} key=${'w'+i} ops=${st.workspace_ops} />`);
    }
    if (st.sim_thinking && st.sim_thinking.trim())
      out.push(html`<${Thinking} key=${'st'+i} side="sim" role="SIM" text=${st.sim_thinking} />`);
    if (st.tool_response != null) {
      const t = typeof st.tool_response === 'string' ? st.tool_response : JSON.stringify(st.tool_response, null, 2);
      out.push(html`<${Bubble} key=${'r'+i} side="sim" role="SIM" body=${t} />`);
    }
  });
  return html`<div class="chat">${out.length ? out : html`<span class="meta">(no messages yet)</span>`}</div>`;
}

function WsOps({ ops }) {
  // The simulator's workspace lookups while rendering this step — so a
  // reader can see whether the answer was GROUNDED in the uploaded files
  // (real reads/greps) or INVENTED. Collapsible; each op shows tool(args)
  // and the workspace's JSON result.
  return html`<details class="wsops"><summary class="meta" style="cursor:pointer">🔍 simulator workspace · ${ops.length} op${ops.length===1?'':'s'}: ${ops.map(o=>o.tool).join(', ')}</summary><div>${ops.map((o,i)=>{
    const a = (o.args !== null && typeof o.args === 'object') ? JSON.stringify(o.args) : String(o.args);
    const r = (o.result !== null && typeof o.result === 'object') ? JSON.stringify(o.result, null, 2) : String(o.result);
    return html`<div class="wsop" key=${i}><span class="mono meta">${o.tool}(${a})</span><pre class="step" style="max-height:9em;overflow:auto;margin:0.2rem 0">${r}</pre></div>`;
  })}</div></details>`;
}

function ScenarioPanel({ prog, input }) {
  const st = prog.state || {}, kind = st.kind || 'running';
  return html`
    <div class="scen" key=${prog.scenario_id}>
      <div class="scen-head">
        <span class="scen-id">${prog.scenario_id}</span>
        <${ScenBadge} s=${prog} />
        <span class="meta">${(prog.steps||[]).length} turn(s)</span>
      </div>
      ${kind === 'failed' ? html`<div class="note" style="margin:0.3rem 0"><${ClipText} text=${st.error} /></div>` : null}
      ${input ? html`
        <details>
          <summary>scenario spec (world)</summary>
          <div class="body" style="white-space:pre-wrap;word-break:break-word;padding:0.3rem 0">${input.world || '(no world)'}</div>
          ${input.simulator_notes ? html`<div class="meta" style="margin-top:0.4rem"><b>simulator notes:</b> ${input.simulator_notes}</div>` : null}
          ${input.world_state && Object.keys(input.world_state).length ? html`<details><summary class="meta">world state</summary><pre class="step">${pretty(input.world_state)}</pre></details>` : null}
        </details>` : null}
      <details>
        <summary>conversation</summary>
        <${Chat} s=${prog} />
      </details>
    </div>`;
}

function PutPanel({ put }) {
  if (!put) return null;
  const tools = put.tools || [];
  return html`
    <details style="margin-top:0.4rem">
      <summary class="meta">prompt under test</summary>
      <div class="meta" style="margin:0.3rem 0"><b>design goals:</b> ${put.design_goals || ''}</div>
      ${tools.length ? html`
        <div class="meta" style="margin:0.3rem 0"><b>tools:</b> (click to expand)</div>
        ${tools.map(t => html`
          <details style="margin:0.2rem 0 0.2rem 0.6rem">
            <summary class="mono meta" style="cursor:pointer">${t.name} <span style="opacity:0.6">(${t.side_effect})</span></summary>
            <div style="margin:0.3rem 0 0.3rem 0.7rem">
              <div class="meta" style="margin:0.2rem 0"><b>description:</b> ${t.description || ''}</div>
              <details><summary class="meta">parameters (JSON schema)</summary><pre class="step">${JSON.stringify(t.parameters, null, 2)}</pre></details>
              ${t.example_responses && t.example_responses.length ? html`<details><summary class="meta">example_responses (${t.example_responses.length})</summary><div>${t.example_responses.map(r => html`<pre class="step">${r}</pre>`)}</div></details>` : null}
            </div>
          </details>`)}
      ` : null}
      <details style="margin-top:0.3rem"><summary class="meta">template</summary><div class="body" style="white-space:pre-wrap;word-break:break-word;padding:0.3rem 0;font-size:0.78rem">${put.template || ''}</div></details>
    </details>`;
}

function ResultLine({ j }) {
  const r = j.result; if (!r) return null;
  const rr = r.result;
  return html`
    <div style="margin-top:0.5rem">
      <span class="badge ${rr.status}">${rr.status}</span>
      <span class="meta"> ${rr.scenarios_tried} scenario(s) · ${r.attempts.length} trace(s)${(rr.failures&&rr.failures.length)?' · '+rr.failures.length+' failed':''}</span>
      ${r.usage ? html`<div style="margin-top:0.2rem">${roleLine('put', r.usage.put, 'put')}${roleLine('sim', r.usage.sim, 'sim')}</div>` : null}
      ${rr.failures && rr.failures.length ? html`<details style="margin-top:0.3rem"><summary class="note">failures</summary><div>${rr.failures.map((f, i) => html`<div class="step" key=${i}><b>${(f.scenario&&f.scenario.user_message)||'(no user message)'}</b> (${f.stage}): <${ClipText} text=${f.error} /></div>`)}</div></details>` : null}
    </div>`;
}

// ---------------------------------------------------------------------
// Grades (caller judgment, recorded via PATCH) + Pareto frontier
// ---------------------------------------------------------------------
// Reserved measured axes: harness-computed, direction baked in. The
// name → direction pairs mirror core::frontier::RESERVED_AXES.
const RESERVED_AXES = [
  ['put_input_tokens','lower'], ['put_output_tokens','lower'], ['put_cache_read_tokens','higher'],
  ['put_cost_usd','lower'], ['sim_input_tokens','lower'], ['sim_output_tokens','lower'],
  ['sim_cache_read_tokens','higher'], ['sim_cost_usd','lower'],
  ['steps_per_trace_avg','lower'], ['steps_per_trace_min','lower'],
  ['steps_per_trace_max','lower'], ['steps_per_trace_stdev','lower'],
];
const reservedDir = n => (RESERVED_AXES.find(([rn]) => rn === n) || [null, null])[1];

// Editable grades on one job. Sends the full desired map (numbers to
// set, null to delete — merge semantics on the server); the 2.5s poll
// refreshes j.grades right after.
function GradesPanel({ j, token }) {
  const [rows, setRows] = useState(() => Object.entries(j.grades || {}).map(([k, v]) => ({ k, v: String(v) })));
  const [nk, setNk] = useState(''); const [nv, setNv] = useState('');
  const [msg, setMsg] = useState(null);
  const set = (i, f) => setRows(rows.map((r, x) => x === i ? { ...r, ...f } : r));
  const save = async () => {
    const grades = {};
    for (const r of rows.concat(nk ? [{ k: nk, v: nv }] : [])) {
      if (!r.k) continue;
      if (r.v === '' || r.v === null) { grades[r.k] = null; }
      else {
        const f = Number(r.v);
        if (!Number.isFinite(f)) { setMsg({ err: `${r.k}: not a number` }); return; }
        grades[r.k] = f;
      }
    }
    setMsg(null);
    const r = await fetch(API(j.id), { method: 'PATCH', headers: { ...authHeaders(token), 'content-type': 'application/json' }, body: JSON.stringify({ grades }) });
    const body = await r.json().catch(() => ({}));
    if (r.ok) setMsg({ ok: 'saved' });
    else setMsg({ err: (body.problems || []).map(p => p.detail).join(' · ') || body.error || r.status });
  };
  return html`
    <details style="margin-top:0.4rem">
      <summary class="meta">grades ${rows.length ? `· ${rows.length} axis${rows.length===1?'':'es'}` : ''} <span style="opacity:0.7">(caller judgment — PATCHed, then used by the frontier)</span></summary>
      <div style="margin:0.4rem 0 0.2rem">
        ${rows.map((r, i) => html`
          <div class="grade-row" key=${r.k}>
            <span class="name">${r.k}</span>
            <input type="text" value=${r.v} onInput=${e => set(i, { v: e.target.value })} />
            <button class="del" title="delete this axis" onClick=${() => setRows(rows.filter((_, x) => x !== i))}>✕</button>
          </div>`)}
        <div class="grade-row">
          <input type="text" placeholder="new_axis_name" value=${nk} onInput=${e => setNk(e.target.value)} style="min-width:11em" />
          <input type="text" placeholder="value" value=${nv} onInput=${e => setNv(e.target.value)} />
          <button class="del" title="add" onClick=${() => { if (nk) { setRows(rows.concat([{ k: nk, v: nv }])); setNk(''); setNv(''); } }}>＋</button>
        </div>
        <div class="grow" style="margin-top:0.35rem">
          <button onClick=${save}>save grades</button>
          ${msg?.ok ? html`<span class="meta" style="color:var(--green)">✓ ${msg.ok}</span>` : null}
          ${msg?.err ? html`<span class="note">${msg.err}</span>` : null}
        </div>
      </div>
    </details>`;
}

// The frontier panel: pick done investigations + 2 axes (reserved
// measured or graded), get the SVG plot and the dominance table.
function FrontierPanel({ jobs, token }) {
  const eligible = (jobs || []).filter(j => j.status === 'done');
  const [sel, setSel] = useState({});
  const [xAx, setXAx] = useState('put_output_tokens');
  const [yAx, setYAx] = useState('');
  const [dirs, setDirs] = useState({});   // graded axis name → 'lower'|'higher'
  const [plot, setPlot] = useState(null); // { svg, table }
  const [err, setErr] = useState(null);
  const gradedNames = [...new Set(eligible.flatMap(j => Object.keys(j.grades || {})))];
  const options = RESERVED_AXES.map(([n]) => n).concat(gradedNames.filter(n => !reservedDir(n)));
  // Effective axis names, derived at render time so defaults adapt as
  // jobs arrive and get graded (state only stores explicit choices).
  const xName = xAx || 'put_output_tokens';
  const yName = yAx || gradedNames.find(n => !reservedDir(n)) || 'steps_per_trace_avg';
  const dirOf = n => reservedDir(n) || dirs[n] || 'higher';
  const setDir = (n, d) => setDirs({ ...dirs, [n]: d });
  const chosen = eligible.filter(j => sel[j.id]);

  const run = async () => {
    setErr(null); setPlot(null);
    const body = {
      investigations: chosen.map(j => j.id),
      axes: [
        { name: xName, better: dirOf(xName) },
        { name: yName, better: dirOf(yName) },
      ],
    };
    const [svgR, jsonR] = await Promise.all([
      fetch('/api/frontier?format=svg', { method: 'POST', headers: { ...authHeaders(token), 'content-type': 'application/json' }, body: JSON.stringify(body) }),
      fetch('/api/frontier?format=json', { method: 'POST', headers: { ...authHeaders(token), 'content-type': 'application/json' }, body: JSON.stringify(body) }),
    ]);
    if (!svgR.ok || !jsonR.ok) {
      const b = await jsonR.json().catch(() => ({}));
      setErr(b.problems || [{ reason: b.error || 'error', detail: `HTTP ${jsonR.status}` }]);
      return;
    }
    setPlot({ svg: await svgR.text(), table: (await jsonR.json()).points });
  };

  const axisPicker = (label, name, set) => html`
    <div class="axis-grid">
      <span class="meta">${label}</span>
      <select value=${name} onChange=${e => set(e.target.value)}>
        ${options.map(o => html`<option value=${o} key=${o}>${o}${reservedDir(o) ? '' : ' (graded)'}</option>`)}
      </select>
      ${reservedDir(name)
        ? html`<span class="meta" title="reserved measured axis — direction is baked in">${reservedDir(name)} is better 🔒</span>`
        : html`<select value=${dirOf(name)} onChange=${e => setDir(name, e.target.value)} title="your call: direction is declared per request, never stored">
            <option value="higher">higher is better</option>
            <option value="lower">lower is better</option>
          </select>`}
    </div>`;

  return html`
    <div class="card">
      <h2>📈 Pareto frontier <span class="meta" style="font-weight:400">— which variants nobody dominates</span></h2>
      ${eligible.length < 2 ? html`<div class="meta" style="margin:0.4rem 0">Needs ≥ 2 done investigations to compare.${jobs && jobs.length ? ' Grade finished ones and plot them here as more finish.' : ''}</div>` : html`
        <div style="margin:0.45rem 0">
          ${eligible.map(j => html`
            <label class="meta" style="margin-right:1rem;white-space:nowrap;cursor:pointer">
              <input type="checkbox" checked=${!!sel[j.id]} onClick=${() => setSel({ ...sel, [j.id]: !sel[j.id] })} />
              ${(j.put && j.put.id) || j.id.slice(0,8)}
            </label>`)}
        </div>
        <div style="margin:0.45rem 0">${axisPicker('x axis', xName, setXAx)}${axisPicker('y axis', yName, setYAx)}</div>
        <div class="grow"><button onClick=${run} disabled=${chosen.length < 1}>plot</button>
          <span class="meta" style="opacity:0.75">up & right is better, whichever directions you pick</span></div>`}
      ${err ? html`<div class="frontier-err">${err.map((p, i) => html`<div key=${i}><span class="reason">${p.reason}${p.investigation ? ` · ${String(p.investigation).slice(0,8)}` : ''}${p.axis ? ` · ${p.axis}` : ''}</span><div class="meta">${p.detail}</div></div>`)}</div>` : null}
      ${plot ? html`
        <div class="frontier-svg" dangerouslySetInnerHTML=${{ __html: plot.svg }}></div>
        <table class="ptable">
          <thead><tr><th>point</th><th>on frontier</th><th>dominated by</th></tr></thead>
          <tbody>${plot.table.map(p => html`
            <tr key=${p.investigation}>
              <td class="mono">${p.label}</td>
              <td>${p.on_frontier ? html`<span class="nd">yes</span>` : html`<span class="dom">no</span>`}</td>
              <td class="dom mono">${(p.dominated_by || []).map(d => (plot.table.find(q => q.investigation === d) || { label: d }).label).join(', ') || '—'}</td>
            </tr>`)}</tbody>
        </table>` : null}
    </div>`;
}

function JobCard({ j, token }) {
  const inputById = {}; (j.scenarios || []).forEach(s => { inputById[s.id] = s; });
  const progs = (j.progress && j.progress.scenarios) || [];
  return html`
    <div class="card" key=${j.id}>
      <h2>
        <span class="badge ${j.status}">${j.status}</span>
        ${j.status === 'running' && j.phase ? html`<span class="badge phase">${phaseLabel(j.phase)}</span>` : null}
        <span class="mono meta">${(j.id || '').slice(0,8)}</span>
        <span class="meta">${'· ' + relTime(j.started_at)}</span>
        ${(j.model || j.sim_model) ? html`<span style="margin-left:auto;display:flex;gap:0.35rem;align-items:center;flex-wrap:wrap;justify-content:flex-end">
          ${j.model ? html`<span class="utag put" title="prompt under test model">${j.model}</span>` : null}
          ${j.sim_model ? html`<span class="utag sim" title="tool simulator model">${j.sim_model}</span>` : null}
          ${j.workspace_files ? html`<span class="utag ws" title="simulation workspace: an in-memory filesystem the SIMULATOR consults (read/write/list_dir/grep), seeded from the uploaded zip; per-trace. The agent under test never sees it.">ws · ${j.workspace_files} file${j.workspace_files===1?'':'s'}</span>` : null}
        </span>` : null}
      </h2>
      <div class="meta" style="margin:0.4rem 0">${j.reason ? html`<span><b>reason:</b> ${j.reason}</span>` : html`<span class="meta" style="opacity:0.7">(no reason — observing behavior; the caller is the judge)</span>`}</div>
      <${PutPanel} put=${j.put} />
      <${GradesPanel} j=${j} token=${token} />
      <${ResultLine} j=${j} />
      <div class="scens" style="margin-top:0.5rem">
        ${progs.map(p => html`<${ScenarioPanel} key=${p.scenario_id} prog=${p} input=${inputById[p.scenario_id]} />`)}
      </div>
    </div>`;
}

function App() {
  const [jobs, setJobs] = useState(null); // null = loading
  const [auto, setAuto] = useState(true);
  const [token, setToken] = useState(() => localStorage.getItem(TOKEN_KEY) || '');
  const [draft, setDraft] = useState(() => localStorage.getItem(TOKEN_KEY) || '');
  const [authRequired, setAuthRequired] = useState(false);
  const [authError, setAuthError] = useState(false);

  useEffect(() => {
    if (!auto) return;
    let stop = false;
    const poll = async () => {
      try {
        const r = await fetch(API(), { headers: authHeaders(token) });
        if (r.status === 401) {
          if (!stop) { setAuthRequired(true); if (token) setAuthError(true); }
          return;
        }
        const list = await r.json();
        if (!Array.isArray(list)) return;
        if (!list.length) { if (!stop) { setJobs([]); setAuthRequired(false); setAuthError(false); } return; }
        const views = await Promise.all(list.map(s => fetch(API(s.id), { headers: authHeaders(token) }).then(r => r.json())));
        if (!stop) { setJobs(views); setAuthRequired(false); setAuthError(false); }
      } catch (e) { console.error(e); }
    };
    poll();
    const id = setInterval(poll, 2500);
    return () => { stop = true; clearInterval(id); };
  }, [auto, token]);

  const saveToken = () => {
    const t = draft.trim();
    localStorage.setItem(TOKEN_KEY, t);
    setToken(t);
    setAuthError(false);
  };

  const clearToken = () => {
    localStorage.removeItem(TOKEN_KEY);
    setToken('');
    setDraft('');
    setAuthError(false);
  };

  const expandAll = () => {
    const all = [...document.querySelectorAll('#root details')];
    const anyClosed = all.some(d => !d.hasAttribute('open'));
    all.forEach(d => { if (anyClosed) d.setAttribute('open', ''); else d.removeAttribute('open'); });
  };

  return html`
    <header>
      <h1>prompt-explore <span class="mono" style="font-size:0.72rem;color:var(--text-dim)">v__VERSION__</span></h1>
      <span class="sub">job overview</span>
      <span class="auto">
        <label class="meta"><input type="checkbox" checked=${auto} onClick=${() => setAuto(!auto)} /> auto-refresh</label>
        <button class="toggle" onClick=${expandAll}>expand all logs</button>
        ${token ? html`<button class="toggle" onClick=${clearToken} title="forget the stored API token">clear token</button>` : null}
      </span>
    </header>
    ${authRequired ? html`
      <div class="card" style="border-color:var(--accent)">
        <h2>🔒 API token required</h2>
        <div class="meta" style="margin:0.4rem 0">This server requires an <span class="mono">Authorization: Bearer</span> token (set via <span class="mono">PROMPT_EXPLORE_API_TOKEN</span>). Enter it to view and submit jobs. It is stored only in this browser's localStorage.</div>
        <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">
          <input type="password" value=${draft} onInput=${e => setDraft(e.target.value)} placeholder="API token" style="background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:0.3rem 0.6rem;font-family:var(--mono);flex:1;min-width:16em" />
          <button onClick=${saveToken}>save</button>
        </div>
        ${authError ? html`<div class="note" style="margin-top:0.4rem">That token was rejected — check it and try again.</div>` : null}
      </div>` : null}
    ${authRequired ? null : jobs === null ? null : html`<${FrontierPanel} jobs=${jobs} token=${token} />`}
    <div id="jobs">
      ${authRequired ? null
       : jobs === null ? html`<div class="empty">loading…</div>`
       : jobs.length === 0 ? html`<div class="empty">No jobs. Start one via <span class="mono">POST /api/investigations</span>.</div>`
       : jobs.map(j => html`<${JobCard} key=${j.id} j=${j} token=${token} />`)}
    </div>
    <footer class="meta" style="margin-top:2rem;text-align:center">
      API spec: <a class="mono" href="/openapi.json">/openapi.json</a> · models: <a class="mono" href="/api/models">/api/models</a>
    </footer>`;
}

render(html`<${App} />`, document.getElementById('root'));
</script>
</body>
</html>
