<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prompt-explore · jobs</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1d212b; --border: #2a2f3b;
    --text: #e6e8ec; --text-dim: #9aa3b2; --accent: #7c6cff; --accent-2: #5a4bd6;
    --red: #ff6b6b; --green: #51cf8a; --amber: #f5b556;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.55; }
  .wrap { max-width: 940px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  header { display: flex; align-items: baseline; gap: 0.7rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
  header h1 { font-size: 1.15rem; margin: 0; }
  header .sub { color: var(--text-dim); font-size: 0.85rem; }
  header .auto { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }
  .meta { color: var(--text-dim); font-size: 0.85rem; }
  .card { background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 1rem 1.1rem; margin: 0.7rem 0; }
  .card h2 { font-size: 0.92rem; margin: 0; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .mono { font-family: var(--mono); }
  .badge { display: inline-block; font-size: 0.74rem; font-weight: 700;
    padding: 0.16rem 0.55rem; border-radius: 999px; letter-spacing: 0.02em; }
  .badge.running { background: rgba(124,108,255,0.16); color: #b7aaff; border: 1px solid rgba(124,108,255,0.4); }
  .badge.done { background: rgba(81,207,138,0.12); color: var(--green); border: 1px solid rgba(81,207,138,0.35); }
  .badge.failed { background: rgba(255,107,107,0.12); color: var(--red); border: 1px solid rgba(255,107,107,0.35); }
  .badge.witness_found { background: rgba(255,107,107,0.14); color: var(--red); border: 1px solid rgba(255,107,107,0.4); }
  .badge.no_witness_within_budget { background: rgba(81,207,138,0.12); color: var(--green); border: 1px solid rgba(81,207,138,0.35); }
  .badge.partial { background: rgba(245,181,86,0.14); color: var(--amber); border: 1px solid rgba(245,181,86,0.35); }
  .badge.error { background: rgba(255,107,107,0.14); color: var(--red); border: 1px solid rgba(255,107,107,0.4); }
  .spinner { width: 13px; height: 13px; border-radius: 50%; display: inline-block;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { color: var(--text-dim); text-align: center; padding: 3rem 0; }
  details { margin-top: 0.4rem; }
  summary { cursor: pointer; color: var(--text-dim); font-size: 0.84rem; user-select: none; }
  summary:hover { color: var(--text); }
  .scen { border-left: 2px solid var(--border); padding-left: 0.8rem; margin: 0.6rem 0; }
  .scen-head { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .scen-id { font-family: var(--mono); font-size: 0.82rem; }
  .step { font-family: var(--mono); font-size: 0.76rem; color: var(--text-dim);
    margin: 0.25rem 0; padding: 0.3rem 0.45rem; background: var(--panel-2);
    border-radius: 5px; border-left: 2px solid var(--border); }
  .step .tool { color: var(--text); font-weight: 600; }
  .chat { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.4rem; }
  .bubble { max-width: 82%; padding: 0.4rem 0.6rem; border-radius: 9px; font-size: 0.8rem; }
  .bubble.put { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--border); }
  .bubble.sim { align-self: flex-end; background: rgba(124,108,255,0.10); border: 1px solid rgba(124,108,255,0.30); }
  .bubble .role { font-size: 0.66rem; color: var(--text-dim); margin-bottom: 0.18rem; letter-spacing: 0.04em; }
  .bubble .body { white-space: pre-wrap; word-break: break-word; }
  .bubble .body.tool { font-family: var(--mono); font-size: 0.76rem; }
  .note { color: var(--amber); font-size: 0.82rem; }
  .fade { opacity: 0.6; }
  button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.3rem 0.7rem; cursor: pointer; font-size: 0.8rem; }
  button:hover { border-color: var(--accent); }
  .toggle { font-size: 0.78rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>prompt-explore</h1>
    <span class="sub">job overview</span>
    <span class="auto">
      <label class="meta"><input type="checkbox" id="autorefresh" checked> auto-refresh</label>
      <button class="toggle" id="expandall">expand all logs</button>
    </span>
  </header>
  <div id="jobs"></div>
</div>
<script>
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const API = id => `/api/investigations${id ? '/'+id : ''}`;
function fmtUsage(u){ if(!u) return ""; const c=u.cache_read_tokens?` <span class="meta">(${u.cache_read_tokens.toLocaleString()} cached)</span>`:""; return `${u.input_tokens.toLocaleString()} in${c} / ${u.output_tokens.toLocaleString()} out · ${u.llm_calls} llm · ${u.tool_calls} tool calls`; }
function pretty(v){ try { return JSON.stringify(v, null, 2); } catch { return String(v); } }
function relTime(ms){ const s=(Date.now()-ms)/1000; if(s<60) return `${Math.floor(s)}s ago`; if(s<3600) return `${Math.floor(s/60)}m ago`; return `${Math.floor(s/3600)}h ago`; }

// --- chat bubbles (PUT left, sim right) ---
function bubble(side, role, bodyHtml, bodyClass) {
  return `<div class="bubble ${side}"><div class="role">${role}</div><div class="body${bodyClass?' '+bodyClass:''}">${bodyHtml}</div></div>`;
}
function stepBubbles(st) {
  const out = [];
  if (st.model_output && st.model_output.trim()) out.push(bubble("put","PUT",esc(st.model_output)));
  if (st.tool_call) {
    const a = st.tool_call.args;
    const args = typeof a === "string" ? a : JSON.stringify(a);
    out.push(bubble("put","PUT · tool",`🔧 ${esc(st.tool_call.name)}(${esc(args)})`,"tool"));
  }
  if (st.tool_response != null) {
    const t = typeof st.tool_response === "string" ? st.tool_response : JSON.stringify(st.tool_response, null, 2);
    out.push(bubble("sim","SIM",esc(t)));
  }
  return out.join("");
}
// Render chat bubbles for steps[fromIndex:]. The opening USER bubble is
// rendered separately (once) so appends don't duplicate it.
function stepBubblesFrom(steps, from) {
  return (steps||[]).slice(from).map(stepBubbles).join("");
}
function userBubble(s) {
  return (s.user_message && s.user_message.trim()) ? bubble("sim","USER",esc(s.user_message)) : "";
}
function chatInner(s) {
  return userBubble(s) + stepBubblesFrom(s.steps, 0);
}

function scenBadge(s) {
  const st = s.state||{}, kind = st.kind||"running";
  if (kind === "running") return `<span class="badge scen-badge running"><span class="spinner"></span> running</span>`;
  if (kind === "done") return `<span class="badge scen-badge ${st.matched?'witness_found':'no_witness_within_budget'}">${st.matched?'witness':'no match'}</span>`;
  if (kind === "failed") return `<span class="badge scen-badge error">failed: ${esc(st.stage)}</span>`;
  return "";
}

function renderScenario(s, input) {
  const st = s.state||{}, kind = st.kind||"running";
  const failNote = kind === "failed" ? `<div class="note" style="margin:0.3rem 0">${esc(st.error)}</div>` : '';
  const spec = input ? `<details class="spec">
    <summary>scenario spec (narrative)</summary>
    <div class="body" style="white-space:pre-wrap;word-break:break-word;padding:0.3rem 0">${esc(input.narrative || '(no narrative)')}</div>
    ${input.simulator_notes ? `<div class="meta" style="margin-top:0.4rem"><b>simulator notes:</b> ${esc(input.simulator_notes)}</div>`:''}
    ${input.world_state && Object.keys(input.world_state).length ? `<details class="statenote"><summary class="meta">world state</summary><pre class="step" style="max-height:9em;overflow:auto">${esc(pretty(input.world_state))}</pre></details>`:''}
  </details>` : '';
  return `<div class="scen" data-scen="${esc(s.scenario_id)}">
    <div class="scen-head"><span class="scen-id">${esc(s.scenario_id)}</span> ${scenBadge(s)}
      <span class="meta scen-count">${(s.steps||[]).length} turn(s)</span></div>
    ${failNote}
    ${spec}
    <details class="conv"><summary>conversation</summary>
      <div class="chat" data-steps="${(s.steps||[]).length}">${chatInner(s)}</div>
    </details>
  </div>`;
}

function renderPut(put) {
  if (!put) return '';
  const tools = (put.tools||[]).map(t => `<span class="badge" style="background:var(--panel-2)">${esc(t.name)}</span>`).join(' ');
  return `<details class="put" style="margin-top:0.4rem">
    <summary class="meta">prompt under test</summary>
    <div class="meta" style="margin:0.3rem 0"><b>design goals:</b> ${esc(put.design_goals||'')}</div>
    ${tools ? `<div class="meta" style="margin:0.3rem 0"><b>tools:</b> ${tools}</div>`:''}
    <details style="margin-top:0.3rem"><summary class="meta">template</summary><div class="body" style="white-space:pre-wrap;word-break:break-word;padding:0.3rem 0;font-size:0.78rem">${esc(put.template||'')}</div></details>
  </details>`;
}

function renderResultLine(j) {
  const r = j.result; if (!r) return '';
  const rr = r.result;
  let html = `<div class="result" style="margin-top:0.5rem">
    <span class="badge ${esc(rr.status)}">${esc(rr.status)}</span>
    <span class="meta"> ${rr.scenarios_tried} scenario(s) · ${r.attempts.length} judged${(rr.failures&&rr.failures.length)?' · '+rr.failures.length+' failed':''}</span>
    ${r.usage ? `<div class="meta" style="margin-top:0.2rem">${fmtUsage(r.usage)}</div>`:''}
  </div>`;
  if (rr.failures && rr.failures.length) {
    html += `<details style="margin-top:0.3rem"><summary class="note">failures</summary><div>${rr.failures.map(f=>`<div class="step"><span class="tool">${esc(f.scenario_id)}</span> (${esc(f.stage)}): ${esc(f.error)}</div>`).join('')}</div></details>`;
  }
  return html;
}

function renderJob(j) {
  const p = j.progress || { scenarios: [] };
  const inputById = {}; (j.scenarios||[]).forEach(s => { inputById[s.id] = s; });
  const scenHtml = (p.scenarios||[]).map(s => renderScenario(s, inputById[s.scenario_id])).join("");
  return `<div class="card" data-job="${esc(j.id)}">
    <h2><span class="badge job-status ${esc(j.status)}">${esc(j.status)}</span>
      <span class="mono meta">${esc(j.id ? j.id.slice(0,8):'')}</span>
      <span class="meta job-time">· ${relTime(j.started_at)}</span>
    </h2>
    <div class="meta" style="margin:0.4rem 0"><b>question:</b> ${esc(j.question || '')}</div>
    ${renderPut(j.put)}
    <div class="result-wrap">${renderResultLine(j)}</div>
    <div class="scens" style="margin-top:0.5rem">${scenHtml}</div>
  </div>`;
}

// --- surgical in-place patching (preserves open logs + scroll) ---
function patchScenario(se, s) {
  const badge = se.querySelector('.scen-badge');
  const newBadge = scenBadge(s);
  if (badge && newBadge) badge.outerHTML = newBadge;
  const cnt = se.querySelector('.scen-count');
  if (cnt) cnt.textContent = `${(s.steps||[]).length} turn(s)`;
  const conv = se.querySelector('.conv');
  if (!conv) return;
  const chat = conv.querySelector('.chat');
  if (!chat) return;
  const rendered = parseInt(chat.dataset.steps || '0', 10);
  const steps = s.steps || [];
  if (conv.open) {
    // Open: append only new bubbles, preserving scroll.
    if (steps.length > rendered) {
      chat.insertAdjacentHTML("beforeend", stepBubblesFrom(steps, rendered));
      chat.dataset.steps = String(steps.length);
    }
  } else {
    // Closed: safe to rebuild fully.
    chat.innerHTML = chatInner(s);
    chat.dataset.steps = String(steps.length);
  }
}

function patchJob(card, j) {
  const badge = card.querySelector('.job-status');
  if (badge) { badge.className = `badge job-status ${esc(j.status)}`; badge.textContent = j.status; }
  const t = card.querySelector('.job-time');
  if (t) t.textContent = `· ${relTime(j.started_at)}`;
  const rw = card.querySelector('.result-wrap');
  if (rw) rw.innerHTML = renderResultLine(j);

  const inputById = {}; (j.scenarios||[]).forEach(s => { inputById[s.id] = s; });
  const scens = card.querySelector('.scens');
  if (!scens) return;
  const want = new Set((j.progress.scenarios||[]).map(s => s.scenario_id));
  scens.querySelectorAll('[data-scen]').forEach(e => { if (!want.has(e.dataset.scen)) e.remove(); });
  (j.progress.scenarios||[]).forEach(s => {
    let se = scens.querySelector(`[data-scen="${CSS.escape(s.scenario_id)}"]`);
    if (se) patchScenario(se, s);
    else { const tmp = document.createElement('div'); tmp.innerHTML = renderScenario(s, inputById[s.scenario_id]); if (tmp.firstElementChild) scens.appendChild(tmp.firstElementChild); }
  });
}

async function refresh() {
  const el = document.getElementById('jobs');
  try {
    const list = await fetch(API()).then(r => r.json());
    if (!list.length) { el.innerHTML = '<div class="empty">No jobs. Start one via <span class="mono">POST /api/investigations</span>.</div>'; return; }
    const views = await Promise.all(list.map(s => fetch(API(s.id)).then(r => r.json())));
    const wantIds = new Set(views.map(v => v.id));
    el.querySelectorAll('[data-job]').forEach(c => { if (!wantIds.has(c.dataset.job)) c.remove(); });
    views.forEach(v => {
      const card = el.querySelector(`[data-job="${CSS.escape(v.id)}"]`);
      if (card) patchJob(card, v);
      else { const tmp = document.createElement('div'); tmp.innerHTML = renderJob(v); if (tmp.firstElementChild) el.appendChild(tmp.firstElementChild); }
    });
  } catch (e) { console.error(e); }
}

document.getElementById('expandall').onclick = () => {
  const all = [...document.querySelectorAll('#jobs details')];
  const open = all.some(d => d.hasAttribute('open'));
  all.forEach(d => { if (open) d.removeAttribute('open'); else d.setAttribute('open',''); });
};
setInterval(() => { if (document.getElementById('autorefresh').checked) refresh(); }, 2500);
refresh();
</script>
</body>
</html>
