<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prompt-explore · jobs</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1d212b; --border: #2a2f3b;
    --text: #e6e8ec; --text-dim: #9aa3b2; --accent: #7c6cff; --accent-2: #5a4bd6;
    --red: #ff6b6b; --green: #51cf8a; --amber: #f5b556;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.55; }
  .wrap { max-width: 940px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  header { display: flex; align-items: baseline; gap: 0.7rem; margin-bottom: 1.2rem; }
  header h1 { font-size: 1.15rem; margin: 0; }
  header .sub { color: var(--text-dim); font-size: 0.85rem; }
  header .auto { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }
  .meta { color: var(--text-dim); font-size: 0.85rem; }
  .card { background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 1rem 1.1rem; margin: 0.7rem 0; }
  .card h2 { font-size: 0.92rem; margin: 0; display: flex; align-items: center; gap: 0.6rem; }
  .mono { font-family: var(--mono); }
  .badge { display: inline-block; font-size: 0.74rem; font-weight: 700;
    padding: 0.16rem 0.55rem; border-radius: 999px; letter-spacing: 0.02em; }
  .badge.running { background: rgba(124,108,255,0.16); color: #b7aaff; border: 1px solid rgba(124,108,255,0.4); }
  .badge.done { background: rgba(81,207,138,0.12); color: var(--green); border: 1px solid rgba(81,207,138,0.35); }
  .badge.failed { background: rgba(255,107,107,0.12); color: var(--red); border: 1px solid rgba(255,107,107,0.35); }
  .badge.witness_found { background: rgba(255,107,107,0.14); color: var(--red); border: 1px solid rgba(255,107,107,0.4); }
  .badge.no_witness_within_budget { background: rgba(81,207,138,0.12); color: var(--green); border: 1px solid rgba(81,207,138,0.35); }
  .badge.partial { background: rgba(245,181,86,0.14); color: var(--amber); border: 1px solid rgba(245,181,86,0.35); }
  .badge.error { background: rgba(255,107,107,0.14); color: var(--red); border: 1px solid rgba(255,107,107,0.4); }
  .spinner { width: 13px; height: 13px; border-radius: 50%; display: inline-block;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { color: var(--text-dim); text-align: center; padding: 3rem 0; }
  details { margin-top: 0.4rem; }
  summary { cursor: pointer; color: var(--text-dim); font-size: 0.84rem; user-select: none; }
  summary:hover { color: var(--text); }
  .scen { border-left: 2px solid var(--border); padding-left: 0.8rem; margin: 0.6rem 0; }
  .scen-head { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .scen-id { font-family: var(--mono); font-size: 0.82rem; }
  .step { font-family: var(--mono); font-size: 0.76rem; color: var(--text-dim);
    margin: 0.25rem 0; padding: 0.3rem 0.45rem; background: var(--panel-2);
    border-radius: 5px; border-left: 2px solid var(--border); }
  .step .n { color: var(--accent); }
  .step .tool { color: var(--text); font-weight: 600; }
  .step .resp { display: block; margin-top: 0.2rem; white-space: pre-wrap; word-break: break-word; max-height: 9em; overflow: auto; }
  .note { color: var(--amber); font-size: 0.82rem; }
  .fade { opacity: 0.6; }
  button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.3rem 0.7rem; cursor: pointer; font-size: 0.8rem; }
  button:hover { border-color: var(--accent); }
  .toggle { font-size: 0.78rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>prompt-explore</h1>
    <span class="sub">job overview</span>
    <span class="auto">
      <label class="meta"><input type="checkbox" id="autorefresh" checked> auto-refresh</label>
      <button class="toggle" id="expandall">expand all logs</button>
    </span>
  </header>
  <div id="jobs"></div>
</div>
<script>
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const API = id => `/api/investigations${id ? '/'+id : ''}`;
function fmtUsage(u){ if(!u) return ""; const c=u.cache_read_tokens?` <span class="meta">(${u.cache_read_tokens.toLocaleString()} cached)</span>`:""; return `${u.input_tokens.toLocaleString()} in${c} / ${u.output_tokens.toLocaleString()} out · ${u.llm_calls} llm · ${u.tool_calls} tool calls`; }
function relTime(ms){ const s=(Date.now()-ms)/1000; if(s<60) return `${Math.floor(s)}s ago`; if(s<3600) return `${Math.floor(s/60)}m ago`; return `${Math.floor(s/3600)}h ago`; }

function renderStep(i, st) {
  const tc = st.tool_call, tr = st.tool_response;
  let body = "";
  if (tc) {
    const args = typeof tc.args === "string" ? tc.args : JSON.stringify(tc.args);
    body += ` → <span class="tool">${esc(tc.name)}</span>(${esc(args)})`;
  }
  if (tr != null) {
    const t = typeof tr === "string" ? tr : JSON.stringify(tr);
    body += `<span class="resp">${esc(t)}</span>`;
  }
  if (!tc && st.model_output) body += ` <span class="fade">final turn</span>`;
  return `<div class="step"><span class="n">${i}</span>${body}</div>`;
}

function renderScenario(s) {
  const st = s.state || {};
  const kind = st.kind || "running";
  let badge = "";
  if (kind === "running") badge = `<span class="badge running"><span class="spinner"></span> running</span>`;
  else if (kind === "done") badge = `<span class="badge ${st.matched ? 'witness_found':'no_witness_within_budget'}">${st.matched ? 'witness':'no match'}</span>`;
  else if (kind === "failed") badge = `<span class="badge error">failed: ${esc(st.stage)}</span>`;
  const failNote = kind === "failed" ? `<div class="note" style="margin:0.3rem 0">${esc(st.error)}</div>` : '';
  const steps = (s.steps||[]).map((st,i)=>renderStep(i,st)).join("");
  const open = kind === "running" ? '' : ''; // collapsed by default
  return `<div class="scen">
    <div class="scen-head"><span class="scen-id">${esc(s.scenario_id)}</span> ${badge}
      <span class="meta">${(s.steps||[]).length} step(s)</span></div>
    ${failNote}
    <details ${open}>
      <summary>tool-call log</summary>
      <div style="margin-top:0.35rem">${steps || '<span class="meta">(no steps yet)</span>'}</div>
    </details>
  </div>`;
}

function renderJob(j) {
  const p = j.progress || { scenarios: [] };
  const r = j.result;
  const scenHtml = (p.scenarios||[]).map(renderScenario).join("");
  let resultLine = "";
  if (r) {
    const rr = r.result;
    resultLine = `<div style="margin-top:0.5rem">
      <span class="badge ${esc(rr.status)}">${esc(rr.status)}</span>
      <span class="meta"> ${rr.scenarios_tried} scenario(s) · ${r.attempts.length} judged${(rr.failures&&rr.failures.length)?' · '+rr.failures.length+' failed':''}</span>
      ${r.usage ? `<div class="meta" style="margin-top:0.2rem">${fmtUsage(r.usage)}</div>`:''}
    </div>`;
    if (rr.failures && rr.failures.length) {
      resultLine += `<details style="margin-top:0.3rem"><summary class="note">failures</summary><div>${rr.failures.map(f=>`<div class="step"><span class="tool">${esc(f.scenario_id)}</span> (${esc(f.stage)}): ${esc(f.error)}</div>`).join('')}</div></details>`;
    }
  }
  return `<div class="card">
    <h2><span class="badge ${esc(j.status)}">${esc(j.status)}</span>
      <span class="mono meta">${esc(j.id ? j.id.slice(0,8):'')}</span>
      <span class="meta">· ${relTime(j.started_at)}</span>
    </h2>
    ${resultLine}
    <div style="margin-top:0.5rem">${scenHtml}</div>
  </div>`;
}

async function refresh() {
  try {
    const list = await fetch(API()).then(r => r.json());
    const el = document.getElementById('jobs');
    if (!list.length) { el.innerHTML = '<div class="empty">No jobs. Start one via <span class="mono">POST /api/investigations</span>.</div>'; return; }
    const views = await Promise.all(list.map(s => fetch(API(s.id)).then(r => r.json())));
    el.innerHTML = views.map(renderJob).join("");
  } catch (e) { console.error(e); }
}
document.getElementById('expandall').onclick = () => {
  const open = [...document.querySelectorAll('#jobs details[open]')].length < [...document.querySelectorAll('#jobs details')].length;
  document.querySelectorAll('#jobs details').forEach(d => { if (open) d.setAttribute('open',''); else d.removeAttribute('open'); });
};
let timer = setInterval(() => { if (document.getElementById('autorefresh').checked) refresh(); }, 2500);
refresh();
</script>
</body>
</html>
